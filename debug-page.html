<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录调试</title>
    <script>
        // 加载userAuth模块
        console.log('🔄 加载页面...');
    </script>
</head>
<body>
    <h1>登录调试页面</h1>
    
    <div>
        <p><strong>测试步骤：</strong></p>
        <ol>
            <li>打开浏览器开发者工具</li>
            <li>查看控制台日志</li>
            <li>点击按钮进行测试</li>
        </ol>
    </div>

    <div style="margin: 20px 0;">
        <input type="text" id="phone" value="138****0000" placeholder="手机号" style="padding: 8px; width: 200px;">
        <input type="password" id="password" value="demo123" placeholder="密码" style="padding: 8px; width: 200px; margin-left: 10px;">
        <button onclick="debugLogin()" style="padding: 8px 16px; margin-left: 10px;">测试登录</button>
    </div>

    <div id="log" style="background: #f5f5f5; padding: 15px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow-y: auto;"></div>

    <script src="js/user-auth.js"></script>
    <script>
        const logDiv = document.getElementById('log');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            logDiv.textContent += logEntry + '\n';
            console.log(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function logError(message, error) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ❌ ${message}`;
            logDiv.textContent += logEntry + '\n';
            if (error) {
                logDiv.textContent += `    错误: ${error.message}\n`;
                logDiv.textContent += `    堆栈: ${error.stack}\n`;
            }
            console.error(logEntry, error);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function logSuccess(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ✅ ${message}`;
            logDiv.textContent += logEntry + '\n';
            console.log(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // 页面加载时检查userAuthInstance
        window.addEventListener('load', function() {
            log('🔄 页面加载完成');
            
            // 检查userAuthInstance
            if (typeof userAuthInstance !== 'undefined') {
                logSuccess('userAuthInstance 已加载');
                log(`📡 API基础URL: ${userAuthInstance.apiBaseUrl}`);
            } else {
                logError('userAuthInstance 未定义');
                return;
            }

            // 测试isValidEmail函数
            const testValues = ['test@example.com', '138****0000', 'user@domain'];
            log('🧪 测试isValidEmail函数:');
            testValues.forEach(value => {
                const result = userAuthInstance.isValidEmail(value);
                log(`   "${value}" -> ${result ? '邮箱' : '手机号'}`);
            });
        });

        async function debugLogin() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            
            log('🔍 开始调试登录...');
            log(`📱 手机号: ${phone}`);
            log(`🔑 密码: ${password}`);

            try {
                // 1. 直接API测试
                log('📡 测试1: 直接API调用');
                const directResponse = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        phone: phone,
                        password: password
                    })
                });
                
                log(`📊 直接API状态: ${directResponse.status}`);
                const directText = await directResponse.text();
                log(`📝 直接API响应: ${directText.substring(0, 200)}${directText.length > 200 ? '...' : ''}`);
                
                let directData;
                try {
                    directData = JSON.parse(directText);
                    logSuccess('直接API JSON解析成功');
                } catch (e) {
                    logError('直接API JSON解析失败', e);
                    return;
                }

                // 2. userAuthInstance测试
                log('📡 测试2: userAuthInstance.login()');
                const authResult = await userAuthInstance.login(phone, password, true);
                log(`📊 userAuth结果: ${authResult.success ? '成功' : '失败'}`);
                
                if (authResult.success) {
                    logSuccess('userAuthInstance 登录成功');
                    log(`👤 用户: ${authResult.user?.username || '未知'}`);
                } else {
                    logError('userAuthInstance 登录失败', new Error(authResult.message || '未知错误'));
                }

            } catch (error) {
                logError('登录测试失败', error);
            }
        }
    </script>
</body>
</html>
