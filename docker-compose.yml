services:
  # 数据库服务
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: superresumemaster
      MYSQL_ROOT_PASSWORD: YourStrongPassword
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - srm-network

  # 后端 + 前端服务
  app:
    build:
      context: .
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/backend/uploads
    depends_on:
      - db
    networks:
      - srm-network

networks:
  srm-network:
    driver: bridge
