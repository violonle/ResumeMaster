version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: super-resume-master:latest
    container_name: srm-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_DIALECT=${DB_DIALECT:-mysql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-superresumemaster}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-Longkou7~!}
      - JWT_SECRET=${JWT_SECRET:-a7f3k9m2x8p1q4w5e8r0t3y6u1i2o5p8a9s1d2f3g4h5j6k7l8z9x0c1v2b3n4m5q6w7e8r9t0y1u2i3o4p5a6s7d8f9g0h1j2k3l4z5x6c7v8b9n0m1q2w3e4r5t6y7u8i9o0p}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: srm-db
    restart: always
    environment:
      - MYSQL_DATABASE=${DB_NAME:-superresumemaster}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-Longkou7~!}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Longkou7~!}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: srm-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
