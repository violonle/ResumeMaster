version: '3.8'

services:
  app:
    image: letuyang/super-resume-master:latest
    container_name: srm-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_DIALECT=${DB_DIALECT:-mysql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-superresumemaster}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-YourStrongPassword}
      - JWT_SECRET=${JWT_SECRET:-your_prod_secret_key}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: srm-db
    restart: always
    environment:
      - MYSQL_DATABASE=${DB_NAME:-superresumemaster}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-YourStrongPassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-YourStrongPassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
