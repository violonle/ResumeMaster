services:
  db:
    image: mysql:8.0
    container_name: srm-mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: superresumemaster
      MYSQL_ROOT_PASSWORD: YourStrongPassword
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - srm-network

  app:
    build:
      context: .
    image: letuyang/super-resume-master:latest
    container_name: srm-app
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - srm-network

networks:
  srm-network:
    driver: bridge
