<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历智能解析与对比 - 争湃·简历大师</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="../js/tailwindcss.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Shared Utils -->
    <script src="../js/user-auth.js"></script>
    <script src="../js/header-profile.js"></script>
    <script src="../js/ui-components.js"></script>
    <script src="../js/resume-data.js?v=3"></script>
    <script src="/js/sidebar.js"></script>
    <script src="../js/resume-upload-handler.js"></script>
    
    <!-- Parsing Specific -->
    <script src="../js/ai-analyzer.js"></script>
    <script src="../js/resume-parser.js"></script>
    
    <!-- Comparison Specific -->
    <script src="../js/chart-utils.js"></script>
    <script src="../js/resume-comparison.js"></script>

    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>
        .sidebar-left {
            width: 360px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 64px; /* Matches header height */
            height: calc(100vh - 64px);
        }
        .main-content-area {
            flex: 1;
            background: #f9fafb;
            min-height: calc(100vh - 64px);
            padding: 40px 20px;
            overflow-y: auto;
        }
        .main-content {
            padding: 64px 0 0 0 !important; /* Overriding sidebar.css to allow full-width split layout */
        }
        .tab-btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }
        .tab-btn.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
            background: #eff6ff;
        }
        .candidate-item.selected {
            border-color: #2563eb !important;
            background-color: #eff6ff !important;
        }
        .analysis-type-btn {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .analysis-type-btn.active {
            background: #2563eb;
            color: #fff;
        }
        .analysis-type-btn:not(.active) {
            background: #fff;
            color: #4b5563;
            border: 1px solid #e5e7eb;
        }
        .score-card {
            background: #fff;
            border: 1px solid #f3f4f6;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s;
        }
        .score-card:hover {
            border-color: #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.05);
        }
        .checkbox-custom {
            width: 18px;
            height: 18px;
            border: 2px solid #e5e7eb;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .checkbox-custom.checked {
            background: #2563eb;
            border-color: #2563eb;
        }
        .radar-container {
            background: #fff;
            border: 1px solid #f3f4f6;
            border-radius: 16px;
            padding: 24px;
            height: 360px;
        }
        .report-section {
            background: #fff;
            border: 1px solid #f3f4f6;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }
        .progress-bar-bg {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #2563eb;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50">
    <aside id="sidebar" class="fixed left-0 top-0 bottom-0 sidebar-modern z-40"></aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20 h-16">
        <div class="flex items-center justify-between px-6 h-full">
            <div class="flex items-center space-x-4">
                <button class="menu-button p-2 rounded-lg hover:bg-gray-100" id="sidebar-toggle">
                    <i class="fas fa-bars text-gray-900"></i>
                </button>
                <h1 class="text-xl font-bold text-gray-900">简历智能解析与对比</h1>
            </div>
            <div class="flex items-center space-x-4" id="header-right-section"></div>
        </div>
    </header>

    <div class="main-content flex" id="main-content">
        <!-- Sidebar Left (Candidate Selection) -->
        <div class="sidebar-left overflow-hidden bg-gray-50/50 p-4 pr-2">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-full overflow-hidden">
                <div class="flex border-b border-gray-100 bg-gray-50/30">
                    <button class="tab-btn active" data-tab="library">从人才库选择</button>
                    <button class="tab-btn" data-tab="upload">上传新简历</button>
                </div>

                <!-- Library Tab Content -->
                <div id="library-content" class="flex-1 flex flex-col p-4 overflow-hidden">
                    <!-- Job Selector in Sidebar -->
                    <div class="mb-4">
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block">筛选职位</label>
                        <div class="relative">
                            <select id="sidebar-job-select" class="w-full pl-4 pr-10 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none appearance-none transition-all text-sm">
                                <option value="all">全部岗位</option>
                                <!-- Jobs will be loaded here -->
                            </select>
                            <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
                                <i class="fas fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>

                    <div class="relative mb-4">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="candidate-search" placeholder="搜索候选人姓名..." 
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm bg-white">
                    </div>
                    <div id="candidate-list" class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                        <!-- Dynamic List -->
                    </div>
                </div>

                <!-- Upload Tab Content -->
                <div id="upload-content" class="hidden flex-1 flex flex-col p-4 overflow-hidden">
                    <div id="drop-zone" class="border-2 border-dashed border-gray-100 rounded-xl p-6 text-center hover:border-blue-400 hover:bg-blue-50 transition-all cursor-pointer mb-4 bg-gray-50/50">
                        <i class="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-2"></i>
                        <p class="text-sm text-gray-600 font-medium">点击上传简历</p>
                        <p class="text-xs text-gray-400 mt-1">支持 PDF, DOC, DOCX</p>
                        <input type="file" id="file-input" class="hidden" accept=".pdf,.doc,.docx,.txt" multiple>
                    </div>
                    <div id="file-list" class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                        <!-- Uploaded files will appear here -->
                    </div>
                </div>

                <div class="p-4 border-t border-gray-100 bg-gray-50/30">
                    <button id="analyze-btn" disabled class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all shadow-lg shadow-blue-100 disabled:opacity-50 disabled:shadow-none flex items-center justify-center">
                        <i class="fas fa-arrow-right mr-2"></i> 开始解析
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content Area (Right) -->
        <div class="main-content-area">
            <div class="max-w-7xl mx-auto">
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">简历智能解析与对比</h2>
                        <p class="text-gray-500 mt-1">选择候选人进行深度分析或多维度横向对比。</p>
                    </div>
                    <div class="flex bg-white p-1 rounded-lg border border-gray-200">
                        <button class="tab-btn active px-4 py-2 text-sm" data-mode="single">单一深度解析</button>
                        <button class="tab-btn px-4 py-2 text-sm" data-mode="multi">多人对比解析</button>
                    </div>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="flex flex-col items-center justify-center py-20 bg-white rounded-2xl border border-dashed border-gray-200 shadow-sm">
                    <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center mb-6">
                        <i class="fas fa-user-check text-4xl text-gray-300"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 mb-2">请在左侧选择候选人进行分析</h3>
                    <p class="text-gray-500 text-center max-w-sm">支持从现有库中选择多人进行对比，或上传新简历进行单份解析。</p>
                </div>

                <!-- Single Analysis Results -->
                <div id="single-analysis-results" class="hidden space-y-5">
                    <!-- Basic Info Card -->
                    <div class="bg-white rounded-xl p-6 border border-gray-100 shadow-sm flex items-center justify-between">
                        <div class="flex items-center space-x-6">
                            <div class="w-16 h-16 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600 text-2xl font-bold border border-blue-100">
                                <i class="fas fa-user-tie"></i>
                            </div>
                            <div>
                                <h3 id="res-name" class="text-xl font-bold text-gray-900">候选人姓名</h3>
                                <p id="res-info" class="text-sm text-gray-500 mt-1">多年经验 | 本科 | 面议</p>
                                <div class="flex items-center mt-2.5 space-x-2">
                                    <span class="px-2 py-0.5 bg-blue-50 text-blue-600 text-[10px] font-bold rounded uppercase tracking-wider">Verified Profile</span>
                                    <span class="px-2 py-0.5 bg-blue-50 text-blue-600 text-[10px] font-bold rounded uppercase tracking-wider">AI Scored</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1">Overall Match Score</div>
                            <div class="flex items-baseline justify-end space-x-1">
                                <span id="res-score" class="text-4xl font-black text-blue-600">0</span>
                                <span class="text-gray-400 font-bold text-sm">/100</span>
                            </div>
                        </div>
                    </div>

                    <!-- Unified Analysis Card -->
                    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 md:p-8">
                        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                            <h4 class="text-lg font-bold text-gray-900 flex items-center">
                                <i class="fas fa-chart-line mr-2 text-blue-600"></i>
                                核心能力多维分析
                            </h4>
                            <div class="flex items-center space-x-6 text-[10px] font-bold uppercase tracking-wider text-gray-400">
                                <span class="flex items-center"><i class="fas fa-circle text-blue-600/20 mr-1.5"></i> 维度分布</span>
                                <span class="flex items-center"><i class="fas fa-star text-blue-600 mr-1.5"></i> 精确评分</span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
                            <!-- Radar Chart -->
                            <div class="lg:col-span-7">
                                <div id="radar-container" class="h-[350px] md:h-[480px] relative">
                                    <canvas id="radarChart"></canvas>
                                </div>
                            </div>

                            <!-- Score Cards -->
                            <div class="lg:col-span-5">
                                <div id="score-cards" class="flex flex-col">
                                    <!-- Dynamic Items -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- AI Analysis Report -->
                    <div class="bg-white rounded-xl p-6 border border-gray-100 shadow-sm">
                        <h4 class="text-base font-bold text-gray-900 mb-5 flex items-center">
                            <i class="fas fa-file-invoice mr-2 text-blue-600"></i>
                            AI 深度分析报告
                        </h4>
                        <div id="ai-report" class="prose prose-blue prose-sm max-w-none text-gray-600 leading-relaxed">
                            <!-- Dynamic Content -->
                        </div>
                    </div>
                </div>

                <!-- Multi Analysis Results -->
                <div id="multi-analysis-results" class="hidden">
                    <!-- Content will be injected by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[100] hidden flex flex-col items-center justify-center">
        <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-blue-600 font-bold">AI 正在深度解析中，请稍候...</p>
        <p class="text-gray-400 text-sm mt-2">预计需要 15-30 秒</p>
    </div>

    <!-- Main Controller for this page -->
    <script src="../js/resume-tools-controller-v2.js"></script>
</body>
</html>
