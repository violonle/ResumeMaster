<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历管理 - 争湃·简历大师</title>
    <script src="../js/tailwindcss.js"></script>
    <script src="../js/ui-components.js"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script src="/js/user-auth.js"></script>
    <script src="/js/resume-data.js?v=3"></script>
    <script src="/js/header-profile.js"></script>
    <script src="/js/sidebar.js"></script>
    <style>
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .status-active {
            background-color: #2563eb;
        }
        .status-inactive {
            background-color: #6b7280;
        }
        .status-pending {
            background-color: #f59e0b;
        }
    </style>
</head>
<body class="bg-gray-50">
    <aside id="sidebar" class="fixed left-0 top-0 bottom-0 sidebar-modern z-40"></aside>

    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20">
        <div class="flex items-center justify-between p-4">
            <div class="flex items-center space-x-4"><button class="menu-button p-2 rounded-lg hover:bg-gray-100"
                    id="sidebar-toggle"><i class="fas fa-bars text-gray-600"></i></button>
                <h1 class="brand-title text-lg font-bold text-gray-900">简历管理</h1>
            </div>
            <div class="flex items-center space-x-4" id="header-right-section">
                <!-- User Profile will be rendered here -->
            </div>
        </div>
    </header>

    <main class="main-content pt-20 p-6" id="main-content">
        <div>
        <!-- 页面标题和操作 -->
        <div class="px-4 py-6 sm:px-0">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">简历管理</h1>
                    <p class="mt-2 text-sm text-gray-600">管理和分析您的简历库</p>
                </div>
                <div class="flex space-x-3">
                    <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors" onclick="uploadResume()">
                        <i class="fas fa-upload mr-2"></i>导入简历文件
                    </button>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors" onclick="batchAnalysis()">
                        <i class="fas fa-chart-line mr-2"></i>批量分析
                    </button>
                </div>
            </div>

            <!-- 二级导航 -->
            <div class="border-b border-gray-200 mb-6">
                <nav class="-mb-px flex space-x-8">
                    <a href="#" class="border-blue-500 text-blue-600 whitespace-nowrap py-2 px-1 border-b-2 font-medium text-sm" data-tab="all">全部简历</a>
                    <a href="#" class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-2 px-1 border-b-2 font-medium text-sm" data-tab="analyzed">已分析</a>
                    <a href="#" class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-2 px-1 border-b-2 font-medium text-sm" data-tab="pending">待分析</a>
                    <a href="#" class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-2 px-1 border-b-2 font-medium text-sm" data-tab="favorites">收藏夹</a>
                </nav>
            </div>

            <!-- 筛选和搜索 -->
            <div class="bg-white rounded-lg shadow p-4 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">搜索简历</label>
                        <input type="text" placeholder="输入姓名或关键词" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">工作经验</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">全部</option>
                            <option value="0-1">0-1年</option>
                            <option value="1-3">1-3年</option>
                            <option value="3-5">3-5年</option>
                            <option value="5+">5年以上</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">分析状态</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">全部状态</option>
                            <option value="analyzed">已分析</option>
                            <option value="pending">待分析</option>
                            <option value="failed">分析失败</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 简历列表 -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg font-medium text-gray-900">简历列表</h3>
                        <div class="flex items-center space-x-2">
                            <span class="text-sm text-gray-500">共 <span id="total-count">24</span> 份简历</span>
                            <button class="text-gray-400 hover:text-gray-600">
                                <i class="fas fa-th-large"></i>
                            </button>
                            <button class="text-blue-600 hover:text-blue-800">
                                <i class="fas fa-list"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="divide-y divide-gray-200" id="resume-list">
                    <!-- 简历项目模板 -->
                    <div class="p-6 hover:bg-gray-50 transition-colors">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <div class="flex-shrink-0">
                                    <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                                        <i class="fas fa-file-alt text-blue-600 text-xl"></i>
                                    </div>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center space-x-2">
                                        <h4 class="text-lg font-medium text-gray-900">张三 - 前端开发工程师</h4>
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                                            已分析
                                        </span>
                                    </div>
                                    <div class="mt-1 flex items-center space-x-4 text-sm text-gray-500">
                                        <span><i class="fas fa-calendar mr-1"></i>3年经验</span>
                                        <span><i class="fas fa-map-marker-alt mr-1"></i>北京</span>
                                        <span><i class="fas fa-graduation-cap mr-1"></i>本科</span>
                                        <span><i class="fas fa-clock mr-1"></i>2024-01-15 上传</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <div class="text-right">
                                    <div class="text-lg font-semibold text-blue-600">85分</div>
                                    <div class="text-xs text-gray-500">匹配度</div>
                                </div>
                                <div class="flex flex-col space-y-1">
                                    <button class="text-blue-600 hover:text-blue-800 text-sm" onclick="viewResume(1)">
                                        <i class="fas fa-eye mr-1"></i>查看
                                    </button>
                                    <button class="text-blue-600 hover:text-blue-800 text-sm" onclick="analyzeResume(1)">
                                        <i class="fas fa-chart-line mr-1"></i>分析
                                    </button>
                                    <button class="text-yellow-600 hover:text-yellow-800 text-sm" onclick="favoriteResume(1)">
                                        <i class="fas fa-star mr-1"></i>收藏
                                    </button>
                                    <button class="text-red-600 hover:text-red-800 text-sm" onclick="deleteResume(1)">
                                        <i class="fas fa-trash mr-1"></i>删除
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 更多简历项目... -->
                    <div class="p-6 hover:bg-gray-50 transition-colors">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <div class="flex-shrink-0">
                                    <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center">
                                        <i class="fas fa-file-alt text-orange-600 text-xl"></i>
                                    </div>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center space-x-2">
                                        <h4 class="text-lg font-medium text-gray-900">李四 - Java后端开发</h4>
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">
                                            待分析
                                        </span>
                                    </div>
                                    <div class="mt-1 flex items-center space-x-4 text-sm text-gray-500">
                                        <span><i class="fas fa-calendar mr-1"></i>5年经验</span>
                                        <span><i class="fas fa-map-marker-alt mr-1"></i>上海</span>
                                        <span><i class="fas fa-graduation-cap mr-1"></i>硕士</span>
                                        <span><i class="fas fa-clock mr-1"></i>2024-01-14 上传</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <div class="text-right">
                                    <div class="text-lg font-semibold text-gray-400">--</div>
                                    <div class="text-xs text-gray-500">未分析</div>
                                </div>
                                <div class="flex flex-col space-y-1">
                                    <button class="text-blue-600 hover:text-blue-800 text-sm" onclick="viewResume(2)">
                                        <i class="fas fa-eye mr-1"></i>查看
                                    </button>
                                    <button class="text-blue-600 hover:text-blue-800 text-sm" onclick="analyzeResume(2)">
                                        <i class="fas fa-chart-line mr-1"></i>分析
                                    </button>
                                    <button class="text-yellow-600 hover:text-yellow-800 text-sm" onclick="favoriteResume(2)">
                                        <i class="fas fa-star mr-1"></i>收藏
                                    </button>
                                    <button class="text-red-600 hover:text-red-800 text-sm" onclick="deleteResume(2)">
                                        <i class="fas fa-trash mr-1"></i>删除
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 分页 -->
                <div class="bg-white px-4 py-3 border-t border-gray-200 sm:px-6">
                    <div class="flex items-center justify-between">
                        <div class="flex-1 flex justify-between sm:hidden">
                            <button class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                                上一页
                            </button>
                            <button class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                                下一页
                            </button>
                        </div>
                        <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                            <div>
                                <p class="text-sm text-gray-700">
                                    显示第 <span class="font-medium">1</span> 到 <span class="font-medium">10</span> 条，共 <span class="font-medium">24</span> 条记录
                                </p>
                            </div>
                            <div>
                                <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px">
                                    <button class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                        <i class="fas fa-chevron-left"></i>
                                    </button>
                                    <button class="bg-blue-50 border-blue-500 text-blue-600 relative inline-flex items-center px-4 py-2 border text-sm font-medium">1</button>
                                    <button class="bg-white border-gray-300 text-gray-500 hover:bg-gray-50 relative inline-flex items-center px-4 py-2 border text-sm font-medium">2</button>
                                    <button class="bg-white border-gray-300 text-gray-500 hover:bg-gray-50 relative inline-flex items-center px-4 py-2 border text-sm font-medium">3</button>
                                    <button class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                        <i class="fas fa-chevron-right"></i>
                                    </button>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            // Check auth
            if (typeof userAuthInstance !== 'undefined' && !userAuthInstance.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }

            // Init Sidebar and Header
            if (typeof Sidebar !== 'undefined') {
                Sidebar.init({ active: 'librarypool' });
            }
            if (typeof HeaderProfile !== 'undefined') {
                HeaderProfile.init();
            }

            initTabs();
        });

        // 初始化标签页
        function initTabs() {
            const tabs = document.querySelectorAll('[data-tab]');
            tabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    // 移除所有活动状态
                    tabs.forEach(t => {
                        t.classList.remove('border-blue-500', 'text-blue-600');
                        t.classList.add('border-transparent', 'text-gray-500');
                    });
                    
                    // 添加当前活动状态
                    tab.classList.remove('border-transparent', 'text-gray-500');
                    tab.classList.add('border-blue-500', 'text-blue-600');
                    
                    // 这里可以添加切换内容的逻辑
                    const tabType = tab.getAttribute('data-tab');
                    filterResumesByTab(tabType);
                });
            });
        }

        // 根据标签页筛选简历
        function filterResumesByTab(tabType) {
            console.log('切换到标签页:', tabType);
            // 这里可以实现实际的筛选逻辑
        }

        // 导入简历文件
        function uploadResume() {
            ui.showNotification('导入简历文件功能开发中...', 'info');
        }

        // 批量分析
        function batchAnalysis() {
            ui.showNotification('批量分析功能开发中...', 'info');
        }

        // 查看简历
        function viewResume(id) {
            ui.showNotification(`查看简历 ID: ${id}`, 'success');
        }

        // 分析简历
        function analyzeResume(id) {
            ui.showNotification(`分析简历 ID: ${id}`, 'success');
        }

        // 收藏简历
        function favoriteResume(id) {
            ui.showNotification(`收藏简历 ID: ${id}`, 'success');
        }

        // 删除简历
        async function deleteResume(resumeId) {
            // 显示确认对话框
            if (confirm(`确定要删除这份简历吗？此操作不可恢复。`)) {
                try {
                    // 调用删除API
                    const success = await window.resumeDataManager.deleteResume(resumeId);
                    if (success) {
                        ui.showNotification('简历删除成功', 'success');
                        // 刷新简历列表数据
                        await refreshResumeList();
                    } else {
                        ui.showNotification('简历不存在或已被删除', 'warning');
                    }
                } catch (error) {
                    console.error('删除简历失败:', error);
                    ui.showNotification(`删除失败: ${error.message}`, 'error');
                }
            }
        }

        // 刷新简历列表
        async function refreshResumeList() {
            try {
                // 显示加载状态
                const resumeList = document.getElementById('resume-list');
                const totalCount = document.getElementById('total-count');
                
                // 清空当前列表
                resumeList.innerHTML = '<div class="p-6 text-center text-gray-500">正在加载简历数据...</div>';
                
                // 获取最新简历数据
                const resumes = await window.resumeDataManager.getTalentPoolResumes();
                
                // 重新渲染简历列表
                renderResumeList(resumes);
                
                // 更新总数
                if (totalCount) {
                    totalCount.textContent = resumes.length;
                }
            } catch (error) {
                console.error('刷新简历列表失败:', error);
                ui.showNotification('刷新失败: 无法获取最新简历数据', 'error');
            }
        }

        // 渲染简历列表
        function renderResumeList(resumes) {
            const resumeList = document.getElementById('resume-list');
            
            if (!resumes || resumes.length === 0) {
                resumeList.innerHTML = '<div class="p-6 text-center text-gray-500">暂无简历数据</div>';
                return;
            }
            
            // 生成简历列表HTML
            const resumesHTML = resumes.map(resume => {
                // 获取分析结果
                const hasAnalysis = resume.status === 'analyzed';
                const analysisScore = hasAnalysis ? '85' : '--';
                const analysisStatus = hasAnalysis ? 
                    '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">已分析</span>' : 
                    '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">待分析</span>';
                
                return `
                    <div class="p-6 hover:bg-gray-50 transition-colors">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <div class="flex-shrink-0">
                                    <div class="w-12 h-12 ${hasAnalysis ? 'bg-blue-100' : 'bg-orange-100'} rounded-lg flex items-center justify-center">
                                        <i class="fas fa-file-alt ${hasAnalysis ? 'text-blue-600' : 'text-orange-600'} text-xl"></i>
                                    </div>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center space-x-2">
                                        <h4 class="text-lg font-medium text-gray-900">${resume.file_name}</h4>
                                        ${analysisStatus}
                                    </div>
                                    <div class="mt-1 flex items-center space-x-4 text-sm text-gray-500">
                                        <span><i class="fas fa-calendar mr-1"></i>${new Date(resume.upload_date).toLocaleDateString()}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <div class="text-right">
                                    <div class="text-lg font-semibold ${hasAnalysis ? 'text-blue-600' : 'text-gray-400'}">${analysisScore}分</div>
                                    <div class="text-xs text-gray-500">${hasAnalysis ? '匹配度' : '未分析'}</div>
                                </div>
                                <div class="flex flex-col space-y-1">
                                    <button class="text-blue-600 hover:text-blue-800 text-sm" onclick="viewResume(${resume.id})">
                                        <i class="fas fa-eye mr-1"></i>查看
                                    </button>
                                    <button class="text-blue-600 hover:text-blue-800 text-sm" onclick="analyzeResume(${resume.id})">
                                        <i class="fas fa-chart-line mr-1"></i>分析
                                    </button>
                                    <button class="text-yellow-600 hover:text-yellow-800 text-sm" onclick="favoriteResume(${resume.id})">
                                        <i class="fas fa-star mr-1"></i>收藏
                                    </button>
                                    <button class="text-red-600 hover:text-red-800 text-sm" onclick="deleteResume(${resume.id})">
                                        <i class="fas fa-trash mr-1"></i>删除
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            // 更新DOM
            resumeList.innerHTML = resumesHTML;
        }

        // 页面加载时初始化简历列表
        document.addEventListener('DOMContentLoaded', async function() {
            // 原有初始化代码...
            
            // 加载真实的简历数据
            if (typeof window.resumeDataManager !== 'undefined') {
                try {
                    const resumes = await window.resumeDataManager.getTalentPoolResumes();
                    renderResumeList(resumes);
                    
                    // 更新总数
                    const totalCount = document.getElementById('total-count');
                    if (totalCount) {
                        totalCount.textContent = resumes.length;
                    }
                } catch (error) {
                    console.error('初始化加载简历数据失败:', error);
                }
            }
        });
    </script>
</body>
</html>
