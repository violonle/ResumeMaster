    <script>
        // 全局变量
        let resumeComparison;
        let comparisonChart;
        
        // 页面初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('页面加载完成，开始初始化...');
            
            // 先绑定从简历库导入按钮
            const importFromLibraryBtn = document.getElementById('import-from-library-btn');
            console.log('importFromLibraryBtn:', importFromLibraryBtn);
            if (importFromLibraryBtn) {
                console.log('直接绑定从简历库导入按钮事件...');
                importFromLibraryBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    console.log('从简历库导入按钮被点击！');
                    showImportFromLibraryDialog();
                });
                console.log('按钮事件绑定完成');
            } else {
                console.error('找不到import-from-library-btn元素');
            }
            
            // 初始化简历对比模块（在存在的情况下）
            try {
                if (typeof ResumeComparison !== 'undefined') {
                    resumeComparison = new ResumeComparison();
                } else {
                    console.log('ResumeComparison 类不存在，跳过...');
                }
            } catch (error) {
                console.error('ResumeComparison 初始化失败:', error);
            }
            
            // 加载简历列表
            try {
                loadResumeList();
            } catch (error) {
                console.error('loadResumeList 失败:', error);
            }
            
            // 绑定其他事件监听器
            try {
                bindEventListeners();
            } catch (error) {
                console.error('bindEventListeners 失败:', error);
            }
            
            // 页面加载动画
            try {
                initPageAnimations();
            } catch (error) {
                console.error('initPageAnimations 失败:', error);
            }
            
            // 加载移动端导航
            try {
                loadMobileNav();
            } catch (error) {
                console.error('loadMobileNav 失败:', error);
            }

            (async function(){
                const ok = await waitForResumeDataManager(5000);
                if (ok) { populateSelectedResumesFromAPI(); loadJobsForSelect(); }
            })();
        });

        

        
        
        // 等待 resumeDataManager 就绪，避免脚本加载竞态
        async function waitForResumeDataManager(timeoutMs = 5000) {
            const start = Date.now();
            while (!window.resumeDataManager) {
                if (Date.now() - start > timeoutMs) {
                    console.warn('resumeDataManager 未就绪，跳过 API 填充');
                    return false;
                }
                await new Promise(r => setTimeout(r, 100));
            }
            return true;
        }

        // 通过 API 填充“已选择简历”模块
        async function populateSelectedResumesFromAPI() {
            const container = document.getElementById('selected-resumes-container');
            const emptyState = document.getElementById('empty-state');
            const selectedCount = document.getElementById('selected-count');

            try {
                if (!window.resumeDataManager) {
                    console.warn('resumeDataManager 未加载，暂不填充已选择简历');
                    return;
                }

                const [resumes, analyses] = await Promise.all([
                    window.resumeDataManager.getAllResumes(),
                    window.resumeDataManager.getAllAnalyses()
                ]);

                // 构建最新分析映射：resume_id -> { score, date }
                const latestMap = {};
                analyses.forEach(a => {
                    const key = a.resume_id;
                    const cur = latestMap[key];
                    if (!cur || new Date(a.analysis_date) > new Date(cur.date)) {
                        latestMap[key] = { score: a.overall_score, date: a.analysis_date };
                    }
                });

                // 映射为展示所需结构
                const mapped = (resumes || []).map(r => {
                    const fileName = r.file_name || '未知文件';
                    const name = fileName.replace(/\.[^/.]+$/, '');
                    const position = (r.parsed_data && r.parsed_data.jobTitle) || '未知职位';
                    const uploadDate = r.upload_date ? new Date(r.upload_date).toLocaleDateString('zh-CN') : new Date().toLocaleDateString('zh-CN');
                    const score = latestMap[r.id]?.score;
                    return {
                        id: r.id,
                        name,
                        fileName,
                        position,
                        experience: (r.parsed_data && r.parsed_data.experience) ? r.parsed_data.experience : '未知',
                        score: typeof score === 'number' ? score : NaN,
                        uploadDate
                    };
                }).sort((a, b) => b.uploadDate.localeCompare(a.uploadDate));

                if (emptyState) emptyState.style.display = 'block';
                if (selectedCount) selectedCount.textContent = '0份简历';
            } catch (error) {
                console.error('填充已选择简历失败:', error);
                if (emptyState) emptyState.style.display = 'block';
                if (selectedCount) selectedCount.textContent = '0份简历';
            }
        }

        // 加载简历列表（接入 API）
        async function loadResumeList() {
            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.style.display = 'block';
            updateSelectedResumesDisplay();
        }
        
        // 创建简历卡片
        function createResumeCard(resume, index) {
            const colors = [
                { bg: 'bg-blue-100', text: 'text-blue-600', border: 'border-blue-200' },
                { bg: 'bg-green-100', text: 'text-green-600', border: 'border-green-200' },
                { bg: 'bg-purple-100', text: 'text-purple-600', border: 'border-purple-200' },
                { bg: 'bg-orange-100', text: 'text-orange-600', border: 'border-orange-200' },
                { bg: 'bg-pink-100', text: 'text-pink-600', border: 'border-pink-200' }
            ];
            
            const color = colors[index % colors.length];
            const scoreText = (typeof resume.score === 'number' && !isNaN(resume.score)) ? `${resume.score}分` : '未评分';
            
            const div = document.createElement('div');
            div.className = `resume-selector rounded-xl p-6 cursor-pointer border-2 border-dashed border-gray-300 hover:${color.border} hover:bg-gray-50 transition-all duration-300`;
            div.dataset.resumeId = resume.id;
            
            div.innerHTML = `
                <div class="text-center">
                    <div class="w-16 h-16 ${color.bg} rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 ${color.text}" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/>
                        </svg>
                    </div>
                    <h3 class="font-semibold text-gray-900 mb-2">${resume.name}</h3>
                    <p class="text-sm text-gray-600 mb-2">综合评分：${scoreText}</p>
                    <p class="text-xs text-gray-500 mb-2">${resume.position}</p>
                    <p class="text-xs text-gray-500">上传时间：${resume.uploadDate}</p>
                </div>
            `;
            
            // 添加点击事件
            div.addEventListener('click', () => {
                toggleResumeSelection(resume, div);
            });
            
            return div;
        }
        
        // 切换简历选择状态
        function toggleResumeSelection(resume, element) {
            if (element.classList.contains('selected')) {
                // 取消选择
                element.classList.remove('selected', 'border-solid', 'border-blue-500', 'bg-blue-50');
                element.classList.add('border-dashed', 'border-gray-300');
                resumeComparison.removeResume(resume.id);
            } else {
                // 选择简历
                if (resumeComparison.addResume(resume)) {
                    element.classList.remove('border-dashed', 'border-gray-300');

        // 处理对比按钮点击
        async function handleCompareClick() {
            try{
                showLoadingState();
                const container = document.getElementById('selected-resumes-container');
                const cards = Array.from(container.querySelectorAll('[data-resume-id]'));
                const selectedIds = cards.map(c => parseInt(c.dataset.resumeId));
                if (selectedIds.length < 2) { hideLoadingState(); showToast('请至少选择2份简历进行对比'); return }
                const api = window.resumeDataManager;
                const tj = getTargetJob();
                const jobDescription = tj && tj.description ? tj.description : (document.getElementById('job-jd-input')?.value||'').trim();
                const analyses = await Promise.all(selectedIds.map(async (id)=>{
                    try{
                        const payload = { resumeId:id };
                        if (jobDescription) payload.jobDescription = jobDescription;
                        if (tj) payload.targetJob = tj;
                        const resp = await api.apiRequest('/ai/analyze','POST', payload);
                        if (resp && resp.success) {
                            if (resp.status === 'processing') {
                                return await pollAnalysisStatus(id);
                            }
                            const data = resp.data && resp.data.analysis ? resp.data.analysis : resp.data;
                            return data;
                        }
                    }catch(e){ /* noop */ }
                    // 回退到已有最新分析
                    try{
                        const list = await api.getAnalysesByResumeId(id).catch(()=>[]);
                        let latest = null; (list||[]).forEach(a=>{ if(!latest||new Date(a.analysis_date)>new Date(latest.analysis_date)) latest=a; });
                        return latest||null;
                    }catch(_){ return null }
                }));
                const resumes = cards.map((card, idx) => {
                    const name = card.querySelector('h3')?.textContent || card.querySelector('.font-medium')?.textContent || `简历${selectedIds[idx]}`;
                    const posExp = card.querySelector('p.text-sm.text-gray-600')?.textContent || '';
                    const position = posExp.split(' • ')[0] || '';
                    const a = analyses[idx];
                    const target = tj || null;
                    const detailsSrc = a && (a.evaluation_report || a.report) || {};
                    const details = { strengths: detailsSrc.core_strengths || detailsSrc.strengths || [], weaknesses: detailsSrc.potential_issues || detailsSrc.weaknesses || [], suggestions: detailsSrc.career_advice || detailsSrc.suggestions || [] };
                    const radar = a && (a.radar_scores || a.radarScores) || {};
                    const percent = {
                        job_match: (radar.job_match||0)*20,
                        experience_match: (radar.experience_match||0)*20,
                        learning_ability: (radar.learning_ability||0)*20,
                        teamwork: (radar.teamwork||0)*20
                    };
                    const dims = a && a.dimensions ? a.dimensions : {};
                    Object.keys(dims).forEach(k=>{ 
                        if (k.includes('技能') || k.includes('skill')) return;
                        const v=dims[k]; 
                        percent[k]= typeof v==='number'? v : (v&&v.score ? v.score : percent[k]||0) 
                    });
                    const weights = { job_match:0.40, experience_match:0.40, learning_ability:0.10, teamwork:0.10 };
                    let weighted = 0; let totalW = 0;
                    Object.keys(weights).forEach(k=>{ const v = percent[k]; if (typeof v==='number' && !isNaN(v)) { weighted += v * weights[k]; totalW += weights[k]; } });
                    const calcOverall = totalW>0 ? Math.round(weighted/totalW) : Math.round(Object.values(percent).filter(x=>typeof x==='number'&&!isNaN(x)).reduce((s,v)=>s+v,0)/Math.max(1,Object.values(percent).filter(x=>typeof x==='number'&&!isNaN(x)).length));
                    const overall = (a && (a.overall_score||a.overallScore)) || calcOverall;
                    return { name, position, scores: percent, overall, details, target };
                });
                const dimSet = new Set();
                resumes.forEach(r => Object.keys(r.scores).forEach(k => dimSet.add(k)));
                const dimensions = Array.from(dimSet).filter(d => !d.includes('技能') && !d.includes('skill'));
                const result = { resumes, dimensions };
                displayComparisonResults(result);
            }catch(e){ console.error(e); showToast('对比失败，请稍后重试') } finally { hideLoadingState() }
        }

        async function pollAnalysisStatus(resumeId){
            const api = window.resumeDataManager;
            const MAX_ATTEMPTS = 90; let attempts=0; let delayMs=2000; const MAX_DELAY_MS=10000;
            while(attempts<MAX_ATTEMPTS){
                attempts++;
                try{
                    const res = await api.apiRequest(`/ai/status/${resumeId}`, 'GET');
                    if (res && res.success) {
                        const status = res.data.status;
                        if (status === 'analyzed'){
                            const resultRes = await api.apiRequest(`/ai/result/${resumeId}`, 'GET');
                            if (resultRes && resultRes.success) {
                                return (resultRes.data && resultRes.data.analysis) ? resultRes.data.analysis : resultRes.data;
                            }
                        } else if (status === 'failed') {
                            throw new Error('分析失败');
                        } else {
                            try{
                                if (attempts % 3 === 0) {
                                    const rr = await api.apiRequest(`/ai/result/${resumeId}`, 'GET');
                                    if (rr && rr.success && rr.data) {
                                        return (rr.data && rr.data.analysis) ? rr.data.analysis : rr.data;
                                    }
                                }
                            }catch(_){ }
                        }
                    }
                }catch(e){ if (e && (e.status===401||e.status===403)) throw e }
                await new Promise(r=>setTimeout(r, delayMs)); delayMs=Math.min(MAX_DELAY_MS, Math.round(delayMs*1.3));
            }
            const latest = await api.getLatestAnalysis(resumeId).catch(()=>null);
            return latest;
        }

        // 处理文件上传
        function handleFileUpload(files) {
            const selectedResumes = getSelectedResumes();
            const maxResumes = 4;
            
            if (selectedResumes.length >= maxResumes) {
                showToast(`最多只能同时对比${maxResumes}份简历`);
                return;
            }
            
            const remainingSlots = maxResumes - selectedResumes.length;
            const filesToProcess = Array.from(files).slice(0, remainingSlots);
            
            if (files.length > remainingSlots) {
                showToast(`只能再添加${remainingSlots}份简历，已自动选择前${remainingSlots}个文件`);
            }
            
            filesToProcess.forEach(async (file) => {
                const allowedTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'text/plain'];
                if (!allowedTypes.includes(file.type) && !file.name.match(/\.(pdf|doc|docx|txt)$/i)) {
                    showToast(`文件 ${file.name} 格式不支持，请上传 PDF、DOC/DOCX 或 TXT`);
                    return;
                }
                if (file.size > 10 * 1024 * 1024) {
                    showToast(`文件 ${file.name} 超过10MB大小限制`);
                    return;
                }
                try{
                    const fd = new FormData();
                    fd.append('file', file);
                    const api = window.resumeDataManager;
                    const resp = await api.apiRequest('/ai/upload','POST', fd);
                    if (resp && resp.success) {
                        const id = resp.data && (resp.data.resumeId || resp.data.id);
                        addResumeToList({
                            id: id,
                            name: file.name.replace(/\.[^/.]+$/, ""),
                            fileName: file.name,
                            position: '已上传',
                            experience: '—',
                            score: NaN,
                            skills: [],
                            uploadDate: new Date().toLocaleDateString()
                        });
                        showToast(`简历 ${file.name} 上传成功`, 'success');
                    } else {
                        showToast(`简历 ${file.name} 上传失败`, 'error');
                    }
                }catch(e){
                    console.error('上传失败', e);
                    showToast(`简历 ${file.name} 上传失败：${e.message||'未知错误'}`, 'error');
                }
            });
        }

            const avg = (scores)=>{ const arr=Object.values(scores||{}).filter(v=>typeof v==='number'&&!isNaN(v)); if(!arr.length) return NaN; return Math.round(arr.reduce((s,v)=>s+v,0)/arr.length) }
            const winner = comparisonResult.resumes.reduce((best, cur)=>{ const b=avg(best.scores); const c=avg(cur.scores); return (isNaN(b)||c>b)? cur: best })
            const winnerNameEl = document.getElementById('winner-name')
            const winnerScoreEl = document.getElementById('winner-score')
            if (winnerNameEl) winnerNameEl.textContent = winner?.name || '—'
            if (winnerScoreEl) {
                const w = Number.isFinite(winner?.overall) ? winner.overall : avg(winner?.scores||{})
                winnerScoreEl.textContent = `• 综合评分最高（${isNaN(w)?'—':w}分）`
            }
        }

         // 准备简历库真实数据（从 API 拉取并映射）
         async function prepareLibraryData() {
             try {
                 // 若没有数据管理器或接口不可用，回退到模拟数据
                if (!window.resumeDataManager) {
                    console.warn('resumeDataManager 未加载');
                    window.allResumes = [];
                    return;
                }

                 const [resumes, analyses] = await Promise.all([
                     window.resumeDataManager.getAllResumes(),
                     window.resumeDataManager.getAllAnalyses()
                 ]);

                 // 构建最新分析映射：resume_id -> overall_score
                 const latestAnalysisMap = {};
                 analyses.forEach(a => {
                     const key = a.resume_id;
                     if (!latestAnalysisMap[key]) {
                         latestAnalysisMap[key] = { score: a.overall_score, date: a.analysis_date };
                     } else {
                         // 按分析日期取最新
                         if (new Date(a.analysis_date) > new Date(latestAnalysisMap[key].date)) {
                             latestAnalysisMap[key] = { score: a.overall_score, date: a.analysis_date };
                         }
                     }
                 });
                 window.latestAnalysisMap = latestAnalysisMap;

                 // 映射到页面展示所需结构
                 window.allResumes = (resumes || []).map(r => {
                     const fileName = r.file_name || '未知文件';
                     const extMatch = fileName.match(/\.(pdf|docx|doc|txt)$/i);
                     const fileType = extMatch ? `.${extMatch[1].toLowerCase()}` : '.pdf';
                     const baseName = fileName.replace(/\.[^/.]+$/, '');
                     const name = baseName;
                     const position = (r.parsed_data && r.parsed_data.jobTitle) || '未知职位';
                     const uploadTime = r.upload_date ? new Date(r.upload_date) : new Date();
                     const score = latestAnalysisMap[r.id]?.score ?? 'N/A';
                     return {
                         id: r.id,
                         name,
                         position,
                         fileName,
                         fileType,
                         uploadTime,
                         score,
                         experience: '未知',
                         education: '未知',
                         salary: '面议'
                     };
                 }).sort((a, b) => b.uploadTime - a.uploadTime);
            } catch (err) {
                console.error('准备简历库数据失败:', err);
                window.allResumes = [];
            }
         }

         function initLibraryModalEvents() {
             const modal = document.getElementById('library-modal');

             const searchInput = document.getElementById('resume-search-input');

             };
             
             closeBtn.onclick = closeModal;
             cancelBtn.onclick = closeModal;

                 loadLibraryResumeList();
             };
             
             sortFilter.onchange = (e) => {
                 window.librarySortFilter = e.target.value;
                 window.libraryCurrentPage = 1;
                 loadLibraryResumeList();
             };
             
             // 全选功能
             selectAllBtn.onclick = () => {
                 const currentItems = document.querySelectorAll('#resume-list .resume-item');
                 currentItems.forEach(item => {
                     const resumeId = parseInt(item.dataset.resumeId);
                     window.librarySelectedResumes.add(resumeId);
                     const checkbox = item.querySelector('input[type="checkbox"]');
                     if (checkbox) checkbox.checked = true;
                     item.classList.add('selected');
                 });
                 updateLibrarySelectionCount();
             };
             
             // 清空选择
             clearSelectionBtn.onclick = () => {
                 window.librarySelectedResumes.clear();
                 document.querySelectorAll('#resume-list .resume-item').forEach(item => {
                     const checkbox = item.querySelector('input[type="checkbox"]');
                     if (checkbox) checkbox.checked = false;
                     item.classList.remove('selected');
                 });
                 updateLibrarySelectionCount();
             };
             
             // 导入选中的简历
             importSelectedBtn.onclick = () => {
                 if (window.librarySelectedResumes.size === 0) {
                     ui.showNotification('请先选择要导入的简历', 'warning');
                     return;
                 }
                 
                 const selectedIds = Array.from(window.librarySelectedResumes);
                 const selectedResumes = (window.allResumes || []).filter(r => selectedIds.includes(r.id));
                 // 主区域最多对比4份
                 const container = document.getElementById('selected-resumes-container');
                 const maxResumes = 4;
                 const currentCount = container ? container.children.length : 0;
                 const remainingSlots = Math.max(0, maxResumes - currentCount);
                 if (remainingSlots <= 0) {
                     showToast(`最多只能同时对比${maxResumes}份简历`);
                     return;
                 }
                 const toImport = selectedResumes.slice(0, remainingSlots);
                 toImport.forEach(r => {
                     addResumeToList({
                         id: r.id,
                         name: r.name,
                         fileName: r.fileName,
                         position: r.position,
                         experience: r.experience,
                         score: typeof r.score === 'number' ? r.score : '未评分',
                         uploadDate: (r.uploadTime instanceof Date) ? r.uploadTime.toLocaleDateString('zh-CN') : new Date().toLocaleDateString('zh-CN')
                     });
                 });
                 const addedCount = toImport.length;
                 const skippedCount = selectedResumes.length - addedCount;
                 if (addedCount > 0) {
                     showToast(`已导入 ${addedCount} 份简历到对比列表`, 'success');
                 }
                 if (skippedCount > 0) {
                     showToast(`受上限限制，本次未导入 ${skippedCount} 份`, 'warning');
                 }
                 closeModal();
             };
             
             // 分页控件事件
             firstPageBtn.onclick = () => {
                 if (window.libraryCurrentPage > 1) {
                     window.libraryCurrentPage = 1;
                     loadLibraryResumeList();
                 }
             };
             
             prevPageBtn.onclick = () => {
                 if (window.libraryCurrentPage > 1) {
                     window.libraryCurrentPage--;
                     loadLibraryResumeList();
                 }
             };
             
             nextPageBtn.onclick = () => {
                 if (window.libraryCurrentPage < window.libraryTotalPages) {
                     window.libraryCurrentPage++;
                     loadLibraryResumeList();
                 }
             };
             
             lastPageBtn.onclick = () => {
                 if (window.libraryCurrentPage < window.libraryTotalPages) {
                     window.libraryCurrentPage = window.libraryTotalPages;
                     loadLibraryResumeList();
                 }
             };
         }
         
        // 加载简历库列表
        async function loadLibraryResumeList() {
             window.libraryIsLoading = true;
             
             // 获取所有简历数据
           if (!window.allResumes) {
               await prepareLibraryData();
           }
             
             // 筛选和搜索
             let filteredResumes = window.allResumes.filter(resume => {
                 // 搜索筛选
                 if (window.librarySearchKeyword) {
                     const keyword = window.librarySearchKeyword.toLowerCase();
                     if (!resume.name.toLowerCase().includes(keyword) && 
                        !resume.position.toLowerCase().includes(keyword) &&
                        !resume.fileName.toLowerCase().includes(keyword)) {
                         return false;
                     }
                 }
                 
                 // 职位筛选
                 if (window.libraryPositionFilter && resume.positionType !== window.libraryPositionFilter) {
                     return false;
                 }
                 
                 return true;
             });
             
             // 排序
             filteredResumes.sort((a, b) => {
                 switch (window.librarySortFilter) {
                     case 'time-desc':
                         return b.uploadTime - a.uploadTime;
                     case 'time-asc':
                         return a.uploadTime - b.uploadTime;
                     case 'name-asc':
                         return a.name.localeCompare(b.name, 'zh-CN');
                     case 'name-desc':
                         return b.name.localeCompare(a.name, 'zh-CN');
                     case 'score-desc':
                         return b.score - a.score;
                     default:
                         return 0;
                 }
             });
             
             // 计算分页信息
             window.libraryTotalItems = filteredResumes.length;
             window.libraryTotalPages = Math.ceil(window.libraryTotalItems / window.libraryPageSize);
             
             // 确保当前页码在有效范围内
             if (window.libraryCurrentPage > window.libraryTotalPages) {
                 window.libraryCurrentPage = Math.max(1, window.libraryTotalPages);
             }
             
             // 分页
             const startIndex = (window.libraryCurrentPage - 1) * window.libraryPageSize;
             const endIndex = Math.min(startIndex + window.libraryPageSize, window.libraryTotalItems);
             const currentPageData = filteredResumes.slice(startIndex, endIndex);
             
             // 更新统计信息
             document.getElementById('resume-count').textContent = `共找到 ${window.libraryTotalItems} 份简历`;
             
             // 渲染列表
             renderResumeList(currentPageData);
             
             // 更新分页控件
             updateLibraryPagination();
             
             window.libraryIsLoading = false;
         }
         
         // 渲染简历列表
         function renderResumeList(resumes) {
             const container = document.getElementById('resume-list');
             container.innerHTML = '';
             
             resumes.forEach(resume => {
                 const resumeItem = createResumeItem(resume);
                 container.appendChild(resumeItem);
             });
         }
         
         // 创建简历项目（横排布局，优化行高）
         function createResumeItem(resume) {
             const div = document.createElement('div');
             div.className = `resume-item bg-white border border-gray-200 rounded-lg px-4 py-3 hover:border-blue-300 hover:shadow-sm transition-all cursor-pointer ${
                 window.librarySelectedResumes.has(resume.id) ? 'selected border-blue-500 bg-blue-50' : ''
             }`;
             div.dataset.resumeId = resume.id;
             
             const fileIcon = getFileIcon(resume.fileType);
             const scoreColor = getScoreColor(resume.score);
             const scoreText = (typeof resume.score === 'number' && !isNaN(resume.score)) ? `${resume.score}分` : '未评分';
             
             div.innerHTML = `
                 <div class="flex items-center space-x-4">
                     <!-- 选择框和文件图标 -->
                     <div class="flex items-center space-x-2 flex-shrink-0">
                         <label class="flex items-center cursor-pointer">
                             <input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 w-4 h-4" 
                                    ${window.librarySelectedResumes.has(resume.id) ? 'checked' : ''}>
                         </label>
                         <div class="w-8 h-8 bg-gray-100 rounded flex items-center justify-center">
                             ${fileIcon.replace('text-lg', 'text-sm')}
                         </div>
                     </div>
                     
                     <!-- 基本信息 -->
                     <div class="flex-1 min-w-0 flex items-center space-x-3">
                         <div class="flex-1 min-w-0">
                             <div class="flex items-center space-x-2">
                                 <h4 class="font-medium text-gray-900 text-base truncate">${resume.name}</h4>
                                 <div class="text-xs px-2 py-0.5 rounded ${scoreColor} font-medium flex-shrink-0">
                                     ${scoreText}
                                 </div>
                             </div>
                             <div class="flex items-center space-x-2 text-sm text-gray-600 mt-0.5">
                                 <span class="truncate">${resume.position}</span>
                                 <span class="text-gray-400">|</span>
                                 <span class="text-xs text-gray-500 truncate" title="${resume.fileName}">${resume.fileName}</span>
                             </div>
                         </div>
                     </div>
                     
                     <!-- 工作经验和学历 -->
                     <div class="flex-shrink-0 w-20 text-center">
                         <div class="text-sm text-gray-700 font-medium">${resume.experience}</div>
                         <div class="text-xs text-gray-500">${resume.education}</div>
                     </div>
                     
                     <!-- 薪资范围 -->
                     <div class="flex-shrink-0 w-18 text-center">
                         <div class="text-sm text-blue-600 font-medium">${resume.salary}</div>
                     </div>
                     
                     <!-- 上传时间 -->
                     <div class="flex-shrink-0 w-20 text-center">
                         <div class="text-xs text-gray-500">${formatDate(resume.uploadTime)}</div>
                     </div>
                     
                     <!-- 操作按钮 -->
                     <div class="flex-shrink-0">
                         <button class="px-2 py-1 text-xs bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors" 
                                 onclick="event.stopPropagation(); ui.showNotification('查看简历详情功能开发中', 'info')">
                             查看
                         </button>
                     </div>
                 </div>
             `;
             
             // 添加点击事件
             div.addEventListener('click', (e) => {
                 if (e.target.type === 'checkbox' || e.target.tagName === 'BUTTON') return;
                 
                 const checkbox = div.querySelector('input[type="checkbox"]');
                 checkbox.checked = !checkbox.checked;
                 
                 if (checkbox.checked) {
                     window.librarySelectedResumes.add(resume.id);
                     div.classList.add('selected', 'border-blue-500', 'bg-blue-50');
                     div.classList.remove('border-gray-200');
                 } else {
                     window.librarySelectedResumes.delete(resume.id);
                     div.classList.remove('selected', 'border-blue-500', 'bg-blue-50');
                     div.classList.add('border-gray-200');
                 }
                 
                 updateLibrarySelectionCount();
             });
             
             // 复选框事件
             const checkbox = div.querySelector('input[type="checkbox"]');
             checkbox.addEventListener('change', (e) => {
                 if (e.target.checked) {
                     window.librarySelectedResumes.add(resume.id);
                     div.classList.add('selected', 'border-blue-500', 'bg-blue-50');
                     div.classList.remove('border-gray-200');
                 } else {
                     window.librarySelectedResumes.delete(resume.id);
                     div.classList.remove('selected', 'border-blue-500', 'bg-blue-50');
                     div.classList.add('border-gray-200');
                 }
                 
                 updateLibrarySelectionCount();
             });
             
             return div;
         }
         
         // 获取文件图标
         function getFileIcon(fileType) {
             const iconMap = {
                 '.pdf': '<i class="fas fa-file-pdf text-red-500"></i>',
                 '.docx': '<i class="fas fa-file-word text-blue-500"></i>',
                 '.doc': '<i class="fas fa-file-word text-blue-500"></i>',
                 '.txt': '<i class="fas fa-file-alt text-gray-500"></i>'
             };
             return iconMap[fileType] || '<i class="fas fa-file text-gray-500"></i>';
         }
         
         // 获取评分颜色（支持未评分）
         function getScoreColor(score) {
             if (typeof score !== 'number' || isNaN(score)) return 'bg-gray-100 text-gray-800';
             if (score >= 90) return 'bg-green-100 text-green-800';
             if (score >= 80) return 'bg-blue-100 text-blue-800';
             if (score >= 70) return 'bg-yellow-100 text-yellow-800';
             return 'bg-red-100 text-red-800';
         }
         
         // 格式化日期显示
         function formatDate(date) {
             const now = new Date();
             const diffTime = Math.abs(now - date);
             const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
             
             if (diffDays <= 1) {
                 return '今天';
             } else if (diffDays <= 7) {
                 return `${diffDays}天前`;
             } else if (diffDays <= 30) {
                 return `${Math.floor(diffDays / 7)}周前`;
             } else {
                 return date.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
             }
         }
         
         // 更新选择计数（限定模态内的选择器范围）
         function updateLibrarySelectionCount() {
             const count = window.librarySelectedResumes.size;
             const selectedCountEl = document.querySelector('#library-modal #selected-count');
             const importCountEl = document.querySelector('#library-modal #import-count');
             if (selectedCountEl) selectedCountEl.textContent = `已选择 ${count} 份`;
             if (importCountEl) importCountEl.textContent = count;
             
             const importBtn = document.getElementById('import-selected-btn');
             if (importBtn) {
                 if (count > 0) {
                     importBtn.disabled = false;
                     importBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                 } else {
                     importBtn.disabled = true;
                     importBtn.classList.add('opacity-50', 'cursor-not-allowed');
                 }
             }
         }
         
         // 更新分页控件
         function updateLibraryPagination() {
             // 更新页面信息
             const startIndex = (window.libraryCurrentPage - 1) * window.libraryPageSize + 1;
             const endIndex = Math.min(window.libraryCurrentPage * window.libraryPageSize, window.libraryTotalItems);
             
             document.getElementById('page-info-start').textContent = window.libraryTotalItems > 0 ? startIndex : 0;
             document.getElementById('page-info-end').textContent = endIndex;
             document.getElementById('page-info-total').textContent = window.libraryTotalItems;
             
             // 更新按钮状态
             const firstPageBtn = document.getElementById('first-page-btn');
             const prevPageBtn = document.getElementById('prev-page-btn');
             const nextPageBtn = document.getElementById('next-page-btn');
             const lastPageBtn = document.getElementById('last-page-btn');
             
             // 首页和上一页按钮
             const isFirstPage = window.libraryCurrentPage <= 1;
             firstPageBtn.disabled = isFirstPage;
             prevPageBtn.disabled = isFirstPage;
             
             if (isFirstPage) {
                 firstPageBtn.classList.add('opacity-50', 'cursor-not-allowed');
                 prevPageBtn.classList.add('opacity-50', 'cursor-not-allowed');
             } else {
                 firstPageBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                 prevPageBtn.classList.remove('opacity-50', 'cursor-not-allowed');
             }
             
             // 下一页和尾页按钮
             const isLastPage = window.libraryCurrentPage >= window.libraryTotalPages;
             nextPageBtn.disabled = isLastPage;
             lastPageBtn.disabled = isLastPage;
             
             if (isLastPage) {
                 nextPageBtn.classList.add('opacity-50', 'cursor-not-allowed');
                 lastPageBtn.classList.add('opacity-50', 'cursor-not-allowed');
             } else {
                 nextPageBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                 lastPageBtn.classList.remove('opacity-50', 'cursor-not-allowed');
             }
             
             // 更新页码按钮
             renderPageNumbers();
         }
         
         // 渲染页码按钮
         function renderPageNumbers() {
             const container = document.getElementById('page-numbers');
             container.innerHTML = '';
             
             if (window.libraryTotalPages <= 1) return;
             
             // 计算显示的页码范围
             let startPage = Math.max(1, window.libraryCurrentPage - 2);
             let endPage = Math.min(window.libraryTotalPages, window.libraryCurrentPage + 2);
             
             // 调整范围以显示更多页码
             if (endPage - startPage < 4) {
                 if (startPage === 1) {
                     endPage = Math.min(window.libraryTotalPages, startPage + 4);
                 } else if (endPage === window.libraryTotalPages) {
                     startPage = Math.max(1, endPage - 4);
                 }
             }
             
             // 渲染页码按钮
             for (let i = startPage; i <= endPage; i++) {
                 const button = document.createElement('button');
                 button.className = `px-3 py-2 text-sm border rounded-lg transition-colors ${
                     i === window.libraryCurrentPage 
                         ? 'bg-blue-600 text-white border-blue-600' 
                         : 'border-gray-300 hover:bg-gray-100 text-gray-700'
                 }`;
                 button.textContent = i;
                 button.onclick = () => {
                     window.libraryCurrentPage = i;
                     loadLibraryResumeList();
                 };
                 container.appendChild(button);
             }
             
             // 如果有省略，显示省略号
             if (startPage > 1) {
                 const ellipsis = document.createElement('span');
                 ellipsis.className = 'px-2 text-gray-500';
                 ellipsis.textContent = '...';
                 container.insertBefore(ellipsis, container.firstChild);
                 
                 const firstButton = document.createElement('button');
                 firstButton.className = 'px-3 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 text-gray-700';
                 firstButton.textContent = '1';
                 firstButton.onclick = () => {
                     window.libraryCurrentPage = 1;
                     loadLibraryResumeList();
                 };
                 container.insertBefore(firstButton, container.firstChild);
             }
             
             if (endPage < window.libraryTotalPages) {
                 const ellipsis = document.createElement('span');
                 ellipsis.className = 'px-2 text-gray-500';
                 ellipsis.textContent = '...';
                 container.appendChild(ellipsis);
                 
                 const lastButton = document.createElement('button');
                 lastButton.className = 'px-3 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 text-gray-700';
                 lastButton.textContent = window.libraryTotalPages;
                 lastButton.onclick = () => {
                     window.libraryCurrentPage = window.libraryTotalPages;
                     loadLibraryResumeList();
                 };
                 container.appendChild(lastButton);
             }
         }
     </script>
     
    
    
   <script src="/js/sidebar.js"></script>
    <script>
      Sidebar.init({ mount:'#sidebar', active:'comparison' });
    </script>
