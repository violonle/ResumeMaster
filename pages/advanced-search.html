<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级搜索 - 智能简历助手</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="../js/tailwindcss.js"></script>
    <link href="https://cdn.staticfile.org/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script src="../js/user-auth.js"></script>
    <script src="../js/header-profile.js"></script>
    <script src="/js/sidebar.js"></script>
    
    <style>
        :root { --font-sans: 'Plus Jakarta Sans', sans-serif; }
        body { font-family: var(--font-sans); }
        .portal-card {
            background: white;
            border-radius: 16px;
            border: 1px solid rgba(229, 231, 235, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .portal-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.12), 0 4px 8px -4px rgba(0, 0, 0, 0.08);
            border-color: rgba(59, 130, 246, 0.3);
        }
        .search-highlight {
            background-color: #fef3c7;
            padding: 0 2px;
            border-radius: 2px;
        }
        .filter-tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            background-color: #e0e7ff;
            color: #4338ca;
            border-radius: 12px;
            font-size: 12px;
            margin: 2px;
        }
        .filter-tag .remove {
            margin-left: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .saved-search-item {
            transition: all 0.2s ease;
        }
        .saved-search-item:hover {
            background-color: #f8fafc;
        }
        .advanced-filter-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .advanced-filter-panel.open {
            max-height: 500px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased selection:bg-blue-100 selection:text-blue-700">
    <aside id="sidebar" class="fixed left-0 top-0 bottom-0 sidebar-modern z-40"></aside>
    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20 h-20">
        <div class="flex items-center justify-between px-6 h-full">
            <div class="flex items-center space-x-4 pl-8">
                <div class="brand-title flex flex-col justify-center space-y-1.5">
                    <h1 class="text-lg font-bold text-gray-900 leading-none">高级搜索</h1>
                    <p class="text-xs text-gray-500 font-medium leading-tight">通过多维条件筛选，精准定位您需要的人才和简历</p>
                </div>
            </div>
            <div class="flex items-center space-x-4" id="header-right-section">
                <!-- User Profile will be rendered here -->
            </div>
        </div>
    </header>

    <main class="main-content pt-24 p-6" id="main-content">
        <div class="max-w-[1440px] mx-auto mb-4 flex justify-end space-x-4">
            <button class="text-gray-500 hover:text-gray-700 bg-white p-2 rounded shadow-sm" id="saved-searches-btn">
                <span class="ml-1">🔖 已保存</span>
            </button>
            <button class="text-gray-500 hover:text-gray-700 bg-white p-2 rounded shadow-sm" id="search-history-btn">
                <span class="ml-1">🕒 历史</span>
            </button>
        </div>

    <div class="max-w-[1440px] mx-auto py-8">
        <!-- 搜索区域 -->
        <div class="portal-card p-6 mb-8">
            <!-- 主要搜索栏 -->
            <div class="relative mb-4">
                <div class="flex items-center">
                    <div class="flex-1 relative">
                        <input 
                            type="text" 
                            data-advanced-search
                            placeholder="搜索简历、模板、用户... (Ctrl+K 快捷键)"
                            class="w-full px-4 py-3 pl-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                        <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400">🔍</span>
                    </div>
                    <button 
                        data-search-button
                        class="ml-4 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                    >
                        <span class="mr-2">🔍</span>搜索
                    </button>
                    <button 
                        data-clear-search
                        class="ml-2 px-4 py-3 text-gray-600 hover:text-gray-800 transition-colors"
                    >
                        <span>✖️</span>
                    </button>
                </div>
            </div>

            <!-- 快速筛选标签 -->
            <div class="flex items-center space-x-4 mb-4">
                <span class="text-sm text-gray-600">快速筛选:</span>
                <button class="filter-tag" data-quick-filter="today">
                    今日创建
                </button>
                <button class="filter-tag" data-quick-filter="week">
                    本周
                </button>
                <button class="filter-tag" data-quick-filter="month">
                    本月
                </button>
                <button class="filter-tag" data-quick-filter="free">
                    免费
                </button>
                <button class="filter-tag" data-quick-filter="paid">
                    付费
                </button>
            </div>

            <!-- 高级筛选切换 -->
            <div class="flex items-center justify-between">
                <button 
                    id="advanced-filter-toggle"
                    class="text-blue-600 hover:text-blue-800 text-sm font-medium"
                >
                    <span class="mr-1">🎭</span>
                    高级筛选
                </button>
                <button 
                    data-save-search
                    class="text-green-600 hover:text-green-800 text-sm font-medium"
                >
                    <i class="fas fa-save mr-1"></i>
                    保存搜索
                </button>
            </div>

            <!-- 高级筛选面板 -->
            <div id="advanced-filter-panel" class="advanced-filter-panel">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4 pt-4 border-t border-gray-200">
                    <!-- 日期筛选 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">创建日期</label>
                        <select data-search-filter data-filter-type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">所有时间</option>
                            <option value="today">今天</option>
                            <option value="week">最近一周</option>
                            <option value="month">最近一月</option>
                        </select>
                    </div>

                    <!-- 分类筛选 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">模板分类</label>
                        <select data-search-filter data-filter-type="category" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">所有分类</option>
                            <option value="技术开发">技术开发</option>
                            <option value="创意设计">创意设计</option>
                            <option value="行政经典">行政经典</option>
                            <option value="学术研究">学术研究</option>
                            <option value="现代专业">现代专业</option>
                            <option value="应届毕业生">应届毕业生</option>
                        </select>
                    </div>

                    <!-- 状态筛选 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">状态</label>
                        <select data-search-filter data-filter-type="status" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">所有状态</option>
                            <option value="active">进行中</option>
                            <option value="completed">已完成</option>
                            <option value="draft">草稿</option>
                        </select>
                    </div>

                    <!-- 价格筛选 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">价格</label>
                        <select data-search-filter data-filter-type="price" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">所有价格</option>
                            <option value="free">免费</option>
                            <option value="paid">付费</option>
                            <option value="premium">高级版</option>
                        </select>
                    </div>

                    <!-- 排序选项 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">排序方式</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="relevance">相关性</option>
                            <option value="date-desc">日期 (新到旧)</option>
                            <option value="date-asc">日期 (旧到新)</option>
                            <option value="title">标题</option>
                            <option value="price">价格</option>
                        </select>
                    </div>

                    <!-- 显示数量 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">每页显示</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="10">10 条</option>
                            <option value="20">20 条</option>
                            <option value="50">50 条</option>
                            <option value="100">100 条</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 搜索结果区域 -->
        <div class="glass-card rounded-xl p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-lg font-semibold text-gray-900">搜索结果</h2>
                <div class="flex items-center space-x-4 text-sm text-gray-600">
                    <span id="result-count">0 个结果</span>
                    <span>|</span>
                    <span>搜索用时: <span id="search-time">0</span>ms</span>
                </div>
            </div>
            
            <div id="search-results" class="space-y-4">
                <!-- 搜索结果将在这里显示 -->
                <div class="text-center py-12">
                    <span class="text-gray-400 text-4xl mb-4 block">🔍</span>
                    <p class="text-gray-500">输入关键词开始搜索</p>
                    <p class="text-sm text-gray-400 mt-2">支持按标题、分类、状态等多种条件筛选</p>
                </div>
            </div>
        </div>

        <!-- 已保存的搜索面板 -->
        <div id="saved-searches-panel" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50">
            <div class="flex items-center justify-center min-h-screen p-4">
                <div class="glass-card rounded-xl p-6 max-w-md w-full max-h-96 overflow-y-auto">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-gray-900">已保存的搜索</h3>
                        <button id="close-saved-searches" class="text-gray-400 hover:text-gray-600">
                            <span>✖️</span>
                        </button>
                    </div>
                    <div id="saved-searches-list" class="space-y-2">
                        <!-- 已保存的搜索列表 -->
                        <div class="text-center py-8 text-gray-500">
                            <span class="text-2xl mb-2 block">🔖</span>
                            <p>暂无保存的搜索</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 搜索历史面板 -->
        <div id="search-history-panel" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50">
            <div class="flex items-center justify-center min-h-screen p-4">
                <div class="portal-card p-6 max-w-md w-full max-h-96 overflow-y-auto">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-gray-900">搜索历史</h3>
                        <div class="flex items-center space-x-2">
                            <button id="clear-history" class="text-sm text-red-600 hover:text-red-800">
                                <span class="mr-1">🗑️</span>清空
                            </button>
                            <button id="close-history" class="text-gray-400 hover:text-gray-600">
                                <span>✖️</span>
                            </button>
                        </div>
                    </div>
                    <div id="search-history-list" class="space-y-2">
                        <!-- 搜索历史列表 -->
                        <div class="text-center py-8 text-gray-500">
                            <span class="text-2xl mb-2 block">🕒</span>
                            <p>暂无搜索历史</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本文件 -->
    <script src="/js/ui-components.js"></script>
    <script src="/js/advanced-search.js"></script>
    <script>
        // 初始化UI组件和高级搜索
        const uiComponents = new UIComponents();
    </script>
</main>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Sidebar !== 'undefined') {
                Sidebar.init({ active: 'librarypool' });
            }
            if (typeof HeaderProfile !== 'undefined') {
                HeaderProfile.init();
            }

            const advancedSearch = new AdvancedSearch();

            // 高级筛选面板切换
            const advancedFilterToggle = document.getElementById('advanced-filter-toggle');
            const advancedFilterPanel = document.getElementById('advanced-filter-panel');
            
            advancedFilterToggle.addEventListener('click', function() {
                advancedFilterPanel.classList.toggle('open');
                const icon = this.querySelector('span');
                if (advancedFilterPanel.classList.contains('open')) {
                    icon.textContent = '✖️';
                } else {
                    icon.textContent = '🎭';
                }
            });

            // 快速筛选按钮
            document.querySelectorAll('[data-quick-filter]').forEach(button => {
                button.addEventListener('click', function() {
                    const filterValue = this.dataset.quickFilter;
                    
                    // 设置相应的筛选器
                    switch(filterValue) {
                        case 'today':
                        case 'week':
                        case 'month':
                            document.querySelector('[data-search-filter][data-filter-type="date"]').value = filterValue;
                            break;
                        case 'free':
                        case 'paid':
                            document.querySelector('[data-search-filter][data-filter-type="price"]').value = filterValue;
                            break;
                    }
                    
                    // 触发搜索
                    advancedSearch.performSearch();
                    
                    // 视觉反馈
                    this.classList.add('bg-blue-100', 'text-blue-800');
                    setTimeout(() => {
                        this.classList.remove('bg-blue-100', 'text-blue-800');
                    }, 1000);
                });
            });

            // 已保存搜索面板
            const savedSearchesBtn = document.getElementById('saved-searches-btn');
            const savedSearchesPanel = document.getElementById('saved-searches-panel');
            const closeSavedSearches = document.getElementById('close-saved-searches');

            savedSearchesBtn.addEventListener('click', function() {
                savedSearchesPanel.classList.remove('hidden');
                loadSavedSearches();
            });

            closeSavedSearches.addEventListener('click', function() {
                savedSearchesPanel.classList.add('hidden');
            });

            // 搜索历史面板
            const searchHistoryBtn = document.getElementById('search-history-btn');
            const searchHistoryPanel = document.getElementById('search-history-panel');
            const closeHistory = document.getElementById('close-history');
            const clearHistory = document.getElementById('clear-history');

            searchHistoryBtn.addEventListener('click', function() {
                searchHistoryPanel.classList.remove('hidden');
                loadSearchHistory();
            });

            closeHistory.addEventListener('click', function() {
                searchHistoryPanel.classList.add('hidden');
            });

            clearHistory.addEventListener('click', function() {
                uiComponents.showConfirm('确定要清空搜索历史吗？', () => {
                    advancedSearch.searchHistory = [];
                    advancedSearch.saveSearchHistory();
                    loadSearchHistory();
                    uiComponents.showNotification('搜索历史已清空', 'success');
                });
            });

            // 点击面板外部关闭
            [savedSearchesPanel, searchHistoryPanel].forEach(panel => {
                panel.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.add('hidden');
                    }
                });
            });

            // 加载已保存的搜索
            function loadSavedSearches() {
                const listContainer = document.getElementById('saved-searches-list');
                if (advancedSearch.savedSearches.length === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center py-8 text-gray-500">
                            <span class="text-2xl mb-2 block">🔖</span>
                            <p>暂无保存的搜索</p>
                        </div>
                    `;
                    return;
                }

                listContainer.innerHTML = advancedSearch.savedSearches.map(search => `
                    <div class="saved-search-item p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                        <div class="flex items-center justify-between">
                            <div class="flex-1" data-load-saved-search data-search-id="${search.id}">
                                <h4 class="font-medium text-gray-900">${search.name}</h4>
                                <p class="text-sm text-gray-600">${search.query || '无关键词'}</p>
                                <p class="text-xs text-gray-400 mt-1">
                                    ${new Date(search.timestamp).toLocaleDateString('zh-CN')}
                                </p>
                            </div>
                            <button class="text-red-500 hover:text-red-700" onclick="deleteSavedSearch(${search.id})">
                                <span class="text-sm">🗑️</span>
                            </button>
                        </div>
                    </div>
                `).join('');

                // 添加加载事件
                document.querySelectorAll('[data-load-saved-search]').forEach(item => {
                    item.addEventListener('click', function() {
                        const searchId = this.dataset.searchId;
                        advancedSearch.loadSavedSearch(searchId);
                        savedSearchesPanel.classList.add('hidden');
                    });
                });
            }

            // 加载搜索历史
            function loadSearchHistory() {
                const listContainer = document.getElementById('search-history-list');
                if (advancedSearch.searchHistory.length === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center py-8 text-gray-500">
                            <span class="text-2xl mb-2 block">🕒</span>
                            <p>暂无搜索历史</p>
                        </div>
                    `;
                    return;
                }

                listContainer.innerHTML = advancedSearch.searchHistory.map((query, index) => `
                    <div class="saved-search-item p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                        <div class="flex items-center justify-between">
                            <div class="flex-1" onclick="advancedSearch.selectSuggestion('${query}')">
                                <p class="text-gray-800">${query}</p>
                                <p class="text-xs text-gray-400 mt-1">搜索历史</p>
                            </div>
                            <button class="text-blue-500 hover:text-blue-700" onclick="advancedSearch.selectSuggestion('${query}'); searchHistoryPanel.classList.add('hidden');">
                                <span class="text-sm">➡️</span>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            // 删除已保存的搜索
            window.deleteSavedSearch = function(searchId) {
                uiComponents.showConfirm('确定要删除这个已保存的搜索吗？', () => {
                    advancedSearch.savedSearches = advancedSearch.savedSearches.filter(s => s.id != searchId);
                    advancedSearch.saveSavedSearches();
                    loadSavedSearches();
                    uiComponents.showNotification('已删除保存的搜索', 'success');
                });
            };

            // 更新结果计数
            const originalDisplayResults = advancedSearch.displayResults;
            advancedSearch.displayResults = function(results) {
                originalDisplayResults.call(this, results);
                
                // 更新计数
                document.getElementById('result-count').textContent = `${results.length} 个结果`;
                document.getElementById('search-time').textContent = '—';
            };
        });
    </script>
</body>
</html>
