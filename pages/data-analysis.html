<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析 - 争湃·简历大师</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="../js/tailwindcss.js"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://fastly.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/resume-data.js?v=3"></script>
    <script src="../js/user-auth.js"></script>
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/design-system.css">
    <style>
        :root {
        }
        body {
        }
        .brand-title { white-space: normal !important; }
    </style>
</head>

<body class="bg-gray-50 antialiased text-gray-900 selection:bg-blue-100 selection:text-blue-700">
    <aside id="sidebar" class="fixed left-0 top-0 bottom-0 sidebar-modern z-40"></aside>


    <header class="fixed top-0 left-0 right-0 bg-white/80 backdrop-blur-md border-b border-gray-100 z-20 h-20">
        <div class="max-w-[1440px] mx-auto flex items-center justify-between px-6 h-full">
            <div class="flex items-center space-x-4 pl-8">
                <div class="brand-title flex flex-col justify-center space-y-1.5">
                    <h1 class="text-lg font-bold text-gray-900 leading-none">数据分析</h1>
                    <p class="text-xs text-gray-500 font-medium leading-tight">深入了解招聘数据，优化招聘策略</p>
                </div>
            </div>
            <div class="flex items-center space-x-4" id="header-right-section">
                <!-- User Profile will be rendered here by HeaderProfile -->
            </div>
        </div>
    </header>
    <main class="main-content p-8 pt-24" id="main-content">
        <div class="max-w-[1440px] mx-auto">
            <div class="flex justify-between items-center mb-6">
                <div></div>
                <div class="flex space-x-3">
                    <select class="bg-gray-50 border-none rounded-2xl px-4 py-2 text-sm font-bold text-gray-700 focus:ring-2 focus:ring-blue-100 outline-none cursor-pointer">
                        <option>最近7天</option>
                        <option>最近30天</option>
                        <option>最近90天</option>
                        <option>自定义时间</option>
                    </select>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-2xl font-bold shadow-md shadow-blue-200 transition-all"
                        onclick="exportReport()"><i class="fas fa-download mr-2"></i>导出报告</button>
                </div>
            </div>
            <div class="grid grid-cols-4 gap-6 mb-8 min-w-0">
                <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 transition-colors group hover:border-blue-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-500 font-medium">总简历数</p>
                            <p class="text-3xl font-bold text-gray-900 mt-2" id="total-resumes-count">—</p>
                            <p class="text-sm text-gray-400 mt-2 flex items-center" id="total-resumes-growth"><i class="fas fa-arrow-up mr-1"></i>+0%</p>
                        </div>
                        <div class="w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center border border-blue-100 group-hover:bg-blue-100 transition-colors">
                            <i class="fas fa-file-alt text-blue-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 transition-colors group hover:border-blue-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-500 font-medium">总职位数</p>
                            <p class="text-3xl font-bold text-gray-900 mt-2" id="total-jobs-count">—</p>
                            <p class="text-sm text-gray-400 mt-2 flex items-center" id="total-jobs-growth"><i class="fas fa-arrow-up mr-1"></i>+0%</p>
                        </div>
                        <div class="w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center border border-blue-100 group-hover:bg-blue-100 transition-colors">
                            <i class="fas fa-briefcase text-blue-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 transition-colors group hover:border-blue-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-500 font-medium">面试安排</p>
                            <p class="text-3xl font-bold text-gray-900 mt-2" id="interviews-count">—</p>
                            <p class="text-sm text-gray-400 mt-2 flex items-center" id="interviews-growth"><i class="fas fa-arrow-up mr-1"></i>+0%</p>
                        </div>
                        <div class="w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center border border-blue-100 group-hover:bg-blue-100 transition-colors">
                            <i class="fas fa-calendar-check text-blue-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 transition-colors group hover:border-blue-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-500 font-medium">入职率</p>
                            <p class="text-3xl font-bold text-gray-900 mt-2" id="onboarding-rate">—</p>
                            <p class="text-sm text-gray-400 mt-2 flex items-center" id="onboarding-growth"><i class="fas fa-arrow-up mr-1"></i>+0%</p>
                        </div>
                        <div class="w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center border border-blue-100 group-hover:bg-blue-100 transition-colors">
                            <i class="fas fa-user-check text-blue-600 text-xl"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 mb-8">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-medium text-gray-900">招聘漏斗</h3>
                    <span class="text-xs text-gray-500">投递 → 初筛 → 面试 → Offer → 入职</span>
                </div>
                <div class="w-full h-8 md:h-10 rounded-lg bg-gray-100 overflow-hidden mb-2 flex" id="funnel2-bar"></div>
                <div class="grid grid-cols-4 gap-3 text-xs text-gray-600 mb-2 w-full" id="funnel2-metrics"></div>
                <div class="flex items-center flex-wrap gap-3 text-xs text-gray-700" id="funnel2-legend"></div>
                <!-- 统一使用横条 + 指标 + 图例样式，移除旧卡片式漏斗 -->
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-medium text-gray-900">简历投递趋势</h3>
                        <div class="flex space-x-2"><button class="text-xs px-3 py-1.5 bg-blue-100 text-blue-600 rounded-lg font-bold"
                                onclick="updateChart('resume','week')">周</button><button
                                class="text-xs px-3 py-1.5 text-gray-500 rounded-lg font-bold hover:bg-gray-100 transition-colors"
                                onclick="updateChart('resume','month')">月</button></div>
                    </div>
                    <canvas id="resumeChart" width="400" height="200"></canvas>
                </div>
                <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-medium text-gray-900">职位匹配分析</h3><button
                            class="text-xs px-3 py-1.5 bg-gray-50 text-gray-600 rounded-lg font-bold hover:bg-gray-100 transition-colors" onclick="refreshMatchData()"><i
                                class="fas fa-sync-alt mr-1"></i>刷新</button>
                    </div>
                    <canvas id="matchChart" width="400" height="200"></canvas>
                </div>
            </div>
            <div class="grid grid-cols-1 gap-6">
                <div class="bg-white border border-gray-100 rounded-2xl shadow-sm">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900">招聘效率统计</h3>
                    </div>
                    <div class="p-6">
                        <div class="space-y-4">
                            <div class="flex justify-between items-center"><span
                                    class="text-sm text-gray-600">平均招聘周期</span><span
                                    class="font-medium text-gray-900" id="avg-cycle-days">—</span></div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-blue-600 h-2 rounded-full" id="avg-cycle-bar" style="width:0%"></div>
                            </div>
                            <div class="flex justify-between items-center"><span
                                    class="text-sm text-gray-600">简历筛选通过率</span><span
                                    class="font-medium text-gray-900" id="screening-pass-rate">—</span></div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-green-600 h-2 rounded-full" id="screening-pass-bar" style="width:0%"></div>
                            </div>
                            <div class="flex justify-between items-center"><span
                                    class="text-sm text-gray-600">面试到入职转化率</span><span
                                    class="font-medium text-gray-900" id="interview-conversion-rate">—</span></div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-purple-600 h-2 rounded-full" id="interview-conversion-bar" style="width:0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </main>
    <script src="/js/sidebar.js"></script>
    <script src="/js/header-profile.js"></script>
    <script>
        const uiComponents = { showNotification: (msg, type)=>{ try{ console.log(`[${type||'info'}]`, msg) }catch(_){ } } };
        let resumeChart = null;
        let matchChart = null;
        document.addEventListener('DOMContentLoaded', function () {
            HeaderProfile.init('#header-right-section');
            Sidebar.init({ mount: '#sidebar', active: 'analysis' }).then(() => {
                updateSubscriptionInfo();
            });
            initCharts();
            
            window.addEventListener('resumeDataUpdated', function(e) {
                console.log('收到简历数据更新事件，来源:', e.detail.source);
                initCharts();
            });
        });

        async function updateSubscriptionInfo() {
            try {
                const token = (JSON.parse(localStorage.getItem('userInfo') || '{}').token) || null;
                const headers = token ? { Authorization: 'Bearer ' + token } : {};
                const [cur, usage] = await Promise.all([
                    fetch('/api/subscription/current', { headers }).then(r => r.json()).catch(() => null),
                    fetch('/api/subscription/usage', { headers }).then(r => r.json()).catch(() => null)
                ]);

                // Try to find elements with both IDs (standard and fallback)
                const statusEl = document.getElementById('sub-status') || document.getElementById('sidebar-sub-status');
                const progressEl = document.getElementById('sub-progress') || document.getElementById('sidebar-sub-progress');
                const renewEl = document.getElementById('sub-renew') || document.getElementById('sidebar-sub-renew');

                if (!statusEl || !progressEl || !renewEl) return;

                const plan = cur && cur.data ? (cur.data.planType || 'free') : 'unknown';
                const expiresAt = cur && cur.data ? (cur.data.expiresAt || cur.data.expires_at) : null;
                const leftDays = (function () { if (!expiresAt) return null; const d = Math.ceil((new Date(expiresAt) - Date.now()) / (1000 * 60 * 60 * 24)); return d })();
                statusEl.textContent = plan;
                const u = usage && usage.data ? usage.data : { aiAnalysis: 0, resumeUpload: 0, jobMatching: 0 };
                const used = (u.aiAnalysis || 0) + (u.resumeUpload || 0) + (u.jobMatching || 0);
                const pct = Math.max(0, Math.min(100, Math.round((used % 100) / 100 * 100)));
                progressEl.style.width = pct + '%';
                renewEl.textContent = leftDays != null ? `距离到期还有 ${leftDays} 天` : '使用量与到期信息暂不可用';
            } catch (e) { }
        }

        async function initCharts() {
            try {
                const [talentPoolData, analysisStats, funnelStats, recruitmentStats, efficiencyStats] = await Promise.all([
                    window.resumeDataManager.getTalentPoolResumes().catch(()=>[]),
                    userAuthInstance.apiRequest('/company/analysis-stats').catch(()=>({ data:{ total:0, excellent:0, weekCounts:[0,0,0,0,0,0,0] } })),
                    userAuthInstance.apiRequest('/company/funnel-stats').catch(()=>({ data:{ applied:0, screening:0, interview:0, offer:0, hired:0, rejected:0 } })),
                    userAuthInstance.apiRequest('/company/recruitment-stats').catch(()=>({ data:{ total:0, active:0, paused:0, closed:0, draft:0 } })),
                    userAuthInstance.apiRequest('/company/efficiency-stats').catch(()=>({ data:{ avgCycleDays:15, screeningPassRate:30, interviewConversionRate:60 } }))
                ]);
                const totalResumes = Array.isArray(talentPoolData) ? talentPoolData.length : 0;
                const as = analysisStats?.data || { total: 0, excellent: 0, weekCounts: [0, 0, 0, 0, 0, 0, 0] };
                const funnel = funnelStats?.data || { applied:0, screening:0, interview:0, offer:0, hired:0, rejected:0 };
                const jobStats = recruitmentStats?.data || { total:0, active:0, paused:0, closed:0, draft:0 };
                const eff = efficiencyStats?.data || { avgCycleDays:15, screeningPassRate:30, interviewConversionRate:60 };
                
                const totalEl = document.getElementById('total-resumes-count');
                const jobTotalEl = document.getElementById('total-jobs-count');
                const interviewEl = document.getElementById('interviews-count');
                const onboardEl = document.getElementById('onboarding-rate');
                
                // 增长率元素
                const resumesGrowthEl = document.getElementById('total-resumes-growth');
                const jobsGrowthEl = document.getElementById('total-jobs-growth');
                const interviewsGrowthEl = document.getElementById('interviews-growth');
                const onboardingGrowthEl = document.getElementById('onboarding-growth');
                
                if (totalEl) totalEl.textContent = totalResumes;
                if (jobTotalEl) jobTotalEl.textContent = jobStats.total;
                if (interviewEl) interviewEl.textContent = funnel.interview;
                const onboarding = funnel.applied ? Math.round((funnel.hired / funnel.applied) * 100) : 0;
                if (onboardEl) onboardEl.textContent = onboarding + '%';

                // 更新增长率
                const gr = eff.growthRates || { resumes: '+0%', jobs: '+0%', interviews: '+0%', onboarding: '+0%' };
                
                const updateGrowth = (el, val) => {
                    if (!el) return;
                    const isDown = val.startsWith('-');
                    el.innerHTML = `<i class="fas fa-arrow-${isDown ? 'down' : 'up'} mr-1"></i>${val}`;
                    // 可以根据正负值调整颜色，但目前样式是 opacity-75，保持一致
                };

                updateGrowth(resumesGrowthEl, gr.resumes);
                updateGrowth(jobsGrowthEl, gr.jobs);
                updateGrowth(interviewsGrowthEl, gr.interviews);
                updateGrowth(onboardingGrowthEl, gr.onboarding);

                // 更新效率统计
                const cycleDaysEl = document.getElementById('avg-cycle-days');
                const cycleBarEl = document.getElementById('avg-cycle-bar');
                const screeningRateEl = document.getElementById('screening-pass-rate');
                const screeningBarEl = document.getElementById('screening-pass-bar');
                const conversionRateEl = document.getElementById('interview-conversion-rate');
                const conversionBarEl = document.getElementById('interview-conversion-bar');

                if (cycleDaysEl) cycleDaysEl.textContent = eff.avgCycleDays + '天';
                if (cycleBarEl) cycleBarEl.style.width = Math.min(100, (eff.avgCycleDays / 30) * 100) + '%'; // 假设30天为100%
                if (screeningRateEl) screeningRateEl.textContent = eff.screeningPassRate + '%';
                if (screeningBarEl) screeningBarEl.style.width = eff.screeningPassRate + '%';
                if (conversionRateEl) conversionRateEl.textContent = eff.interviewConversionRate + '%';
                if (conversionBarEl) conversionBarEl.style.width = eff.interviewConversionRate + '%';
                
                const weekLabels = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
                const rctx = document.getElementById('resumeChart').getContext('2d');
                if (resumeChart) {
                    resumeChart.destroy();
                }
                resumeChart = new Chart(rctx, { type: 'line', data: { labels: weekLabels, datasets: [{ label: '简历投递数', data: as.weekCounts, borderColor: 'rgb(59,130,246)', backgroundColor: 'rgba(59,130,246,0.1)', tension: 0.4 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
                const catLabels = ['技术类', '产品类', '设计类', '运营类', '销售类'];
                const mctx = document.getElementById('matchChart').getContext('2d');
                if (matchChart) {
                    matchChart.destroy();
                }
                matchChart = new Chart(mctx, { type: 'bar', data: { labels: catLabels, datasets: [{ label: '匹配成功', data: [as.excellent, 0, 0, 0, 0], backgroundColor: 'rgba(34,197,94,0.8)' }, { label: '待匹配', data: [Math.max(as.total - as.excellent, 0), 0, 0, 0, 0], backgroundColor: 'rgba(156,163,175,0.8)' }] }, options: { responsive: true, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } } });
                (function(){
                  // 移除硬编码的 mock 数据，优先使用 API 返回的数据
                  var data = funnel || { applied: 0, screening: 0, interview: 0, offer: 0, hired: 0 };
                  
                  // 如果没有任何数据，显示空状态提示
                  var total = Math.max(0, data.applied || 0);
                  var bar = document.getElementById('funnel2-bar');
                  
                  if (!bar) return;

                  if (total === 0) {
                    bar.innerHTML = '<div class="w-full h-full flex items-center justify-center text-gray-400 text-xs bg-gray-50 italic">暂无招聘流程数据</div>';
                    const metrics = document.getElementById('funnel2-metrics');
                    if (metrics) metrics.innerHTML = '';
                    const legend = document.getElementById('funnel2-legend');
                    if (legend) legend.innerHTML = '';
                    return;
                  }

                  // Apply cumulative logic to match dashboard behavior
                  // Logic: 
                  // hired = hired
                  // offer = offer + hired
                  // interview = interview + offer
                  // screening = screening + interview
                  // applied = applied + screening
                  
                  // Calculate raw values first
                  let raw = {
                      hired: data.hired || 0,
                      offer: data.offer || 0,
                      interview: data.interview || 0,
                      screening: data.screening || 0,
                      applied: data.applied || 0
                  };
                  
                  // Calculate cumulative values
                  let cumulative = {
                      hired: raw.hired,
                      offer: raw.offer + raw.hired,
                      interview: raw.interview + (raw.offer + raw.hired),
                      screening: raw.screening + (raw.interview + raw.offer + raw.hired),
                      applied: raw.applied + (raw.screening + raw.interview + raw.offer + raw.hired)
                  };

                  var segments = [
                    { key:'applied',  label:'投递',    val:cumulative.applied,  color:'#60a5fa' },
                    { key:'screening',label:'初筛',    val:cumulative.screening,color:'#38bdf8' },
                    { key:'interview',label:'面试',    val:cumulative.interview,color:'#a78bfa' },
                    { key:'offer',    label:'Offer',   val:cumulative.offer,    color:'#f59e0b' },
                    { key:'hired',    label:'入职',    val:cumulative.hired,    color:'#22c55e' }
                  ];
                  
                  // Update total based on cumulative applied count
                  total = cumulative.applied;
                  
                  var bar = document.getElementById('funnel2-bar');
                  if (bar){
                    // Recalculate widths based on new total
                    var widths = segments.map(s=>Math.max(3, Math.round(s.val/total*100)));
                    var idxOffer = segments.findIndex(s=>s.key==='offer');
                    var idxHired = segments.findIndex(s=>s.key==='hired');
                    if (idxOffer>-1 && idxHired>-1){
                      var delta = Math.round(widths[idxHired]*0.4);
                      widths[idxHired] = Math.max(3, widths[idxHired]-delta);
                      widths[idxOffer] = widths[idxOffer]+delta;
                    }
                    bar.innerHTML = segments.map((s,idx)=>{
                      var w = widths[idx];
                      var prev = idx===0 ? s.val : Math.max(1, segments[idx-1].val);
                      var pctTotal = Math.round((s.val/total)*100);
                      var pctPrev  = Math.round((s.val/prev)*100);
                      var radiusLeft = idx===0 ? 'rounded-l-lg' : '';
                      var radiusRight = idx===segments.length-1 ? 'rounded-r-lg' : '';
                      var grad = `linear-gradient(90deg, ${s.color} 0%, ${s.color}cc 70%, ${s.color}99 100%)`;
                      var minw = s.key==='hired' ? 'min-width:64px;' : (s.key==='offer' ? 'min-width:72px;' : '');
                      return `<div style="width:${w}%;${minw}background:${grad}" class="h-full relative group ${radiusLeft} ${radiusRight}">
                                <span class="absolute left-2 md:left-3 top-1/2 -translate-y-1/2 text-[10px] md:text-[11px] font-semibold text-white/95 drop-shadow">${s.label} ${s.val}</span>
                                <div class="absolute hidden group-hover:block bottom-full mb-1 left-2 bg-black/80 text-white text-[10px] md:text-xs px-2 py-1 rounded shadow">
                                  相对投递 ${pctTotal}% · 对上一步 ${pctPrev}%
                                </div>
                              </div>`;
                    }).join('');
                  }
                  var metrics = document.getElementById('funnel2-metrics');
                  if (metrics){
                    var c1 = Math.round((data.screening/total)*100);
                    var c2 = Math.round((data.interview/total)*100);
                    var c3 = Math.round((data.offer/total)*100);
                    var c4 = Math.round((data.hired/total)*100);
                    metrics.innerHTML = `
                      <span class="px-2 py-1 rounded bg-blue-50 text-blue-600 inline-flex items-center justify-center w-full text-center">初筛通过率 ${c1}%</span>
                      <span class="px-2 py-1 rounded bg-violet-50 text-violet-600 inline-flex items-center justify-center w-full text-center">面试占比 ${c2}%</span>
                      <span class="px-2 py-1 rounded bg-amber-50 text-amber-600 inline-flex items-center justify-center w-full text-center">Offer占比 ${c3}%</span>
                      <span class="px-2 py-1 rounded bg-emerald-50 text-emerald-600 inline-flex items-center justify-center w-full text-center">入职占比 ${c4}%</span>`;
                  }
                  var legend = document.getElementById('funnel2-legend');
                  if (legend){
                    legend.innerHTML = segments.map(s=>`<span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full" style="background:${s.color}"></span>${s.label}</span>`).join('');
                  }
                })();
            } catch (e) { console.error(e); }
        }
        function updateChart(t, p) { console.log('更新', t, p) }
        function refreshMatchData() { uiComponents.showNotification('刷新匹配数据功能开发中...', 'info') }
        function exportReport() { uiComponents.showNotification('导出数据报告功能开发中...', 'info') }

        function navigateToJobPosting() { window.location.href = '/pages/job-posting.html' }
        function navigateToResumeUpload() { window.location.href = '/pages/resume-upload-pc.html' }
        function navigateToAnalytics() { window.location.href = '/pages/analytics-dashboard.html' }
    </script>
</body>

</html>
