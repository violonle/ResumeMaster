<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职位管理 - 争湃·简历大师</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="../js/tailwindcss.js"></script>
    <script src="../js/ui-components.js"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: #fdfdfd;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid #f1f3f5;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-color: #e5e7eb;
        }

        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #f1f3f5;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #e9ecef;
        }

        .tab-item {
            position: relative;
            transition: all 0.2s;
        }
        .tab-item.active {
            color: #1d4ed8;
        }
        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #1d4ed8;
            border-radius: 2px;
        }
    </style>
</head>
<body class="antialiased text-gray-900 selection:bg-blue-100 selection:text-blue-700">
    <aside id="sidebar" class="sidebar-modern"></aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20">
        <div class="flex items-center justify-between p-4">
            <div class="flex items-center space-x-4 pl-8">
                <h1 class="text-lg font-bold text-gray-900 leading-none">职位管理</h1>
            </div>
            <div class="flex items-center space-x-4" id="header-right-section"></div>
            <script src="/js/header-profile.js"></script>
            <script>HeaderProfile.init('#header-right-section');</script>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="main-content min-h-screen pt-20 p-8" id="main-content">
        <div class="max-w-[1440px] mx-auto">
            <!-- 顶部操作栏 -->
            <div class="flex items-center justify-end mb-6">
                <div class="flex items-center space-x-3">
                    <a href="job-posting.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors inline-flex items-center">
                        <i class="fas fa-plus mr-2"></i>
                        发布职位
                    </a>
                    <button id="import-btn" class="bg-white border border-blue-600 text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-50 transition-colors ml-3">
                        <i class="fas fa-cloud-download-alt mr-2"></i>
                        一键导入
                    </button>
                    
                </div>
            </div>

            <!-- 统计卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <!-- 总职位数 -->
                <div class="stat-card p-6 rounded-2xl animate-in" style="animation-delay: 0.1s">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-2xl shadow-sm">
                            <i class="fas fa-briefcase"></i>
                        </div>
                        <div>
                            <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">总职位数</p>
                            <h3 class="text-2xl font-bold text-gray-900" id="stats-total">—</h3>
                        </div>
                    </div>
                </div>

                <!-- 活跃职位 -->
                <div class="stat-card p-6 rounded-2xl animate-in" style="animation-delay: 0.2s">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center text-2xl shadow-sm">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div>
                            <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">活跃职位</p>
                            <h3 class="text-2xl font-bold text-gray-900" id="stats-active">—</h3>
                        </div>
                    </div>
                </div>

                <!-- 简历数 -->
                <div class="stat-card p-6 rounded-2xl animate-in" style="animation-delay: 0.3s">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-xl bg-indigo-50 text-indigo-700 flex items-center justify-center text-2xl shadow-sm">
                            <i class="fas fa-user-friends"></i>
                        </div>
                        <div>
                            <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">简历数</p>
                            <h3 class="text-2xl font-bold text-gray-900" id="stats-candidates">—</h3>
                        </div>
                    </div>
                </div>

                <!-- 匹配成功 -->
                <div class="stat-card p-6 rounded-2xl animate-in" style="animation-delay: 0.4s">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-xl bg-amber-50 text-amber-700 flex items-center justify-center text-2xl shadow-sm">
                            <i class="fas fa-handshake"></i>
                        </div>
                        <div>
                            <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">匹配成功</p>
                            <h3 class="text-2xl font-bold text-gray-900" id="stats-matched">—</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 二级导航 -->
            <div class="border-b border-gray-100 mb-8">
                <nav class="-mb-px flex space-x-8">
                    <button class="tab-item active whitespace-nowrap py-4 px-1 font-semibold text-sm transition-all duration-200" data-tab="all">
                        全部职位
                    </button>
                    <button class="tab-item text-gray-400 hover:text-gray-600 whitespace-nowrap py-4 px-1 font-medium text-sm transition-all duration-200" data-tab="active">
                        招聘中
                    </button>
                    <button class="tab-item text-gray-400 hover:text-gray-600 whitespace-nowrap py-4 px-1 font-medium text-sm transition-all duration-200" data-tab="paused">
                        已暂停
                    </button>
                    <button class="tab-item text-gray-400 hover:text-gray-600 whitespace-nowrap py-4 px-1 font-medium text-sm transition-all duration-200" data-tab="closed">
                        已关闭
                    </button>
                    <button class="tab-item text-gray-400 hover:text-gray-600 whitespace-nowrap py-4 px-1 font-medium text-sm transition-all duration-200" data-tab="draft">
                        草稿
                    </button>
                </nav>
            </div>

            <!-- 筛选和搜索 -->
            <div class="stat-card rounded-2xl p-5 mb-8 animate-in" style="animation-delay: 0.5s">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="relative group">
                        <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">搜索职位</label>
                        <div class="relative">
                            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors"></i>
                            <input type="text" placeholder="输入职位名称或关键词" class="w-full pl-10 pr-4 py-2.5 bg-gray-50/50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500/50 transition-all text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">职位类型</label>
                        <div class="relative">
                            <select class="w-full px-4 py-2.5 bg-gray-50/50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500/50 transition-all text-sm appearance-none cursor-pointer">
                                <option value="">全部类型</option>
                                <option value="fulltime">全职</option>
                                <option value="parttime">兼职</option>
                                <option value="contract">合同工</option>
                                <option value="intern">实习</option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">工作地点</label>
                        <div class="relative">
                            <select class="w-full px-4 py-2.5 bg-gray-50/50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500/50 transition-all text-sm appearance-none cursor-pointer">
                                <option value="">全部地点</option>
                                <option value="beijing">北京</option>
                                <option value="shanghai">上海</option>
                                <option value="guangzhou">广州</option>
                                <option value="shenzhen">深圳</option>
                                <option value="remote">远程</option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">发布时间</label>
                        <div class="relative">
                            <select class="w-full px-4 py-2.5 bg-gray-50/50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500/50 transition-all text-sm appearance-none cursor-pointer">
                                <option value="">全部时间</option>
                                <option value="today">今天</option>
                                <option value="week">本周</option>
                                <option value="month">本月</option>
                                <option value="quarter">本季度</option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 职位列表 -->
            <div class="stat-card rounded-2xl overflow-hidden animate-in" style="animation-delay: 0.6s">
                <div class="px-6 py-5 border-b border-gray-50 flex justify-between items-center bg-white">
                    <div>
                        <h3 class="text-base font-bold text-gray-900">职位列表</h3>
                        <p class="text-xs text-gray-400 mt-1">共 <span id="total-count" class="font-semibold text-blue-600">12</span> 个职位</p>
                    </div>
                </div>
                
                <div class="divide-y divide-gray-50" id="job-list"></div>
                
                <!-- 分页 -->
                <div class="bg-gray-50/30 px-6 py-4 border-t border-gray-50">
                    <div class="flex items-center justify-between">
                        <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                            <div>
                                <p class="text-xs text-gray-400">
                                    显示第 <span class="font-semibold text-gray-600">1</span> 到 <span class="font-semibold text-gray-600">10</span> 条，共 <span class="font-semibold text-gray-600">12</span> 条记录
                                </p>
                            </div>
                            <div>
                                <nav class="relative z-0 inline-flex space-x-2">
                                    <button class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-400 hover:bg-gray-50 transition-colors">
                                        <i class="fas fa-chevron-left text-xs"></i>
                                    </button>
                                    <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-600 text-white font-semibold text-xs shadow-md shadow-blue-200">1</button>
                                    <button class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-500 hover:bg-gray-50 font-medium text-xs transition-colors">2</button>
                                    <button class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-400 hover:bg-gray-50 transition-colors">
                                        <i class="fas fa-chevron-right text-xs"></i>
                                    </button>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 依赖脚本：确保在页面逻辑之前加载 -->
    <script src="../js/resume-data.js?v=3"></script>
    <script src="../js/user-auth.js"></script>
    <script src="../js/error-handler.js"></script>

    <script>
        const navItems=document.querySelectorAll('.nav-item-modern');
        navItems.forEach(item=>{ item.addEventListener('click',function(e){ if(this.getAttribute('href')&&this.getAttribute('href')!=='#'){ return; } e.preventDefault(); navItems.forEach(i=>i.classList.remove('active')); this.classList.add('active'); }); });
        function navigateToJobPosting(){ window.location.href='/pages/job-posting.html'; }
        function navigateToResumeUpload(){ window.location.href='/pages/resume-upload-pc.html'; }
        function navigateToAnalytics(){ window.location.href='/pages/analytics-dashboard.html'; }
    </script>

    <script>
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            initUserAuth();
            initTabs();
            loadJobs();
        });

        // 加载职位数据
        async function loadJobs() {
            try {
                if (!window.resumeDataManager || typeof window.resumeDataManager.getAllJobs !== 'function') {
                    throw new Error('数据管理器未初始化或方法缺失');
                }
                
                // 并行加载职位和候选人数据
                // 使用 /recruitment/pipeline 接口以获取带有 job_id 的候选人数据
                const [jobs, pipelineResp] = await Promise.all([
                    window.resumeDataManager.getAllJobs(),
                    window.resumeDataManager.apiRequest('/recruitment/pipeline', 'GET', null, true, true).catch(e => ({ data: [] }))
                ]);

                const pipelineData = pipelineResp.data || [];

                // 处理候选人数据，转为扁平数组
                let allCandidates = [];
                if (Array.isArray(pipelineData)) {
                    allCandidates = pipelineData;
                } else if (pipelineData && typeof pipelineData === 'object') {
                     Object.values(pipelineData).forEach(list => {
                        if (Array.isArray(list)) {
                            allCandidates = allCandidates.concat(list);
                        }
                    });
                }

                renderJobs(jobs, allCandidates);
                updateStatistics(jobs);
            } catch (error) {
                console.error('加载职位数据失败:', error);
                // 如果API调用失败，显示错误消息
                const jobList = document.getElementById('job-list');
                if (jobList) {
                    jobList.innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <div class="text-red-500 mb-2">
                                <i class="fas fa-exclamation-triangle text-4xl"></i>
                            </div>
                            <h3 class="text-lg font-medium text-gray-900 mb-2">加载数据失败</h3>
                            <p class="text-gray-600">无法获取职位数据，请检查登录状态、脚本加载顺序或刷新页面重试</p>
                        </div>
                    `;
                }
            }
        }

        // 渲染职位列表
        function renderJobs(jobs, allCandidates = []) {
            const jobList = document.getElementById('job-list');
            if (!jobList) return;

            if (jobs.length === 0) {
                jobList.innerHTML = `
                    <div class="col-span-full text-center py-20">
                        <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-briefcase text-3xl text-gray-200"></i>
                        </div>
                        <h3 class="text-base font-bold text-gray-900 mb-1">暂无职位</h3>
                        <p class="text-sm text-gray-400 mb-6">还没有发布任何职位，点击"发布职位"开始创建</p>
                        <a href="job-posting.html" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700 transition-all">
                            <i class="fas fa-plus mr-2 text-xs"></i>
                            发布首个职位
                        </a>
                    </div>
                `;
                return;
            }

            jobList.innerHTML = jobs.map(job => {
                // 获取当前职位的候选人
                const jobCandidates = allCandidates.filter(c => String(c.job_id || c.jobId) === String(job.id));
                // 取最新的5个
                const recentCandidates = jobCandidates.slice(0, 5);
                const extraCount = jobCandidates.length > 5 ? jobCandidates.length - 5 : 0;
                
                // 生成头像HTML
                const avatarsHtml = recentCandidates.map(c => {
                    const name = c.name || c.file_name || '未知';
                    const initials = name.substring(0, 2);
                    const colors = ['bg-blue-100 text-blue-600', 'bg-purple-100 text-purple-600', 'bg-green-100 text-green-600', 'bg-amber-100 text-amber-600', 'bg-rose-100 text-rose-600'];
                    const colorClass = colors[name.charCodeAt(0) % colors.length];
                    
                    return `
                        <div class="w-8 h-8 rounded-full ${colorClass} flex items-center justify-center text-[10px] font-bold border-2 border-white -ml-2 first:ml-0 shadow-sm" title="${name}">
                            ${initials}
                        </div>
                    `;
                }).join('');
                
                const moreHtml = extraCount > 0 ? `
                    <div class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center text-[10px] font-bold border-2 border-white -ml-2 shadow-sm">
                        +${extraCount}
                    </div>
                ` : '';
                
                const candidatesSection = jobCandidates.length > 0 ? `
                    <div class="flex items-center pl-4 pr-4 border-l border-gray-100 h-8 hidden md:flex">
                        <div class="flex -space-x-2">
                            ${avatarsHtml}
                            ${moreHtml}
                        </div>
                    </div>
                ` : '';

                return `
                <div class="p-3 hover:bg-gray-50/50 transition-all group">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3 flex-1">
                            <div class="flex-shrink-0">
                                <div class="w-10 h-10 bg-white border border-gray-100 rounded-xl flex items-center justify-center shadow-sm group-hover:border-blue-100 group-hover:bg-blue-50/30 transition-all">
                                    <i class="fas fa-code text-blue-600 text-lg"></i>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center space-x-2">
                                    <h4 class="text-sm font-bold text-gray-900">
                                        <a href="job-detail.html?id=${job.id}" class="hover:text-blue-600 transition-colors">${job.title}</a>
                                    </h4>
                                    <span class="inline-flex items-center px-2 py-0.5 rounded-lg text-[10px] font-bold uppercase tracking-wider ${getStatusClass(job.status)}">
                                        ${getStatusText(job.status)}
                                    </span>
                                </div>
                                <div class="mt-1 flex items-center space-x-3 text-[11px] text-gray-400">
                                    <span class="flex items-center"><i class="fas fa-map-marker-alt mr-1 opacity-50"></i>${job.location || '未指定'}</span>
                                    <span class="flex items-center font-medium text-gray-500"><i class="fas fa-dollar-sign mr-1 opacity-50"></i>${job.salary_range || '面议'}</span>
                                    <span class="flex items-center"><i class="fas fa-calendar mr-1 opacity-50"></i>${job.experience_required || '不限'}</span>
                                    <span class="flex items-center text-gray-300">
                                        <span class="mx-1">•</span>
                                        ${formatDate(job.created_at)}
                                    </span>
                                </div>
                            </div>
                        </div>
                        
                        ${candidatesSection}

                        <div class="flex items-center space-x-2 opacity-0 group-hover:opacity-100 transition-all">
                            <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-gray-400 hover:text-blue-600 hover:border-blue-100 hover:bg-blue-50/50 shadow-sm transition-all" onclick="editJob(${job.id})" title="编辑">
                                <i class="fas fa-edit text-xs"></i>
                            </button>
                            <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-gray-400 hover:text-red-600 hover:border-red-100 hover:bg-red-50/50 shadow-sm transition-all" onclick="deleteJob(${job.id})" title="删除">
                                <i class="fas fa-trash text-xs"></i>
                            </button>
                            <div class="w-px h-3 bg-gray-100 mx-0.5"></div>
                            <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-600 text-white shadow-md shadow-blue-100 hover:bg-blue-700 transition-all" onclick="window.location.href='job-detail.html?id=${job.id}'" title="查看详情">
                                <i class="fas fa-chevron-right text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;}).join('');
        }

        // 更新统计数据
        function updateStatistics(jobs) {
            const totalCount = document.getElementById('total-count');
            if (totalCount) {
                totalCount.textContent = jobs.length;
            }
            const totalEl = document.getElementById('stats-total');
            const activeEl = document.getElementById('stats-active');
            const resumesEl = document.getElementById('stats-resumes');
            const matchedEl = document.getElementById('stats-matched');

            (async ()=>{
                try {
                    const statsResp = await userAuthInstance.apiRequest('/company/recruitment-stats');
                    const s = statsResp && statsResp.data ? statsResp.data : {};
                    if (totalEl) totalEl.textContent = s.total ?? jobs.length;
                    if (activeEl) activeEl.textContent = s.active ?? jobs.filter(j => (j.status||'').toLowerCase() === 'active').length;
                } catch(e) {
                    if (totalEl) totalEl.textContent = jobs.length;
                    if (activeEl) activeEl.textContent = jobs.filter(j => (j.status||'').toLowerCase() === 'active').length;
                }
                try {
                    const resumesResp = await userAuthInstance.apiRequest('/resumes');
                    const resumes = resumesResp && resumesResp.data ? resumesResp.data : [];
                    if (resumesEl) resumesEl.textContent = resumes.length;
                } catch(e) {
                    if (resumesEl) resumesEl.textContent = '—';
                }
                if (matchedEl) matchedEl.textContent = jobs.reduce((sum,j)=> sum + (j.matched_count||0), 0);
            })();
        }

        // 状态样式
        function getStatusClass(status) {
            switch(status) {
                case 'active': return 'bg-emerald-50 text-emerald-600 border border-emerald-100';
                case 'paused': return 'bg-amber-50 text-amber-600 border border-amber-100';
                case 'closed': return 'bg-gray-50 text-gray-500 border border-gray-100';
                case 'draft': return 'bg-blue-50 text-blue-600 border border-blue-100';
                default: return 'bg-gray-50 text-gray-500 border border-gray-100';
            }
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusTexts = {
                'active': '招聘中',
                'paused': '已暂停',
                'closed': '已关闭',
                'draft': '草稿'
            };
            return statusTexts[status] || '草稿';
        }

        // 格式化日期
        function formatDate(dateString) {
            if (!dateString) return '未知';
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN');
        }

        // 编辑职位
        function editJob(jobId) {
            window.location.href = `job-posting.html?id=${jobId}`;
        }

        // 删除职位
        async function deleteJob(jobId) {
            ui.showConfirm('确定要删除这个职位吗？', async () => {
                try {
                    await window.resumeDataManager.deleteJob(jobId);
                    ui.showToast('职位删除成功', 'success');
                    loadJobs(); // 重新加载职位列表
                } catch (error) {
                    console.error('删除职位失败:', error);
                    ui.showToast('删除失败，请重试', 'error');
                }
            }, null, { type: 'danger', title: '删除确认' });
        }

        // 用户认证检查
        function initUserAuth() {
            const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
            const isLoggedIn = userInfo.isLoggedIn;
            
            if (!isLoggedIn) {
                window.location.href = 'login.html';
                return;
            }
            
            // 显示用户信息
            const userName = document.querySelector('[data-user-name]');
            if (userName) {
                if (typeof HeaderProfile !== 'undefined' && HeaderProfile.getDisplayId) {
                    userName.textContent = HeaderProfile.getDisplayId();
                } else {
                    const u = userInfo.user || userInfo;
                    let uid = u.userId || u.id || u.uid || null;
                    if (uid) {
                        userName.textContent = `用户${uid}`;
                    } else {
                        const seed = (u.phone || u.email || u.username || '');
                        let h = 0;
                        for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
                        const digits = (u.phone || '').replace(/\D/g, '');
                        const part1 = digits && digits.length >= 4 ? digits.slice(-4) : String(1000 + (h % 9000));
                        const part2 = String(1000 + ((h >>> 13) % 9000));
                        userName.textContent = `用户${part1}-${part2}`;
                    }
                }
            }
            
            // 退出登录
            const logoutBtn = document.querySelector('[data-logout-btn]');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    ui.showConfirm('确定要退出登录吗？', () => {
                        // 使用userAuthInstance登出
                        if (typeof userAuthInstance !== 'undefined') {
                            userAuthInstance.logout();
                        } else {
                            // 使用userAuthInstance登出
                        if (typeof userAuthInstance !== 'undefined') {
                            userAuthInstance.logout();
                        } else {
                            localStorage.removeItem('userInfo');
                        }
                        }
                        window.location.href = 'login.html';
                    });
                });
            }
        }

        // 初始化标签页
        function initTabs() {
            const tabs = document.querySelectorAll('[data-tab]');
            tabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.preventDefault();
                    tabs.forEach(t => {
                        t.classList.remove('active', 'font-semibold', 'text-blue-600');
                        t.classList.add('text-gray-400', 'font-medium');
                    });
                    tab.classList.add('active', 'font-semibold', 'text-blue-600');
                    tab.classList.remove('text-gray-400', 'font-medium');
                    
                    const status = tab.dataset.tab;
                    filterJobs(status);
                });
            });
        }

        // 根据标签页筛选岗位
        function filterJobs(tabType) {
            console.log('切换到标签页:', tabType);
            // 这里可以实现实际的筛选逻辑
        }

        // 创建职位
        function createJob() {
            ui.showNotification('发布职位功能开发中...', 'info');
        }

        // 批量匹配
        function batchMatch() {
            ui.showNotification('批量匹配功能开发中...', 'info');
        }

        // 查看职位
        function viewJob(id) {
            ui.showNotification(`查看职位 ID: ${id}`, 'info');
        }

        // 编辑职位
        function editJob(id) {
            ui.showNotification(`编辑职位 ID: ${id}`, 'info');
        }

        // 匹配简历
        function matchCandidates(id) {
            ui.showNotification(`匹配简历 ID: ${id}`, 'info');
        }

        // 检查邮箱配置状态
        function checkEmailConfig() {
            // 从localStorage获取邮箱配置信息
            const emailConfig = localStorage.getItem('emailConfig');
            return emailConfig ? JSON.parse(emailConfig) : null;
        }

        // 关闭邮箱相关模态框
        function closeEmailModal() {
            const modals = document.querySelectorAll('.fixed.inset-0.bg-black.bg-opacity-50');
            modals.forEach(modal => {
                if (modal.querySelector('.fas.fa-envelope') || modal.querySelector('#emailConfigForm')) {
                    modal.remove();
                }
            });
        }

    </script>
    <!-- 一键导入模态框 -->
    <div id="import-job-modal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" id="import-modal-backdrop"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-blue-100 sm:mx-0 sm:h-10 sm:w-10">
                            <i class="fas fa-cloud-download-alt text-blue-600"></i>
                        </div>
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">一键导入职位</h3>
                            <div class="mt-2">
                                <p class="text-sm text-gray-500 mb-4">
                                    输入职位链接，系统将跳转至发布页面并自动填充信息。
                                </p>
                                <div class="mb-4">
                                    <label for="import-url" class="block text-sm font-medium text-gray-700 mb-1">职位链接 URL</label>
                                    <input type="url" name="import-url" id="import-url" class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md p-2 border" placeholder="https://example.com/job/123">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" id="confirm-import-btn" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
                        开始导入
                    </button>
                    <button type="button" id="cancel-import-btn" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        取消
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const importBtn = document.getElementById('import-btn');
            const modal = document.getElementById('import-job-modal');
            const cancelBtn = document.getElementById('cancel-import-btn');
            const confirmBtn = document.getElementById('confirm-import-btn');
            const urlInput = document.getElementById('import-url');
            
            if (importBtn) {
                importBtn.addEventListener('click', () => {
                    modal.classList.remove('hidden');
                    urlInput.value = '';
                });
            }

            if (cancelBtn) {
                cancelBtn.addEventListener('click', () => {
                    modal.classList.add('hidden');
                });
            }
            
            const backdrop = document.getElementById('import-modal-backdrop');
            if(backdrop) {
                backdrop.addEventListener('click', () => {
                    modal.classList.add('hidden');
                });
            }

            if (confirmBtn) {
                confirmBtn.addEventListener('click', () => {
                    const url = urlInput.value.trim();
                    if (url) {
                        window.location.href = `job-posting.html?importUrl=${encodeURIComponent(url)}`;
                    }
                });
            }
        })();
    </script>
