<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析仪表板 - 智能简历助手</title>
    <script src="../js/tailwindcss.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .chart-container { position: relative; height: 300px; width: 100%; }
        .metric-card { transition: all 0.3s ease; }
        .metric-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
    <link rel="stylesheet" href="/css/sidebar.css">
</head>
<body class="bg-gray-50">
    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20">
        <div class="flex items-center justify-between p-4">
            <div class="flex items-center space-x-4">
                <button class="menu-button p-2 rounded-lg hover:bg-gray-100" id="sidebar-toggle">
                    <i class="fas fa-bars text-gray-900"></i>
                </button>
                <h1 class="brand-title text-lg font-bold text-gray-900">数据分析仪表板</h1>
            </div>
            <div class="flex items-center space-x-4" id="header-right-section">
                <!-- User Profile rendered by HeaderProfile -->
            </div>
        </div>
    </header>

    
        <aside id="sidebar" class="fixed left-0 top-0 bottom-0 sidebar-modern z-40"></aside>
        
        <main id="main-content" class="main-content pt-20 p-6">
            <!-- Toolbar -->
            <div class="flex justify-end mb-6 space-x-4">
                <button class="text-gray-500 hover:text-gray-700"><i class="fas fa-sync-alt mr-2"></i>刷新</button>
                <button class="text-gray-500 hover:text-gray-700"><i class="fas fa-download mr-2"></i>导出</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="metric-card rounded-xl p-6 bg-blue-600 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm opacity-90">总简历数</p>
                            <p class="text-2xl font-bold">—</p>
                            <p class="text-sm opacity-75 mt-1">—</p>
                        </div>
                        <div class="w-12 h-12 bg-white bg-opacity-20 rounded-lg flex items-center justify-center">
                            <i class="fas fa-file-alt text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="metric-card rounded-xl p-6 bg-blue-600 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm opacity-90">活跃用户</p>
                            <p class="text-2xl font-bold">—</p>
                            <p class="text-sm opacity-75 mt-1">—</p>
                        </div>
                        <div class="w-12 h-12 bg-white bg-opacity-20 rounded-lg flex items-center justify-center">
                            <i class="fas fa-users text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="metric-card rounded-xl p-6 bg-blue-600 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm opacity-90">AI优化次数</p>
                            <p class="text-2xl font-bold">—</p>
                            <p class="text-sm opacity-75 mt-1">—</p>
                        </div>
                        <div class="w-12 h-12 bg-white bg-opacity-20 rounded-lg flex items-center justify-center">
                            <i class="fas fa-robot text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="metric-card rounded-xl p-6 bg-blue-600 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm opacity-90">月收入</p>
                            <p class="text-2xl font-bold">—</p>
                            <p class="text-sm opacity-75 mt-1">—</p>
                        </div>
                        <div class="w-12 h-12 bg白 bg-opacity-20 rounded-lg flex items-center justify-center">
                            <i class="fas fa-yen-sign text-2xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="bg-white border border-gray-200 shadow-sm p-6 rounded-xl">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-gray-900">简历创建与优化趋势</h3>
                        <button class="text-gray-500 hover:text-gray-700" data-export-chart="resumeAnalytics">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                    <div class="chart-container">
                        <canvas id="resumeAnalyticsChart"></canvas>
                    </div>
                </div>

                <div class="glass-card p-6 rounded-xl">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-gray-900">用户活跃度统计</h3>
                        <button class="text-gray-500 hover:text-gray-700" data-export-chart="userActivity">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                    <div class="chart-container">
                        <canvas id="userActivityChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="glass-card p-6 rounded-xl">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-gray-900">AI服务使用分布</h3>
                        <button class="text-gray-500 hover:text-gray-700" data-export-chart="aiService">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                    <div class="chart-container">
                        <canvas id="aiServiceChart"></canvas>
                    </div>
                </div>

                <div class="glass-card p-6 rounded-xl">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-gray-900">简历模板使用分析</h3>
                        <button class="text-gray-500 hover:text-gray-700" data-export-chart="templateUsage">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                    <div class="chart-container">
                        <canvas id="templateUsageChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="glass-card p-6 rounded-xl">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-gray-900">收入统计趋势</h3>
                        <button class="text-gray-500 hover:text-gray-700" data-export-chart="revenue">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>

                <div class="glass-card p-6 rounded-xl">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-gray-900">系统性能监控</h3>
                        <button class="text-gray-500 hover:text-gray-700" data-export-chart="performance">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                    <div class="chart-container">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>
            </div>
        </main>

    <div id="notification-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script src="/js/sidebar.js"></script>
    <script>
        Sidebar.init({ mount:'#sidebar', active:'analysis', options:{ hideSubscription:true } });
        function navigateToJobPosting() { window.location.href = 'job-management.html'; }
        function navigateToResumeUpload() { window.location.href = 'resume-upload-pc.html'; }
        function navigateToAnalytics() { window.location.href = 'analytics-dashboard.html'; }
    </script>
    <script src="/js/ui-components.js"></script>
    <script src="/js/dashboard-charts.js"></script>
    <script>
        const uiComponents=new UIComponents();
        document.addEventListener('DOMContentLoaded',function(){
            document.querySelector('.fa-sync-alt').parentElement.addEventListener('click',function(){uiComponents.showNotification('数据刷新功能未连接','warning')});
            document.querySelector('.fa-download').parentElement.addEventListener('click',function(){uiComponents.showNotification('导出功能未连接','warning')});
        });
        window.addEventListener('beforeunload',function(){if(window.dashboardCharts){window.dashboardCharts.destroyAllCharts()}});
    </script>
</body>
</html>
