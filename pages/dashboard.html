<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作台 - 争湃·简历大师</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="../js/tailwindcss.js"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        .glass-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .gradient-text {
            color: #2563EB;
        }
        .hover-lift {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <!-- 侧边栏 -->
    <aside id="sidebar" class="sidebar-modern"></aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- 顶部导航栏 -->
    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20">
        <div class="flex items-center justify-between p-4">
            <div class="flex items-center space-x-4">
                <button class="menu-button p-2 rounded-lg hover:bg-gray-100" id="sidebar-toggle">
                    <i class="fas fa-bars text-gray-900"></i>
                </button>
                <h1 class="brand-title text-lg font-bold text-gray-900">争湃·简历大师</h1>
            </div>
            <div class="flex items-center space-x-4" id="header-right-section">
                <!-- User Profile rendered by HeaderProfile -->
            </div>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="main-content pt-20 p-6 transition-all duration-300" id="main-content">
        <div class="max-w-7xl mx-auto space-y-6">
            
            <!-- 欢迎栏 -->
            <div class="flex flex-col md:flex-row md:items-center justify-between bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">
                        <span id="greeting">早安</span>，<span id="user-id" class="gradient-text">用户</span>
                    </h1>
                    <p class="text-gray-500 mt-1 flex items-center">
                        <i class="far fa-calendar-alt mr-2"></i>
                        <span id="current-date">正在加载日期...</span>
                        <span class="mx-2">|</span>
                        <span>今日工作概览</span>
                    </p>
                </div>
                <div class="mt-4 md:mt-0 flex space-x-3">
                    <button onclick="window.location.href='resume-upload-pc.html'" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center shadow-lg shadow-blue-500/30">
                        <i class="fas fa-plus mr-2"></i>新建任务
                    </button>
                    <button onclick="window.location.href='comparison.html'" class="px-4 py-2 bg-white text-gray-700 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors flex items-center">
                        <i class="fas fa-columns mr-2"></i>简历对比
                    </button>
                </div>
            </div>

            <!-- 数据概览卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- 卡片 1: 候选人 -->
                <div id="stat-candidates" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover-lift cursor-pointer" onclick="window.location.href='librarypool.html'">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm font-medium text-gray-500">总候选人</p>
                            <h3 class="text-3xl font-bold text-gray-900 mt-2 stat-value">--</h3>
                            <p class="text-xs text-blue-600 mt-2 font-medium flex items-center">
                                <i class="fas fa-arrow-up mr-1"></i>
                                <span class="stat-subtitle">今日新增 --</span>
                            </p>
                        </div>
                        <div class="p-3 bg-blue-50 rounded-lg text-blue-600">
                            <i class="fas fa-users text-xl"></i>
                        </div>
                    </div>
                </div>

                <!-- 卡片 2: 职位 -->
                <div id="stat-jobs" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover-lift cursor-pointer" onclick="window.location.href='job-management.html'">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm font-medium text-gray-500">在招职位</p>
                            <h3 class="text-3xl font-bold text-gray-900 mt-2 stat-value">--</h3>
                            <p class="text-xs text-gray-500 mt-2 stat-subtitle">招聘进行中</p>
                        </div>
                        <div class="p-3 bg-blue-50 rounded-lg text-blue-600">
                            <i class="fas fa-briefcase text-xl"></i>
                        </div>
                    </div>
                </div>

                <!-- 卡片 3: 面试 -->
                <div id="stat-interviews" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover-lift cursor-pointer" onclick="window.location.href='recruitment-flow.html'">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm font-medium text-gray-500">待面试</p>
                            <h3 class="text-3xl font-bold text-gray-900 mt-2 stat-value">--</h3>
                            <p class="text-xs text-blue-600 mt-2 stat-subtitle">即将开始</p>
                        </div>
                        <div class="p-3 bg-blue-50 rounded-lg text-blue-600">
                            <i class="fas fa-calendar-check text-xl"></i>
                        </div>
                    </div>
                </div>

                <!-- 卡片 4: Offer -->
                <div id="stat-offers" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover-lift cursor-pointer" onclick="window.location.href='recruitment-flow.html'">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm font-medium text-gray-500">Offer管理</p>
                            <h3 class="text-3xl font-bold text-gray-900 mt-2 stat-value">--</h3>
                            <p class="text-xs text-blue-600 mt-2 stat-subtitle">待入职</p>
                        </div>
                        <div class="p-3 bg-blue-50 rounded-lg text-blue-600">
                            <i class="fas fa-check-circle text-xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 核心功能区 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- 左侧：招聘漏斗 (占据 2 列) -->
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-lg font-bold text-gray-900 flex items-center">
                            <i class="fas fa-filter text-blue-500 mr-2"></i>招聘漏斗
                        </h2>
                        <select class="text-sm border-gray-200 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                            <option>所有职位</option>
                            <option>本周</option>
                            <option>本月</option>
                        </select>
                    </div>
                    <div class="relative h-64 w-full">
                        <canvas id="recruitmentFunnelChart"></canvas>
                    </div>
                </div>

                <!-- 右侧：待办事项 -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold text-gray-900 flex items-center">
                            <i class="fas fa-clipboard-list text-blue-500 mr-2"></i>待办事项
                        </h2>
                        <span class="text-xs font-medium text-blue-600 cursor-pointer hover:underline" onclick="window.location.href='recruitment-flow.html'">查看全部</span>
                    </div>
                    <div id="pending-tasks-list" class="space-y-2 overflow-y-auto h-64 pr-2 custom-scrollbar">
                        <!-- 动态加载待办事项 -->
                        <div class="animate-pulse space-y-3">
                            <div class="h-10 bg-gray-100 rounded"></div>
                            <div class="h-10 bg-gray-100 rounded"></div>
                            <div class="h-10 bg-gray-100 rounded"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI预测模块 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-3 bg-white p-6 rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold text-gray-900 flex items-center">
                            <i class="fas fa-chart-line text-blue-500 mr-2"></i>AI预测
                        </h2>
                        <select id="ai-prediction-range" class="text-sm border-gray-200 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                            <option value="7d">未来7天</option>
                            <option value="30d">未来30天</option>
                        </select>
                    </div>
                    <div id="ai-prediction-content" class="min-h-[16rem]">
                        <div class="h-full flex items-center justify-center text-gray-400">正在加载预测...</div>
                    </div>
                </div>
            </div>

            <!-- AI助手与快捷入口 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 快捷功能入口 -->
                <div class="col-span-3 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center">
                        <i class="fas fa-bolt text-blue-500 mr-2"></i>常用功能
                    </h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <a href="javascript:void(0)" onclick="openLibraryUploadModal()" class="flex flex-col items-center justify-center p-4 rounded-lg bg-gray-50 hover:bg-blue-50 hover:text-blue-600 transition-colors group">
                            <i class="fas fa-cloud-upload-alt text-2xl mb-2 text-gray-400 group-hover:text-blue-500"></i>
                            <span class="text-sm font-medium">导入简历</span>
                        </a>
                        <a href="job-posting.html" class="flex flex-col items-center justify-center p-4 rounded-lg bg-gray-50 hover:bg-blue-50 hover:text-blue-600 transition-colors group">
                            <i class="fas fa-plus-circle text-2xl mb-2 text-gray-400 group-hover:text-blue-500"></i>
                            <span class="text-sm font-medium">发布职位</span>
                        </a>
                        <a href="comparison.html" class="flex flex-col items-center justify-center p-4 rounded-lg bg-gray-50 hover:bg-blue-50 hover:text-blue-600 transition-colors group">
                            <i class="fas fa-balance-scale text-2xl mb-2 text-gray-400 group-hover:text-blue-500"></i>
                            <span class="text-sm font-medium">简历对比</span>
                        </a>
                        <a href="librarypool.html" class="flex flex-col items-center justify-center p-4 rounded-lg bg-gray-50 hover:bg-blue-50 hover:text-blue-600 transition-colors group">
                            <i class="fas fa-database text-2xl mb-2 text-gray-400 group-hover:text-blue-500"></i>
                            <span class="text-sm font-medium">人才库</span>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </main>
    
    <!-- AI 悬浮按钮 -->
    <a href="assistant-chat.html" class="fixed bottom-8 right-8 w-14 h-14 bg-blue-600 rounded-full shadow-lg flex items-center justify-center text-white hover:bg-blue-700 transition-all hover:scale-110 z-50 group">
        <i class="fas fa-robot text-2xl"></i>
        <span class="absolute right-full mr-4 bg-gray-900 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">AI 助手</span>
    </a>

    <!-- 注册后三步引导 Modal -->
    <div id="onboarding-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-3xl rounded-2xl shadow-xl overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-flag-checkered text-blue-600"></i>
                    <h3 class="text-lg font-bold text-gray-900">首次使用引导</h3>
                </div>
                <button id="onboarding-close" class="p-2 rounded-lg hover:bg-gray-50">
                    <i class="fas fa-times text-gray-500"></i>
                </button>
            </div>
            <div class="px-6 py-4 border-b border-gray-100">
                <div class="grid grid-cols-3 gap-3">
                    <div id="step-ind-1" class="flex items-center p-3 rounded-lg border border-blue-200 bg-blue-50">
                        <div class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs mr-2">1</div>
                        <div class="text-sm font-semibold text-blue-800">设置密码</div>
                    </div>
                    <div id="step-ind-2" class="flex items-center p-3 rounded-lg border border-gray-200">
                        <div class="w-6 h-6 rounded-full bg-gray-400 text-white flex items-center justify-center text-xs mr-2">2</div>
                        <div class="text-sm font-semibold text-gray-800">完善个人信息</div>
                    </div>
                    <div id="step-ind-3" class="flex items-center p-3 rounded-lg border border-gray-200">
                        <div class="w-6 h-6 rounded-full bg-gray-400 text-white flex items-center justify-center text-xs mr-2">3</div>
                        <div class="text-sm font-semibold text-gray-800">完善企业信息</div>
                    </div>
                </div>
            </div>
            <div class="px-6 py-6 space-y-6">
                <!-- Step 1: 设置密码 -->
                <div id="onb-step-1" class="space-y-4">
                    <p class="text-sm text-gray-600">为了您的账户安全，建议设置登录密码，后续可直接使用密码登录。</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">新密码</label>
                            <input id="onb-password" type="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="至少6位" minlength="6">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">确认密码</label>
                            <input id="onb-password-confirm" type="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="再次输入" minlength="6">
                        </div>
                    </div>
                    <div class="flex justify-between">
                        <button id="onb-skip-1" class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200">跳过</button>
                        <button id="onb-next-1" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">下一步</button>
                    </div>
                </div>

                <!-- Step 2: 个人信息 -->
                <div id="onb-step-2" class="space-y-6 hidden">
                    <div class="flex flex-col md:flex-row gap-8 items-start">
                        <!-- Avatar Section -->
                        <div class="flex-shrink-0">
                            <label class="block text-sm font-medium text-gray-700 mb-3">头像</label>
                            <div class="flex items-center space-x-4">
                                <div class="relative group cursor-pointer" onclick="document.getElementById('onb-avatar').click()">
                                    <div class="w-24 h-24 rounded-full bg-gray-100 border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden hover:border-blue-500 transition-colors">
                                        <img id="onb-avatar-preview" class="w-full h-full object-cover hidden" />
                                        <i id="onb-avatar-icon" class="fas fa-user text-3xl text-gray-400 group-hover:text-blue-500 transition-colors"></i>
                                        <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 flex items-center justify-center transition-all">
                                            <span class="text-white text-xs opacity-0 group-hover:opacity-100 font-medium">更换</span>
                                        </div>
                                    </div>
                                    <input id="onb-avatar" type="file" accept="image/*" class="hidden" />
                                </div>
                                <div class="flex flex-col space-y-2">
                                    <button type="button" onclick="document.getElementById('onb-avatar').click()" class="px-3 py-1.5 text-xs font-medium text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-50 transition-colors shadow-sm">选择文件</button>
                                    <button type="button" id="avatar-crop-open" class="px-3 py-1.5 text-xs font-medium text-blue-700 bg-blue-50 border border-blue-200 rounded hover:bg-blue-100 transition-colors shadow-sm">裁剪</button>
                                    <span class="text-xs text-gray-400" id="file-name-display">未选择文件</span>
                                </div>
                            </div>
                        </div>

                        <!-- Form Fields -->
                        <div class="flex-grow space-y-5 w-full">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">显示ID <span class="text-gray-400 font-normal">（只读，系统分配）</span></label>
                                <div class="relative">
                                    <input id="onb-user-id" type="text" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-gray-50 text-gray-600 focus:outline-none" readonly>
                                </div>
                                <p class="text-xs text-gray-500 mt-1.5">用于系统显示与识别，已与右上角头像显示保持一致。</p>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">用户名 <span class="text-gray-400 font-normal">（可选）</span></label>
                                    <input id="onb-username" type="text" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow" placeholder="admin">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">手机号 <span class="text-gray-400 font-normal">（可选）</span></label>
                                    <input id="onb-phone" type="tel" maxlength="11" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow" placeholder="用于联系与找回">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between pt-4 border-t border-gray-100">
                        <button id="onb-skip-2" class="px-6 py-2.5 text-sm font-medium text-gray-600 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors">跳过</button>
                        <button id="onb-next-2" class="px-6 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-md shadow-blue-500/30 transition-all hover:translate-y-[-1px]">下一步</button>
                    </div>
                </div>

                <!-- Step 3: 企业信息 -->
                <div id="onb-step-3" class="space-y-4 hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">企业名称 *</label>
                            <input id="onb-company-name" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入企业名称">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">联系人 *</label>
                            <input id="onb-contact-name" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入联系人姓名">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">联系人电话 *</label>
                            <input id="onb-contact-phone" type="tel" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入联系人电话">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">公司地址（可选）</label>
                            <input id="onb-address" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="详细地址">
                        </div>
                    </div>
                    <div class="flex justify-between">
                        <button id="onb-skip-3" class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200">稍后再说</button>
                        <button id="onb-finish" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">完成</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="avatar-crop-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <div class="text-lg font-bold text-gray-900">裁剪头像</div>
                <button id="avatar-crop-cancel" class="p-2 rounded-lg hover:bg-gray-50"><i class="fas fa-times text-gray-500"></i></button>
            </div>
            <div class="px-6 py-4 space-y-4">
                <div class="w-full">
                    <canvas id="avatar-crop-canvas" width="400" height="400" class="w-full bg-gray-100 rounded"></canvas>
                </div>
                <div class="flex items-center justify-between">
                    <input id="avatar-crop-zoom" type="range" min="1" max="3" step="0.01" class="w-2/3">
                    <button id="avatar-crop-apply" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">应用裁剪</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/user-auth.js"></script>
    <script src="../js/header-profile.js"></script>
  <script src="/js/sidebar.js"></script>
    <script src="../js/resume-data.js"></script>
    <script src="../js/resume-upload-handler.js"></script>
    <script src="../js/resume-upload-modal.js"></script>
    <script src="../js/dashboard.js"></script>
        <script>
            // Initialize Sidebar
            document.addEventListener('DOMContentLoaded', () => {
                if (typeof Sidebar !== 'undefined' && Sidebar.init) {
                    Sidebar.init({
                        active: 'dashboard'
                    });
                }
                if (typeof HeaderProfile !== 'undefined' && HeaderProfile.init) {
                    HeaderProfile.init('#header-right-section');
                }
            });
        </script>
</body>
</html>
