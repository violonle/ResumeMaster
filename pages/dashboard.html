<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作台 - 争湃·简历大师</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="../js/tailwindcss.js"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="/js/chart.min.js"></script>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: #fdfdfd;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid #f1f3f5;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-color: #e5e7eb;
        }

        .quick-action-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .quick-action-card:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.08);
        }

        .gradient-text {
            color: #1d4ed8;
        }

        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #f1f3f5;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #e9ecef;
        }
    </style>
</head>
<body class="antialiased text-gray-900 selection:bg-blue-100 selection:text-blue-700">
    <!-- 侧边栏 -->
    <aside id="sidebar" class="sidebar-modern"></aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- 顶部导航栏 -->
    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20">
        <div class="flex items-center justify-between p-4">
            <div class="flex items-center space-x-4 pl-8">
                <h1 class="brand-title text-lg font-bold text-gray-900">工作台</h1>
            </div>
            <div class="flex items-center space-x-4" id="header-right-section">
                <!-- User Profile rendered by HeaderProfile -->
            </div>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="main-content p-8 lg:p-12 transition-all duration-300" id="main-content">
        <div class="max-w-[1440px] mx-auto space-y-10 animate-in">
            
            <!-- 欢迎栏 -->
            <div class="flex flex-col md:flex-row md:items-center justify-between">
                <div>
                    <h1 class="text-3xl font-black text-gray-900 tracking-tight">
                        <span id="greeting">早安</span>，<span id="user-id" class="gradient-text">用户</span>
                    </h1>
                    <p class="text-gray-800 mt-1 font-black flex items-center">
                        <i class="far fa-calendar-alt mr-2 text-gray-400"></i>
                        <span id="current-date">正在加载日期...</span>
                        <span class="mx-2 text-gray-300">|</span>
                        <span>今日工作概览</span>
                    </p>
                </div>
                <div class="mt-6 md:mt-0 flex space-x-3">
                    <button onclick="openLibraryUploadModal()" class="px-6 py-3 bg-slate-900 text-white rounded-xl text-sm font-black shadow-lg shadow-gray-200 hover:bg-black transition-all flex items-center">
                        <i class="fas fa-plus mr-2"></i>导入简历文件
                    </button>
                </div>
            </div>

            <!-- 数据概览卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- 卡片 1: 候选人 -->
                <div id="stat-candidates" class="stat-card p-6 rounded-2xl cursor-pointer" onclick="window.location.href='librarypool.html'">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-2xl">
                            <i class="fas fa-users"></i>
                        </div>
                        <div>
                            <p class="text-[11px] font-black text-gray-500 uppercase tracking-widest mb-1">总候选人</p>
                            <h3 class="text-2xl font-black text-gray-900 stat-value">--</h3>
                            <p class="text-[10px] font-black text-blue-600 mt-0.5 flex items-center">
                                <i class="fas fa-arrow-up mr-1"></i>
                                <span class="stat-subtitle">今日新增 --</span>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- 卡片 2: 职位 -->
                <div id="stat-jobs" class="stat-card p-6 rounded-2xl cursor-pointer" onclick="window.location.href='job-management.html'">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-2xl">
                            <i class="fas fa-briefcase"></i>
                        </div>
                        <div>
                            <p class="text-[11px] font-black text-gray-500 uppercase tracking-widest mb-1">在招职位</p>
                            <h3 class="text-2xl font-black text-gray-900 stat-value">--</h3>
                            <p class="text-[10px] font-black text-gray-400 mt-0.5 stat-subtitle">招聘进行中</p>
                        </div>
                    </div>
                </div>

                <!-- 卡片 3: 面试 -->
                <div id="stat-interviews" class="stat-card p-6 rounded-2xl cursor-pointer" onclick="window.location.href='recruitment-flow.html'">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-2xl">
                            <i class="fas fa-calendar-check"></i>
                        </div>
                        <div>
                            <p class="text-[11px] font-black text-gray-500 uppercase tracking-widest mb-1">已快评</p>
                            <h3 class="text-2xl font-black text-gray-900 stat-value">--</h3>
                            <p class="text-[10px] font-black text-blue-600 mt-0.5 stat-subtitle">即将开始</p>
                        </div>
                    </div>
                </div>

                <!-- 卡片 4: Offer -->
                <div id="stat-offers" class="stat-card p-6 rounded-2xl cursor-pointer" onclick="window.location.href='recruitment-flow.html'">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-2xl">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div>
                            <p class="text-[11px] font-black text-gray-500 uppercase tracking-widest mb-1">Offer管理</p>
                            <h3 class="text-2xl font-black text-gray-900 stat-value">--</h3>
                            <p class="text-[10px] font-black text-blue-600 mt-0.5 stat-subtitle">待入职</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 核心功能区 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                
                <!-- 左侧：招聘漏斗 (占据 2 列) -->
                <div class="lg:col-span-2 bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                    <div class="flex items-center justify-between mb-8">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center">
                                <i class="fas fa-filter"></i>
                            </div>
                            <div>
                                <h2 class="text-lg font-black text-gray-900">招聘漏斗</h2>
                                <p class="text-xs font-black text-gray-400">实时追踪各阶段候选人转化情况</p>
                            </div>
                        </div>
                        <select class="text-xs font-black border-gray-100 rounded-xl focus:ring-blue-500 focus:border-blue-500 bg-gray-50 px-4 py-2">
                            <option>所有职位</option>
                            <option>本周</option>
                            <option>本月</option>
                        </select>
                    </div>
                    <div class="relative h-72 w-full">
                        <canvas id="recruitmentFunnelChart"></canvas>
                    </div>
                </div>

                <!-- 右侧：待办事项 -->
                <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm flex flex-col">
                    <div class="flex items-center justify-between mb-8">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center">
                                <i class="fas fa-clipboard-list"></i>
                            </div>
                            <div>
                                <h2 class="text-lg font-black text-gray-900">待办事项</h2>
                                <p class="text-xs font-black text-gray-400">高效管理您的日常招聘任务</p>
                            </div>
                        </div>
                        <button class="text-xs font-black text-blue-600 hover:text-blue-700" onclick="window.location.href='recruitment-flow.html'">查看全部</button>
                    </div>
                    <div id="pending-tasks-list" class="space-y-3 overflow-y-auto h-72 pr-2 custom-scrollbar">
                        <!-- 动态加载待办事项 -->
                        <div class="animate-pulse space-y-3">
                            <div class="h-12 bg-gray-50 rounded-xl"></div>
                            <div class="h-12 bg-gray-50 rounded-xl"></div>
                            <div class="h-12 bg-gray-50 rounded-xl"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI预测模块 -->
            <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
                <div class="flex items-center justify-between mb-8">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-black text-gray-900">AI预测</h2>
                            <p class="text-xs font-black text-gray-400">基于大数据分析的人才趋势预判</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <select id="ai-prediction-range" class="text-xs font-black border-gray-100 rounded-xl focus:ring-blue-500 focus:border-blue-500 bg-gray-50 px-4 py-2">
                            <option value="7d">未来 7 天</option>
                            <option value="30d">未来 30 天</option>
                        </select>
                        <button id="re-test-ai" class="px-4 py-2 text-xs font-black text-blue-700 bg-blue-50 rounded-xl hover:bg-blue-100 transition-all flex items-center">
                            <i class="fas fa-sync-alt mr-2"></i>重新分析
                        </button>
                    </div>
                </div>
                <div id="ai-prediction-content" class="min-h-[16rem]">
                    <div class="h-full flex items-center justify-center text-gray-400 text-sm font-black italic">正在加载智能分析报告...</div>
                </div>
            </div>

            <!-- 常用功能入口 -->
            <section>
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-sm font-black text-gray-900 flex items-center tracking-widest uppercase">
                        <span class="w-7 h-7 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center mr-2">
                            <i class="fas fa-bolt text-xs"></i>
                        </span>
                        常用功能快捷入口
                    </h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <button onclick="openLibraryUploadModal()" class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm hover:border-blue-300 hover:shadow-lg hover:shadow-blue-50 transition-all group quick-action-card flex items-center">
                        <div class="w-12 h-12 shrink-0 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl group-hover:scale-110 transition-transform mr-4">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <div class="text-left">
                            <span class="text-xs font-black text-gray-900 block leading-tight">导入简历</span>
                            <p class="text-[10px] text-gray-400 font-bold mt-1 leading-tight">支持批量上传 PDF/Word</p>
                        </div>
                    </button>
                    <button onclick="window.location.href='job-posting.html'" class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm hover:border-blue-300 hover:shadow-lg hover:shadow-blue-50 transition-all group quick-action-card flex items-center">
                        <div class="w-12 h-12 shrink-0 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl group-hover:scale-110 transition-transform mr-4">
                            <i class="fas fa-plus-circle"></i>
                        </div>
                        <div class="text-left">
                            <span class="text-xs font-black text-gray-900 block leading-tight">发布职位</span>
                            <p class="text-[10px] text-gray-400 font-bold mt-1 leading-tight">快速创建新的招聘需求</p>
                        </div>
                    </button>
                    <button onclick="window.location.href='comparison.html'" class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm hover:border-blue-300 hover:shadow-lg hover:shadow-blue-50 transition-all group quick-action-card flex items-center">
                        <div class="w-12 h-12 shrink-0 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl group-hover:scale-110 transition-transform mr-4">
                            <i class="fas fa-balance-scale"></i>
                        </div>
                        <div class="text-left">
                            <span class="text-xs font-black text-gray-900 block leading-tight">简历对比</span>
                            <p class="text-[10px] text-gray-400 font-bold mt-1 leading-tight">多维度对比候选人优势</p>
                        </div>
                    </button>
                    <button onclick="window.location.href='librarypool.html'" class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm hover:border-blue-300 hover:shadow-lg hover:shadow-blue-50 transition-all group quick-action-card flex items-center">
                        <div class="w-12 h-12 shrink-0 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl group-hover:scale-110 transition-transform mr-4">
                            <i class="fas fa-database"></i>
                        </div>
                        <div class="text-left">
                            <span class="text-xs font-black text-gray-900 block leading-tight">人才库</span>
                            <p class="text-[10px] text-gray-400 font-bold mt-1 leading-tight">管理您的数智化人才资源</p>
                        </div>
                    </button>
                </div>
            </section>

        </div>
    </main>
    
    <!-- AI 悬浮按钮 -->
    <a href="assistant-chat.html" class="fixed bottom-8 right-8 w-14 h-14 bg-slate-900 rounded-full shadow-lg flex items-center justify-center text-white hover:bg-black transition-all hover:scale-110 z-50 group">
        <i class="fas fa-robot text-2xl"></i>
        <span class="absolute right-full mr-4 bg-gray-900 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">AI 助手</span>
    </a>

    <!-- 注册后三步引导 Modal -->
    <div id="onboarding-modal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500/75 transition-opacity" aria-hidden="true" id="onboarding-backdrop"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-3xl sm:w-full border border-gray-100">
                <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-flag-checkered text-blue-600"></i>
                        <h3 class="text-lg font-black text-gray-900">首次使用引导</h3>
                    </div>
                    <button id="onboarding-close" class="p-2 rounded-xl hover:bg-gray-50 transition-all">
                        <i class="fas fa-times text-gray-500"></i>
                    </button>
                </div>
                <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50">
                    <div class="grid grid-cols-3 gap-3">
                        <div id="step-ind-1" class="flex items-center p-3 rounded-xl border border-blue-200 bg-blue-50 transition-all">
                            <div class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs mr-2 font-black">1</div>
                            <div class="text-sm font-black text-blue-800">设置密码</div>
                        </div>
                        <div id="step-ind-2" class="flex items-center p-3 rounded-xl border border-gray-200 bg-white transition-all">
                            <div class="w-6 h-6 rounded-full bg-gray-400 text-white flex items-center justify-center text-xs mr-2 font-black">2</div>
                            <div class="text-sm font-black text-gray-800">个人信息</div>
                        </div>
                        <div id="step-ind-3" class="flex items-center p-3 rounded-xl border border-gray-200 bg-white transition-all">
                            <div class="w-6 h-6 rounded-full bg-gray-400 text-white flex items-center justify-center text-xs mr-2 font-black">3</div>
                            <div class="text-sm font-black text-gray-800">企业信息</div>
                        </div>
                    </div>
                </div>
                <div class="px-8 py-8">
                    <!-- Step 1: 设置密码 -->
                    <div id="onb-step-1" class="space-y-6">
                        <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl flex items-start space-x-3">
                            <i class="fas fa-info-circle text-blue-500 mt-0.5"></i>
                            <p class="text-sm text-blue-800 leading-relaxed font-black">为了您的账户安全，建议设置登录密码，后续可直接使用手机号与密码登录系统。</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="block text-sm font-black text-gray-700">新密码</label>
                                <input id="onb-password" type="password" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="请输入至少6位密码" minlength="6">
                            </div>
                            <div class="space-y-2">
                                <label class="block text-sm font-black text-gray-700">确认密码</label>
                                <input id="onb-password-confirm" type="password" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="请再次输入密码" minlength="6">
                            </div>
                        </div>
                        <div class="flex justify-end space-x-3 pt-4">
                            <button id="onb-skip-1" class="px-6 py-2.5 text-sm font-black text-gray-500 hover:text-gray-700 transition-all">跳过此步</button>
                            <button id="onb-next-1" class="px-8 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-black hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all">下一步</button>
                        </div>
                    </div>

                    <!-- Step 2: 个人信息 -->
                    <div id="onb-step-2" class="space-y-8 hidden">
                        <div class="flex flex-col md:flex-row gap-8 items-start">
                            <!-- Avatar Section -->
                            <div class="flex-shrink-0 mx-auto md:mx-0">
                                <label class="block text-sm font-black text-gray-700 mb-4 text-center md:text-left">个人头像</label>
                                <div class="relative group cursor-pointer" onclick="document.getElementById('onb-avatar').click()">
                                    <div class="w-32 h-32 rounded-full bg-gray-50 border-2 border-dashed border-gray-200 flex items-center justify-center overflow-hidden hover:border-blue-500 transition-all">
                                        <img id="onb-avatar-preview" class="w-full h-full object-cover hidden" />
                                        <i id="onb-avatar-icon" class="fas fa-user text-4xl text-gray-300 group-hover:text-blue-500 transition-all"></i>
                                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all">
                                            <span class="text-white text-xs font-black">更换头像</span>
                                        </div>
                                    </div>
                                    <input id="onb-avatar" type="file" accept="image/*" class="hidden" />
                                </div>
                                <div class="mt-4 flex flex-col items-center space-y-2">
                                    <button type="button" id="avatar-crop-open" class="text-xs font-black text-blue-600 hover:text-blue-700">裁剪图片</button>
                                </div>
                            </div>

                            <!-- Form Fields -->
                            <div class="flex-grow space-y-6 w-full">
                                <div class="space-y-2">
                                    <label class="block text-sm font-black text-gray-700">显示ID <span class="text-gray-400 font-normal">（系统分配，不可修改）</span></label>
                                    <input id="onb-user-id" type="text" class="w-full px-4 py-3 border border-gray-100 rounded-xl bg-gray-50 text-gray-500 cursor-not-allowed outline-none font-black" readonly>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="space-y-2">
                                        <label class="block text-sm font-black text-gray-700">用户名</label>
                                        <input id="onb-username" type="text" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="设置您的昵称">
                                    </div>
                                    <div class="space-y-2">
                                        <label class="block text-sm font-black text-gray-700">手机号</label>
                                        <input id="onb-phone" type="tel" maxlength="11" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="用于接收重要通知">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-end space-x-3 pt-6 border-t border-gray-100">
                            <button id="onb-skip-2" class="px-6 py-2.5 text-sm font-black text-gray-500 hover:text-gray-700 transition-all">稍后完善</button>
                            <button id="onb-next-2" class="px-8 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-black hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all">下一步</button>
                        </div>
                    </div>

                    <!-- Step 3: 企业信息 -->
                    <div id="onb-step-3" class="space-y-8 hidden">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="block text-sm font-black text-gray-700">企业名称 <span class="text-red-500">*</span></label>
                                <input id="onb-company-name" type="text" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="请输入完整的公司名称">
                            </div>
                            <div class="space-y-2">
                                <label class="block text-sm font-black text-gray-700">联系人姓名 <span class="text-red-500">*</span></label>
                                <input id="onb-contact-name" type="text" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="请输入联系人姓名">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="block text-sm font-black text-gray-700">业务联系电话 <span class="text-red-500">*</span></label>
                                <input id="onb-contact-phone" type="tel" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="请输入联系电话">
                            </div>
                            <div class="space-y-2">
                                <label class="block text-sm font-black text-gray-700">办公地址</label>
                                <input id="onb-address" type="text" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="请输入公司办公地址">
                            </div>
                        </div>
                        <div class="flex justify-end space-x-3 pt-6 border-t border-gray-100">
                            <button id="onb-skip-3" class="px-6 py-2.5 text-sm font-black text-gray-500 hover:text-gray-700 transition-all">稍后再说</button>
                            <button id="onb-finish" class="px-8 py-2.5 bg-green-600 text-white rounded-xl text-sm font-black hover:bg-green-700 shadow-lg shadow-green-100 transition-all">开启智能招聘</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 头像裁剪 Modal -->
    <div id="avatar-crop-modal" class="fixed inset-0 z-[60] hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500/75 transition-opacity" aria-hidden="true" id="avatar-crop-backdrop" onclick="dashboardController.closeCropModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-xl sm:w-full border border-gray-100">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <div class="text-lg font-black text-gray-900">裁剪头像</div>
                    <button id="avatar-crop-cancel" class="p-2 rounded-xl hover:bg-gray-50 transition-all" onclick="dashboardController.closeCropModal()">
                        <i class="fas fa-times text-gray-500"></i>
                    </button>
                </div>
                <div class="p-8 space-y-6">
                    <div class="w-full aspect-square bg-gray-50 rounded-2xl border border-gray-100 flex items-center justify-center overflow-hidden">
                        <canvas id="avatar-crop-canvas" width="400" height="400" class="max-w-full max-h-full"></canvas>
                    </div>
                    <div class="space-y-4">
                        <div class="flex items-center space-x-4">
                            <i class="fas fa-search-minus text-gray-400"></i>
                            <input id="avatar-crop-zoom" type="range" min="1" max="3" step="0.01" class="flex-grow h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                            <i class="fas fa-search-plus text-gray-400"></i>
                        </div>
                        <div class="flex justify-end space-x-3 pt-2">
                            <button id="avatar-crop-cancel-btn" class="px-6 py-2.5 text-sm font-black text-gray-500 hover:text-gray-700 transition-all" onclick="dashboardController.closeCropModal()">取消</button>
                            <button id="avatar-crop-apply" class="px-8 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-black hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all">确定裁剪</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/user-auth.js"></script>
    <script src="../js/header-profile.js"></script>
  <script src="/js/sidebar.js"></script>
    <script src="../js/resume-data.js"></script>
    <script src="../js/resume-upload-handler.js"></script>
    <script src="../js/resume-upload-modal.js"></script>
    <script src="../js/dashboard.js"></script>
        <script>
            // Initialize Sidebar
            document.addEventListener('DOMContentLoaded', () => {
                if (typeof Sidebar !== 'undefined' && Sidebar.init) {
                    Sidebar.init({
                        active: 'dashboard'
                    });
                }
                if (typeof HeaderProfile !== 'undefined' && HeaderProfile.init) {
                    HeaderProfile.init('#header-right-section');
                }

                // 模拟 AI 重新分析
                const reTestBtn = document.getElementById('re-test-ai');
                if (reTestBtn) {
                    reTestBtn.addEventListener('click', () => {
                        ui.showLoading('正在重新分析 AI 预测...');
                        setTimeout(() => {
                            ui.hideLoading();
                            ui.showNotification('AI 预测模型已更新', 'success');
                        }, 1500);
                    });
                }
            });
        </script>
</body>
</html>
