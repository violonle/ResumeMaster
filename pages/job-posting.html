<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布职位 - 争湃·简历大师</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="../js/tailwindcss.js"></script>
    <script src="../js/ui-components.js"></script>
    <script src="../js/resume-data.js"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        .form-section {
            transition: all 0.3s ease;
        }
        
        .form-section:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        .btn-primary {
            background-color: #2563eb;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        
        .form-input {
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .benefit-item {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
        }
        
        .preview-mode {
            background: #fef3c7;
            border: 2px solid #f59e0b;
        }
        
        .section-divider {
            background: #e5e7eb;
            height: 1px;
            margin: 2rem 0;
        }
        
        .form-input, select, textarea { max-width: 100%; min-width: 0; }
    </style>
</head>
<body class="font-sans bg-gray-50 min-h-screen overflow-x-hidden">
    <!-- 侧边栏 -->
    <aside id="sidebar" class="sidebar-modern"></aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- 顶部导航栏 -->
    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20">
        <div class="flex items-center justify-between p-4">
            <div class="flex items-center space-x-4">
                <button class="menu-button p-2 rounded-lg hover:bg-gray-100" id="sidebar-toggle">
                    <i class="fas fa-bars text-gray-900"></i>
                </button>
                <h1 class="brand-title text-lg font-bold text-gray-900">发布职位</h1>
            </div>
            <div class="flex items-center space-x-4" id="header-right-section"></div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content pt-20 p-6 transition-all duration-300" id="main-content">
            <!-- 页面标题 -->
            <div class="flex items-center justify-between mb-8 fade-in-up">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">发布职位</h1>
                    <p class="text-lg text-gray-600">创建新的职位招聘信息，吸引优秀人才加入</p>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="px-4 py-2 bg-white text-blue-600 border border-blue-600 rounded-lg hover:bg-blue-50 transition-colors" id="import-btn">
                        <i class="fas fa-cloud-download-alt mr-2"></i>一键导入
                    </button>
                    <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors" id="preview-btn">
                        <i class="fas fa-eye mr-2"></i>预览
                    </button>
                    <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors" id="save-draft-btn">
                        <i class="fas fa-save mr-2"></i>保存草稿
                    </button>
                </div>
            </div>

            <form id="job-posting-form" class="space-y-8">
                <!-- 基本信息 -->
                <div class="form-section bg-white rounded-2xl shadow-lg p-6 fade-in-up">
                    <div class="flex items-center mb-6">
                        <div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center">
                            <i class="fas fa-info-circle text-blue-600"></i>
                        </div>
                        <h2 class="text-xl font-semibold text-gray-900 ml-3">基本信息</h2>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">职位名称 *</label>
                            <input type="text" id="job-title" class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="例：高级前端开发工程师" required>
                        </div>
                        
                        
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">工作地点 *</label>
                            <input type="text" id="job-location" class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="例：北京市朝阳区" required>
                        </div>
                        
                        
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">薪资范围 *</label>
                            <div class="flex flex-col sm:flex-row sm:items-center sm:space-x-2 space-y-2 sm:space-y-0">
                                <input type="number" id="salary-min" class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="最低薪资" required>
                                <span class="text-gray-500">-</span>
                                <input type="number" id="salary-max" class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="最高薪资" required>
                                <select id="salary-unit" class="form-input px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                    <option value="month">月</option>
                                    <option value="year">年</option>
                                </select>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">经验要求 *</label>
                            <select id="experience" class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                                <option value="">请选择经验要求</option>
                                <option value="0-1">0-1年</option>
                                <option value="1-3">1-3年</option>
                                <option value="3-5">3-5年</option>
                                <option value="5-10">5-10年</option>
                                <option value="10+">10年以上</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">学历要求</label>
                            <select id="education" class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option value="">不限</option>
                                <option value="high-school">高中</option>
                                <option value="college">大专</option>
                                <option value="bachelor">本科</option>
                                <option value="master">硕士</option>
                                <option value="phd">博士</option>
                            </select>
                        </div>
                        
                        
                    </div>
                </div>

                <!-- 职位描述 -->
                <div class="form-section bg-white rounded-2xl shadow-lg p-6 fade-in-up">
                    <div class="flex items-center mb-6">
                        <div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center">
                            <i class="fas fa-file-alt text-blue-600"></i>
                        </div>
                        <h2 class="text-xl font-semibold text-gray-900 ml-3">职位描述</h2>
                    </div>
                    
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">职位描述 *</label>
                            <textarea id="job-description" rows="10" class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请填写岗位职责与任职要求等完整描述" required></textarea>
                        </div>
                    </div>
                </div>

                <!-- 福利待遇 -->
                <div class="form-section bg-white rounded-2xl shadow-lg p-6 fade-in-up">
                    <div class="flex items-center mb-6">
                        <div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center">
                            <i class="fas fa-gift text-blue-600"></i>
                        </div>
                        <h2 class="text-xl font-semibold text-gray-900 ml-3">福利待遇</h2>
                    </div>
                    
                    <div class="space-y-6">
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input type="checkbox" name="benefits" value="five-insurance-fund" class="rounded text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">五险一金</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input type="checkbox" name="benefits" value="commercial-insurance" class="rounded text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">商业保险</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input type="checkbox" name="benefits" value="annual-bonus" class="rounded text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">年终奖</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input type="checkbox" name="benefits" value="flexible-work" class="rounded text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">弹性工作</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input type="checkbox" name="benefits" value="remote-work" class="rounded text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">远程办公</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input type="checkbox" name="benefits" value="paid-leave" class="rounded text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">带薪年假</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input type="checkbox" name="benefits" value="training" class="rounded text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">培训机会</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input type="checkbox" name="benefits" value="career-development" class="rounded text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">职业发展</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input type="checkbox" name="benefits" value="free-meals" class="rounded text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">免费餐食</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input type="checkbox" name="benefits" value="gym" class="rounded text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">健身房</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input type="checkbox" name="benefits" value="team-building" class="rounded text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">团建活动</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input type="checkbox" name="benefits" value="stock-options" class="rounded text-blue-600 focus:ring-blue-500">
                                <span class="text-sm">股票期权</span>
                            </label>
                        </div>
                        
                        
                    </div>
                </div>

                <!-- 发布设置 -->
                <div class="form-section bg-white rounded-2xl shadow-lg p-6 fade-in-up">
                    <div class="flex items-center mb-6">
                        <div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center">
                            <i class="fas fa-cog text-blue-600"></i>
                        </div>
                        <h2 class="text-xl font-semibold text-gray-900 ml-3">发布设置</h2>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">有效期</label>
                            <select id="validity-period" class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option value="30">30天</option>
                                <option value="60">60天</option>
                                <option value="90" selected>90天</option>
                                <option value="180">180天</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">发布到</label>
                            <div class="space-y-2">
                                <label class="flex items-center space-x-3">
                                    <input type="checkbox" name="publish-to" value="internal" class="rounded text-blue-600 focus:ring-blue-500" checked>
                                    <span class="text-sm">内部招聘平台</span>
                                </label>
                                <label class="flex items-center space-x-3">
                                    <input type="checkbox" name="publish-to" value="external" class="rounded text-blue-600 focus:ring-blue-500">
                                    <span class="text-sm">外部招聘网站</span>
                                </label>
                            </div>
                        </div>
                        
                        <div class="lg:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">联系方式</label>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <input type="text" id="contact-name" class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="联系人姓名">
                                <input type="email" id="contact-email" class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="联系邮箱">
                                <input type="tel" id="contact-phone" class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="联系电话">
                                <input type="text" id="contact-wechat" class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="微信号">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 提交按钮 -->
                <div class="flex items-center justify-center space-x-4 pt-6">
                    <button type="button" class="px-8 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors" id="cancel-btn">
                        取消
                    </button>
                    <button type="button" class="px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors" id="save-draft-final-btn">
                        <i class="fas fa-save mr-2"></i>保存草稿
                    </button>
                    <button type="submit" class="btn-primary px-8 py-3 text-white rounded-lg font-semibold">
                        <i class="fas fa-paper-plane mr-2"></i>立即发布
                    </button>
                </div>
            </form>
    </div>
    
    <!-- 预览模态框 -->
    <div id="preview-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between p-6 border-b border-gray-200">
                <h2 class="text-2xl font-bold text-gray-900">职位预览</h2>
                <button class="text-gray-400 hover:text-gray-600" id="close-preview-btn">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6" id="preview-content">
                <!-- 预览内容将在这里显示 -->
            </div>
        </div>
    </div>

    <script>
        // 页面初始化
        document.addEventListener('DOMContentLoaded', () => {
            initJobPostingForm();
            
            initPreviewFunctionality();
            initFormValidation();
        });

        // 初始化职位发布表单
        function initJobPostingForm() {
            const form = document.getElementById('job-posting-form');
            
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                handleFormSubmit();
            });
        }

        // 初始化侧边栏功能
        

        // 初始化预览功能
        function initPreviewFunctionality() {
            const previewBtn = document.getElementById('preview-btn');
            const previewModal = document.getElementById('preview-modal');
            const closePreviewBtn = document.getElementById('close-preview-btn');

            previewBtn.addEventListener('click', showPreview);
            closePreviewBtn.addEventListener('click', hidePreview);

            // 点击模态框背景关闭
            previewModal.addEventListener('click', (e) => {
                if (e.target === previewModal) {
                    hidePreview();
                }
            });
        }

        // 显示预览
        function showPreview() {
            const formData = collectFormData();
            const previewContent = document.getElementById('preview-content');
            
            previewContent.innerHTML = generatePreviewHTML(formData);
            document.getElementById('preview-modal').classList.remove('hidden');
            document.getElementById('preview-modal').classList.add('flex');
        }

        // 隐藏预览
        function hidePreview() {
            document.getElementById('preview-modal').classList.add('hidden');
            document.getElementById('preview-modal').classList.remove('flex');
        }

        // 收集表单数据
        function collectFormData() {
            return {
                title: document.getElementById('job-title').value,
                location: document.getElementById('job-location').value,
                salaryMin: document.getElementById('salary-min').value,
                salaryMax: document.getElementById('salary-max').value,
                salaryUnit: document.getElementById('salary-unit').value,
                experience: document.getElementById('experience').value,
                education: document.getElementById('education').value,
                description: document.getElementById('job-description').value,
                benefits: Array.from(document.querySelectorAll('input[name="benefits"]:checked')).map(cb => cb.nextElementSibling.textContent)
            };
        }

        // 生成预览HTML
        function generatePreviewHTML(data) {
            return `
                <div class="space-y-6">
                    <div class="border-b border-gray-200 pb-6">
                        <h1 class="text-3xl font-bold text-gray-900 mb-4">${data.title || '职位名称'}</h1>
                        <div class="flex flex-wrap gap-4 text-sm text-gray-600">
                            <span><i class="fas fa-map-marker-alt mr-1"></i>${data.location || '工作地点'}</span>
                            <span><i class="fas fa-dollar-sign mr-1"></i>${data.salaryMin || '0'}-${data.salaryMax || '0'}K/${data.salaryUnit === 'year' ? '年' : '月'}</span>
                            <span><i class="fas fa-user-tie mr-1"></i>${data.experience || '经验要求'}</span>
                        </div>
                    </div>
                    
                    <div>
                        <h3 class="text-lg font-semibold text-gray-900 mb-3">职位描述</h3>
                        <div class="text-gray-700 whitespace-pre-line">${data.description || '暂无描述'}</div>
                    </div>
                    
                    ${data.benefits.length > 0 ? `
                    <div>
                        <h3 class="text-lg font-semibold text-gray-900 mb-3">福利待遇</h3>
                        <div class="flex flex-wrap gap-2">
                            ${data.benefits.map(benefit => `<span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">${benefit}</span>`).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
        }

        // 初始化表单验证
        function initFormValidation() {
            const requiredFields = document.querySelectorAll('input[required], textarea[required], select[required]');
            
            requiredFields.forEach(field => {
                field.addEventListener('blur', validateField);
                field.addEventListener('input', clearFieldError);
            });
        }

        // 验证字段
        function validateField(e) {
            const field = e.target;
            if (!field.value.trim()) {
                showFieldError(field, '此字段为必填项');
            } else {
                clearFieldError(field);
            }
        }

        // 显示字段错误
        function showFieldError(field, message) {
            clearFieldError(field);
            field.classList.add('border-red-500');
            
            const errorDiv = document.createElement('div');
            errorDiv.className = 'text-red-500 text-sm mt-1 field-error';
            errorDiv.textContent = message;
            field.parentNode.appendChild(errorDiv);
        }

        // 清除字段错误
        function clearFieldError(field) {
            if (typeof field === 'object' && field.target) {
                field = field.target;
            }
            field.classList.remove('border-red-500');
            const errorDiv = field.parentNode.querySelector('.field-error');
            if (errorDiv) {
                errorDiv.remove();
            }
        }

        // 处理表单提交
        async function handleFormSubmit() {
            if (validateForm()) {
                const formData = collectFormData();
                
                // Map frontend data to backend API format
                const jobData = {
                    title: formData.title,
                    location: formData.location,
                    salary_range: `${formData.salaryMin}-${formData.salaryMax}K/${formData.salaryUnit === 'year' ? '年' : '月'}`,
                    experience_required: formData.experience,
                    education_required: formData.education,
                    description: formData.description,
                    // Combine benefits into description or separate field if backend supports
                    requirements: `【福利待遇】\n${formData.benefits.join('、')}`, 
                    status: 'active'
                };

                try {
                    await window.resumeDataManager.createJob(jobData);
                    ui.showNotification('职位发布成功！', 'success');
                    setTimeout(() => {
                        window.location.href = 'job-management.html';
                    }, 1500);
                } catch (error) {
                    console.error('发布职位失败:', error);
                    ui.showNotification(error.message || '发布失败，请重试', 'error');
                }
            }
        }

        // 验证表单
        function validateForm() {
            const requiredFields = document.querySelectorAll('input[required], textarea[required], select[required]');
            let isValid = true;
            
            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    showFieldError(field, '此字段为必填项');
                    isValid = false;
                }
            });
            
            return isValid;
        }

    <script>
        // 一键导入功能逻辑
        (function() {
            const importBtn = document.getElementById('import-btn');
            const modal = document.getElementById('import-job-modal');
            const cancelBtn = document.getElementById('cancel-import-btn');
            const confirmBtn = document.getElementById('confirm-import-btn');
            const urlInput = document.getElementById('import-url');
            const urlError = document.getElementById('import-url-error');
            const loading = document.getElementById('import-loading');
            const preview = document.getElementById('import-preview');
            
            let parsedData = null;

            if (importBtn) {
                importBtn.addEventListener('click', () => {
                    openImportModal();
                });
            }

            // 打开模态框函数
            function openImportModal(url = '') {
                modal.classList.remove('hidden');
                urlInput.value = url;
                urlError.classList.add('hidden');
                preview.classList.add('hidden');
                loading.classList.add('hidden');
                parsedData = null;
                confirmBtn.textContent = '开始解析';
            }

            // 检查 URL 参数是否有自动导入任务
            const urlParams = new URLSearchParams(window.location.search);
            const autoImportUrl = urlParams.get('importUrl');
            if (autoImportUrl) {
                const decodedUrl = decodeURIComponent(autoImportUrl);
                openImportModal(decodedUrl);
                handleParse();
                // 清除 URL 参数
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            if (cancelBtn) {
                cancelBtn.addEventListener('click', () => {
                    modal.classList.add('hidden');
                });
            }
            
            // 点击遮罩关闭
            const backdrop = document.getElementById('import-modal-backdrop');
            if(backdrop) {
                backdrop.addEventListener('click', () => {
                    modal.classList.add('hidden');
                });
            }

            if (confirmBtn) {
                confirmBtn.addEventListener('click', async () => {
                    if (!parsedData) {
                        // 执行解析
                        await handleParse();
                    } else {
                        // 执行填充
                        fillForm(parsedData);
                        modal.classList.add('hidden');
                        ui.showNotification('职位信息填充成功', 'success');
                    }
                });
            }

            async function handleParse() {
                const url = urlInput.value.trim();
                if (!url) {
                    showError('请输入有效的职位链接');
                    return;
                }
                
                try {
                    new URL(url); // 验证 URL 格式
                } catch (e) {
                    showError('URL 格式不正确');
                    return;
                }

                showError(null);
                loading.classList.remove('hidden');
                preview.classList.add('hidden');
                confirmBtn.disabled = true;

                try {
                    const token = JSON.parse(localStorage.getItem('userInfo') || '{}').token;
                    const headers = {
                        'Content-Type': 'application/json'
                    };
                    if (token) {
                        headers['Authorization'] = `Bearer ${token}`;
                    }

                    const response = await fetch('/api/jobs/import-url', {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({ url })
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error?.message || result.message || '解析失败');
                    }

                    parsedData = result.data;
                    showPreview(parsedData);
                    confirmBtn.textContent = '确认填充';
                } catch (error) {
                    showError(error.message);
                } finally {
                    loading.classList.add('hidden');
                    confirmBtn.disabled = false;
                }
            }

            function showError(msg) {
                if (msg) {
                    urlError.textContent = msg;
                    urlError.classList.remove('hidden');
                    urlInput.classList.add('border-red-500');
                } else {
                    urlError.classList.add('hidden');
                    urlInput.classList.remove('border-red-500');
                }
            }

            function showPreview(data) {
                document.getElementById('preview-title').textContent = data.title || '未识别';
                document.getElementById('preview-salary').textContent = data.salary || '面议';
                document.getElementById('preview-location').textContent = data.location || '未识别';
                document.getElementById('preview-exp').textContent = data.experience || '不限';
                preview.classList.remove('hidden');
            }

            function fillForm(data) {
                if (data.title) document.getElementById('job-title').value = data.title;
                if (data.location) document.getElementById('job-location').value = data.location;
                const desc = [data.description || '', data.requirements || ''].filter(Boolean).join('\n\n');
                if (desc) document.getElementById('job-description').value = desc;
                
                // 简单的薪资解析填充
                if (data.salary) {
                    const match = data.salary.match(/(\d+).*?-.*?(\d+)/);
                    if (match) {
                        document.getElementById('salary-min').value = match[1];
                        document.getElementById('salary-max').value = match[2];
                    }
                }
                
                // 经验匹配
                if (data.experience) {
                    const expSelect = document.getElementById('experience');
                    const expText = data.experience.replace('经验', '').replace('以内', '');
                    for (let i = 0; i < expSelect.options.length; i++) {
                        // 模糊匹配: "1-3" matches "1-3年"
                        if (expSelect.options[i].text.includes(expText) || expText.includes(expSelect.options[i].value)) {
                            expSelect.selectedIndex = i;
                            break;
                        }
                    }
                }

                // 学历匹配
                if (data.education) {
                    const eduSelect = document.getElementById('education');
                    const eduMap = {
                        '高中': 'high-school',
                        '中专': 'high-school', // Map closely
                        '大专': 'college',
                        '本科': 'bachelor',
                        '硕士': 'master',
                        '研究生': 'master',
                        '博士': 'phd'
                    };
                    // Find partial match
                    for (const [key, value] of Object.entries(eduMap)) {
                        if (data.education.includes(key)) {
                            eduSelect.value = value;
                            break;
                        }
                    }
                }

                // 福利待遇匹配 (从描述中提取或后端返回)
                if (data.description) {
                    const benefitsMap = {
                        '五险一金': 'five-insurance-fund',
                        '商业保险': 'commercial-insurance',
                        '年终奖': 'annual-bonus',
                        '弹性工作': 'flexible-work',
                        '远程': 'remote-work',
                        '带薪年假': 'paid-leave',
                        '培训': 'training',
                        '晋升': 'career-development',
                        '餐补': 'free-meals',
                        '包吃': 'free-meals',
                        '健身': 'gym',
                        '团建': 'team-building',
                        '股票': 'stock-options',
                        '期权': 'stock-options'
                    };
                    
                    const checkboxes = document.querySelectorAll('input[name="benefits"]');
                    // Reset first
                    checkboxes.forEach(cb => cb.checked = false);
                    
                    for (const [key, value] of Object.entries(benefitsMap)) {
                        if (data.description.includes(key)) {
                            const cb = document.querySelector(`input[name="benefits"][value="${value}"]`);
                            if (cb) cb.checked = true;
                        }
                    }
                }
            }
        })();
    </script>
