<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布职位 - 争湃·简历大师</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="../js/tailwindcss.js"></script>
    <script src="../js/ui-components.js"></script>
    <script src="../js/resume-data.js"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    },
                    fontFamily: {
                        'sans': ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --font-family-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
        body {
            font-family: var(--font-family-sans);
        }
        .portal-card {
            background-color: white;
            border: 1px solid #f3f4f6;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .portal-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            transform: translateY(-2px);
        }
        
        .form-input {
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }
        
        .form-input:focus {
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05);
            border-color: #0f172a;
        }

        .section-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #eff6ff;
            color: #2563eb;
        }
        
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-50 antialiased text-gray-900 selection:bg-blue-100 selection:text-blue-700 min-h-screen overflow-x-hidden">
    <!-- 侧边栏 -->
    <aside id="sidebar" class="sidebar-modern"></aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20 h-20">
        <div class="flex items-center justify-between px-6 h-full max-w-[1440px] mx-auto w-full">
            <div class="flex items-center space-x-4 pl-8">
                <div class="brand-title flex flex-col justify-center space-y-1.5">
                    <h1 class="text-lg font-bold text-gray-900 leading-none">发布职位</h1>
                    <p class="text-xs text-gray-500 font-medium leading-tight">创建新的职位招聘信息，吸引优秀人才加入</p>
                </div>
            </div>
            <div class="flex items-center space-x-4" id="header-right-section"></div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content pt-20 p-6 transition-all duration-300" id="main-content">
        <div class="max-w-[1440px] mx-auto">
            <!-- 页面标题 -->
            <div class="flex items-center justify-between mb-8 fade-in-up">
                <div></div>
                <div class="flex items-center space-x-4">
                    <button class="px-6 py-3 bg-white border border-gray-900 text-gray-900 rounded-xl text-sm font-black shadow-sm hover:bg-gray-50 transition-all flex items-center" id="import-btn">
                        <i class="fas fa-cloud-download-alt mr-2"></i>一键导入
                    </button>
                    <button class="px-6 py-3 bg-slate-900 text-white rounded-xl text-sm font-black shadow-lg shadow-gray-200 hover:bg-black transition-all flex items-center" id="preview-btn">
                        <i class="fas fa-eye mr-2"></i>预览
                    </button>
                    <button class="px-6 py-3 bg-slate-900 text-white rounded-xl text-sm font-black shadow-lg shadow-gray-200 hover:bg-black transition-all flex items-center" id="save-draft-btn">
                        <i class="fas fa-save mr-2"></i>保存草稿
                    </button>
                </div>
            </div>

            <form id="job-posting-form" class="space-y-8">
                <!-- 基本信息 -->
                <div class="portal-card p-8 fade-in-up">
                    <div class="flex items-center mb-8">
                        <div class="section-icon">
                            <i class="fas fa-info-circle text-lg"></i>
                        </div>
                        <div class="ml-4">
                            <h2 class="text-lg font-bold text-gray-900">基本信息</h2>
                            <p class="text-xs text-gray-500">填写职位的核心基础信息</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2">
                            <label class="block text-xs font-black text-gray-500 uppercase tracking-wider mb-2">职位名称 <span class="text-red-500">*</span></label>
                            <input type="text" id="job-title" class="form-input w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:bg-white focus:ring-2" placeholder="例：高级前端开发工程师" required>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-black text-gray-500 uppercase tracking-wider mb-2">工作地点 <span class="text-red-500">*</span></label>
                            <input type="text" id="job-location" class="form-input w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:bg-white focus:ring-2" placeholder="例：北京市朝阳区" required>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-black text-gray-500 uppercase tracking-wider mb-2">薪资范围 <span class="text-red-500">*</span></label>
                            <div class="flex items-center space-x-2">
                                <input type="number" id="salary-min" class="form-input w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:bg-white focus:ring-2" placeholder="最低" required>
                                <span class="text-gray-400 font-bold">-</span>
                                <input type="number" id="salary-max" class="form-input w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:bg-white focus:ring-2" placeholder="最高" required>
                                <select id="salary-unit" class="form-input px-3 py-3 bg-gray-50 border-none rounded-xl focus:bg-white focus:ring-2">
                                    <option value="month">月</option>
                                    <option value="year">年</option>
                                </select>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-black text-gray-500 uppercase tracking-wider mb-2">经验要求 <span class="text-red-500">*</span></label>
                            <select id="experience" class="form-input w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:bg-white focus:ring-2" required>
                                <option value="">请选择</option>
                                <option value="0-1">0-1年</option>
                                <option value="1-3">1-3年</option>
                                <option value="3-5">3-5年</option>
                                <option value="5-10">5-10年</option>
                                <option value="10+">10年以上</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-black text-gray-500 uppercase tracking-wider mb-2">学历要求</label>
                            <select id="education" class="form-input w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:bg-white focus:ring-2">
                                <option value="">不限</option>
                                <option value="high-school">高中</option>
                                <option value="college">大专</option>
                                <option value="bachelor">本科</option>
                                <option value="master">硕士</option>
                                <option value="phd">博士</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 职位描述 -->
                <div class="portal-card p-8 fade-in-up">
                    <div class="flex items-center mb-8">
                        <div class="section-icon bg-blue-50 text-blue-600">
                            <i class="fas fa-file-alt text-lg"></i>
                        </div>
                        <div class="ml-4">
                            <h2 class="text-lg font-bold text-gray-900">职位描述</h2>
                            <p class="text-xs text-gray-500">详细描述岗位的职责与任职要求</p>
                        </div>
                    </div>
                    
                    <div class="space-y-8">
                        <div>
                            <label class="block text-xs font-black text-gray-500 uppercase tracking-wider mb-3">岗位职责 <span class="text-red-500">*</span></label>
                            <textarea id="job-description" rows="8" class="form-input w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:bg-white focus:ring-2 resize-none" placeholder="请填写岗位的主要工作职责..." required></textarea>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-black text-gray-500 uppercase tracking-wider mb-3">任职要求 <span class="text-red-500">*</span></label>
                            <textarea id="job-requirements" rows="8" class="form-input w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:bg-white focus:ring-2 resize-none" placeholder="请填写学历、经验、技能等硬性要求..." required></textarea>
                        </div>
                    </div>
                </div>

                <!-- 福利待遇 -->
                <div class="portal-card p-8 fade-in-up">
                    <div class="flex items-center mb-8">
                        <div class="section-icon bg-blue-50 text-blue-600">
                            <i class="fas fa-gift text-lg"></i>
                        </div>
                        <div class="ml-4">
                            <h2 class="text-lg font-bold text-gray-900">福利待遇</h2>
                            <p class="text-xs text-gray-500">勾选职位提供的各种福利保障</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4">
                        <label class="group flex items-center space-x-3 p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-slate-900 transition-all">
                            <input type="checkbox" name="benefits" value="five-insurance-fund" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-white">五险一金</span>
                        </label>
                        <label class="group flex items-center space-x-3 p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-slate-900 transition-all">
                            <input type="checkbox" name="benefits" value="commercial-insurance" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-white">商业保险</span>
                        </label>
                        <label class="group flex items-center space-x-3 p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-slate-900 transition-all">
                            <input type="checkbox" name="benefits" value="annual-bonus" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-white">年终奖</span>
                        </label>
                        <label class="group flex items-center space-x-3 p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-slate-900 transition-all">
                            <input type="checkbox" name="benefits" value="flexible-work" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-white">弹性工作</span>
                        </label>
                        <label class="group flex items-center space-x-3 p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-slate-900 transition-all">
                            <input type="checkbox" name="benefits" value="remote-work" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-white">远程办公</span>
                        </label>
                        <label class="group flex items-center space-x-3 p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-slate-900 transition-all">
                            <input type="checkbox" name="benefits" value="paid-leave" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-white">带薪年假</span>
                        </label>
                        <label class="group flex items-center space-x-3 p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-slate-900 transition-all">
                            <input type="checkbox" name="benefits" value="training" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-white">培训机会</span>
                        </label>
                        <label class="group flex items-center space-x-3 p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-slate-900 transition-all">
                            <input type="checkbox" name="benefits" value="career-development" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-white">职业发展</span>
                        </label>
                        <label class="group flex items-center space-x-3 p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-slate-900 transition-all">
                            <input type="checkbox" name="benefits" value="free-meals" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-white">免费餐食</span>
                        </label>
                        <label class="group flex items-center space-x-3 p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-slate-900 transition-all">
                            <input type="checkbox" name="benefits" value="gym" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-white">健身房</span>
                        </label>
                        <label class="group flex items-center space-x-3 p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-slate-900 transition-all">
                            <input type="checkbox" name="benefits" value="team-building" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-white">团建活动</span>
                        </label>
                        <label class="group flex items-center space-x-3 p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-slate-900 transition-all">
                            <input type="checkbox" name="benefits" value="stock-options" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                            <span class="text-sm font-medium text-gray-600 group-hover:text-white">股票期权</span>
                        </label>
                    </div>
                </div>

                <!-- 发布设置 -->
                <div class="portal-card p-8 fade-in-up">
                    <div class="flex items-center mb-8">
                        <div class="section-icon bg-blue-50 text-blue-600">
                            <i class="fas fa-cog text-lg"></i>
                        </div>
                        <div class="ml-4">
                            <h2 class="text-lg font-bold text-gray-900">发布设置</h2>
                            <p class="text-xs text-gray-500">配置职位的显示与联系方式</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
                        <div>
                            <label class="block text-xs font-black text-gray-500 uppercase tracking-wider mb-2">有效期</label>
                            <select id="validity-period" class="form-input w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:bg-white focus:ring-2">
                                <option value="30">30天</option>
                                <option value="60">60天</option>
                                <option value="90" selected>90天</option>
                                <option value="180">180天</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-black text-gray-500 uppercase tracking-wider mb-2">发布渠道</label>
                            <div class="flex items-center space-x-6 mt-3">
                                <label class="flex items-center space-x-2 cursor-pointer">
                                    <input type="checkbox" name="publish-to" value="internal" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900" checked>
                                    <span class="text-sm font-medium text-gray-700">内部平台</span>
                                </label>
                                <label class="flex items-center space-x-2 cursor-pointer">
                                    <input type="checkbox" name="publish-to" value="external" class="w-4 h-4 rounded border-gray-300 text-slate-900 focus:ring-slate-900">
                                    <span class="text-sm font-medium text-gray-700">外部网站</span>
                                </label>
                            </div>
                        </div>

                        <!-- 智能处理设置 -->
                        <div class="sm:col-span-2 border-t border-gray-100 pt-8 mt-4">
                            <label class="block text-xs font-black text-gray-500 uppercase tracking-wider mb-6">智能处理设置</label>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <!-- 自动快评 -->
                                <div class="p-4 bg-gray-50 rounded-2xl hover:bg-white hover:shadow-md transition-all border border-transparent hover:border-gray-100">
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center">
                                                <i class="fas fa-bolt text-sm"></i>
                                            </div>
                                            <span class="text-sm font-bold text-gray-900">自动快评</span>
                                        </div>
                                        <label class="relative inline-flex items-center cursor-pointer">
                                            <input type="checkbox" id="enable-auto-screening" class="sr-only peer" checked>
                                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-slate-900"></div>
                                        </label>
                                    </div>
                                    <p class="text-xs text-gray-500 leading-relaxed">新简历投递后立即开启AI快评，生成初步匹配得分</p>
                                </div>

                                <!-- 高分通知 -->
                                <div class="p-4 bg-gray-50 rounded-2xl hover:bg-white hover:shadow-md transition-all border border-transparent hover:border-gray-100">
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center">
                                                <i class="fas fa-bell text-sm"></i>
                                            </div>
                                            <span class="text-sm font-bold text-gray-900">高分通知</span>
                                        </div>
                                        <label class="relative inline-flex items-center cursor-pointer">
                                            <input type="checkbox" id="notify-high-score" class="sr-only peer" checked>
                                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-slate-900"></div>
                                        </label>
                                    </div>
                                    <div class="flex items-center space-x-2 mt-2">
                                        <span class="text-xs text-gray-500">分值 ≥</span>
                                        <input type="number" id="high-score-threshold" class="w-16 px-2 py-1 bg-white border border-gray-200 rounded-lg text-xs font-bold focus:ring-1 focus:ring-slate-900 outline-none" value="85" min="0" max="100">
                                    </div>
                                </div>

                                <!-- 自动深度解析 -->
                                <div id="deep-analysis-card" class="p-4 bg-gray-50 rounded-2xl hover:bg-white hover:shadow-md transition-all border border-transparent hover:border-gray-100">
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center">
                                                <i class="fas fa-brain text-sm"></i>
                                            </div>
                                            <span class="text-sm font-bold text-gray-900">自动深度解析</span>
                                        </div>
                                        <label class="relative inline-flex items-center cursor-pointer">
                                            <input type="checkbox" id="enable-deep-analysis" class="sr-only peer">
                                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-slate-900"></div>
                                        </label>
                                    </div>
                                    <p class="text-xs text-gray-500 leading-relaxed">快评完成后，自动对简历进行深度维度分析与潜能评估</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="sm:col-span-2 mt-4 border-t border-gray-100 pt-8">
                            <label class="block text-xs font-black text-gray-500 uppercase tracking-wider mb-4">联系方式</label>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                <input type="text" id="contact-name" class="form-input w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:bg-white focus:ring-2" placeholder="联系人姓名">
                                <input type="email" id="contact-email" class="form-input w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:bg-white focus:ring-2" placeholder="联系邮箱">
                                <input type="tel" id="contact-phone" class="form-input w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:bg-white focus:ring-2" placeholder="联系电话">
                                <input type="text" id="contact-wechat" class="form-input w-full px-4 py-3 bg-gray-50 border-none rounded-xl focus:bg-white focus:ring-2" placeholder="微信号">
                            </div>
                        </div>
                    </div>
                </div>

        // 初始化职位发布表单

            const form = document.getElementById('job-posting-form');
            
            // 自动快评与自动深度解析联动

        // 收集表单数据

        // 初始化表单验证
        function initFormValidation() {
            const requiredFields = document.querySelectorAll('input[required], textarea[required], select[required]');
            
            requiredFields.forEach(field => {
                field.addEventListener('blur', validateField);
                field.addEventListener('input', clearFieldError);
            });
        }

        // 验证字段
        function validateField(e) {
            const field = e.target;
            if (!field.value.trim()) {
                showFieldError(field, '此字段为必填项');
            } else {
                clearFieldError(field);
            }
        }

        // 显示字段错误
        function showFieldError(field, message) {
            clearFieldError(field);
            field.classList.add('border-red-500');
            
            const errorDiv = document.createElement('div');
            errorDiv.className = 'text-red-500 text-sm mt-1 field-error';
            errorDiv.textContent = message;
            field.parentNode.appendChild(errorDiv);
        }

        // 清除字段错误
        function clearFieldError(field) {
            if (typeof field === 'object' && field.target) {
                field = field.target;
            }
            field.classList.remove('border-red-500');
            const errorDiv = field.parentNode.querySelector('.field-error');
            if (errorDiv) {
                errorDiv.remove();
            }
        }

        // 处理表单提交
        async function handleFormSubmit() {
            if (validateForm()) {
                const formData = collectFormData();
                
                // Map frontend data to backend API format
                const jobData = {
                    title: formData.title,
                    location: formData.location,
                    salary_range: `${formData.salaryMin}-${formData.salaryMax}K/${formData.salaryUnit === 'year' ? '年' : '月'}`,
                    experience_required: formData.experience,
                    education_required: formData.education,
                    description: formData.description,
                    requirements: formData.requirements,
                    benefits: formData.benefits, // Send benefits array
                    status: 'active',
                    // 新增智能处理字段
                    enable_auto_screening: formData.enableAutoScreening,
                    notify_high_score: formData.notifyHighScore,
                    high_score_threshold: formData.highScoreThreshold,
                    enable_deep_analysis: formData.enableDeepAnalysis
                };

                try {
                    const editJobId = document.getElementById('job-posting-form').dataset.editJobId;
                    
                    if (editJobId) {
                        // 更新模式
                        await window.resumeDataManager.updateJob(editJobId, jobData);

        }

        // 验证表单
        function validateForm() {

            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    showFieldError(field, '此字段为必填项');

        // 页面动画 & 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            const elements = document.querySelectorAll('.fade-in-up');
            
            // 使用 Intersection Observer 处理进入视图时的动画
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            elements.forEach((el, index) => {
                observer.observe(el);
                // 确保初始元素有延迟显示效果
                setTimeout(() => {
                    el.classList.add('visible');
                }, index * 100);
            });

            // 检查 URL 是否包含 id 参数（编辑模式）
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get('id');

            if (jobId) {
                await loadJobDetails(jobId);

        // 加载职位详情（编辑模式）
        async function loadJobDetails(jobId) {
            try {
                // 修改页面标题
                document.title = '编辑职位 - 争湃·简历大师';
                document.querySelector('.brand-title h1').textContent = '编辑职位';
                document.querySelector('.brand-title p').textContent = '修改职位招聘信息';

                const job = await window.resumeDataManager.getJobById(jobId);
                if (!job) {
                    ui.showNotification('职位不存在或已被删除', 'error');
                    setTimeout(() => window.location.href = 'job-management.html', 2000);
                    return;
                }

                // 填充表单
                document.getElementById('job-title').value = job.title || '';
                document.getElementById('job-location').value = job.location || '';
                
                // 解析薪资 "20-30K/月"
                if (job.salary_range) {
                    const salaryMatch = job.salary_range.match(/(\d+)-(\d+)K\/(月|年)/);
                    if (salaryMatch) {
                        document.getElementById('salary-min').value = salaryMatch[1];
                        document.getElementById('salary-max').value = salaryMatch[2];
                        document.getElementById('salary-unit').value = salaryMatch[3] === '年' ? 'year' : 'month';
                    }
                }

                // 下拉框匹配
                setSelectValue('experience', job.experience_required);
                setSelectValue('education', job.education_required);

                document.getElementById('job-description').value = job.description || '';
                document.getElementById('job-requirements').value = job.requirements || '';

                // 福利待遇 checkbox
                if (job.benefits && Array.isArray(job.benefits)) {
                    job.benefits.forEach(benefit => {
                        const cb = document.querySelector(`input[name="benefits"][value="${benefit}"]`);
                        if (cb) cb.checked = true;
                    });
                }

                // 智能处理设置填充
                if (job.enable_auto_screening !== undefined) {
                    document.getElementById('enable-auto-screening').checked = !!job.enable_auto_screening;
                }
                if (job.notify_high_score !== undefined) {
                    document.getElementById('notify-high-score').checked = !!job.notify_high_score;
                }
                if (job.high_score_threshold !== undefined) {
                    document.getElementById('high-score-threshold').value = job.high_score_threshold;
                }
                if (job.enable_deep_analysis !== undefined) {
                    document.getElementById('enable-deep-analysis').checked = !!job.enable_deep_analysis;
                }
                
                // 存储当前编辑的 Job ID
                document.getElementById('job-posting-form').dataset.editJobId = jobId;

            } catch (error) {
                console.error('加载职位详情失败:', error);
                ui.showNotification('加载职位详情失败', 'error');
            }
        }

        function setSelectValue(id, value) {
            const select = document.getElementById(id);
            if (!select || !value) return;
            // 尝试直接匹配
            select.value = value;
            // 如果直接匹配失败（可能是 value 和 option value 不完全一致），尝试模糊匹配
            if (select.value !== value) {
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].text.includes(value) || value.includes(select.options[i].value)) {
                        select.selectedIndex = i;
                        break;
                    }
                }
            }
        }

    <script>
        // 一键导入功能逻辑
        (function() {
            const importBtn = document.getElementById('import-btn');
            const modal = document.getElementById('import-job-modal');
            const cancelBtn = document.getElementById('cancel-import-btn');
            const confirmBtn = document.getElementById('confirm-import-btn');
            const urlInput = document.getElementById('import-url');
            const urlError = document.getElementById('import-url-error');
            const loading = document.getElementById('import-loading');
            const preview = document.getElementById('import-preview');
            
            let parsedData = null;

            if (importBtn) {
                importBtn.addEventListener('click', () => {
                    openImportModal();
                });
            }

            // 打开模态框函数
            function openImportModal(url = '') {
                modal.classList.remove('hidden');
                urlInput.value = url;
                urlError.classList.add('hidden');
                preview.classList.add('hidden');
                loading.classList.add('hidden');
                parsedData = null;
                confirmBtn.textContent = '开始解析';
            }

            // 检查 URL 参数是否有自动导入任务
            const urlParams = new URLSearchParams(window.location.search);
            const autoImportUrl = urlParams.get('importUrl');
            if (autoImportUrl) {
                const decodedUrl = decodeURIComponent(autoImportUrl);
                openImportModal(decodedUrl);
                handleParse();
                // 清除 URL 参数
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            if (cancelBtn) {
                cancelBtn.addEventListener('click', () => {
                    modal.classList.add('hidden');
                });
            }
            
            // 点击遮罩关闭
            const backdrop = document.getElementById('import-modal-backdrop');
            if(backdrop) {
                backdrop.addEventListener('click', () => {
                    modal.classList.add('hidden');
                });
            }

            if (confirmBtn) {
                confirmBtn.addEventListener('click', async () => {
                    if (!parsedData) {
                        // 执行解析
                        await handleParse();
                    } else {
                        // 执行填充
                        fillForm(parsedData);
                        modal.classList.add('hidden');
                        ui.showNotification('职位信息填充成功', 'success');
                    }
                });
            }

            async function handleParse() {
                const url = urlInput.value.trim();
                if (!url) {
                    showError('请输入有效的职位链接');
                    return;
                }
                
                try {
                    new URL(url); // 验证 URL 格式
                } catch (e) {
                    showError('URL 格式不正确');
                    return;
                }

                showError(null);
                loading.classList.remove('hidden');
                preview.classList.add('hidden');
                confirmBtn.disabled = true;

                try {
                    const token = JSON.parse(localStorage.getItem('userInfo') || '{}').token;
                    const headers = {
                        'Content-Type': 'application/json'
                    };
                    if (token) {
                        headers['Authorization'] = `Bearer ${token}`;
                    }

                    const response = await fetch('/api/jobs/import-url', {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({ url })
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error?.message || result.message || '解析失败');
                    }

                    parsedData = result.data;
                    showPreview(parsedData);
                    confirmBtn.textContent = '确认填充';
                } catch (error) {
                    showError(error.message);
                } finally {
                    loading.classList.add('hidden');
                    confirmBtn.disabled = false;
                }
            }

            function showError(msg) {
                if (msg) {
                    urlError.textContent = msg;
                    urlError.classList.remove('hidden');
                    urlInput.classList.add('border-red-500');
                } else {
                    urlError.classList.add('hidden');
                    urlInput.classList.remove('border-red-500');
                }
            }

            function showPreview(data) {
                document.getElementById('preview-title').textContent = data.title || '未识别';
                document.getElementById('preview-salary').textContent = data.salary || '面议';
                document.getElementById('preview-location').textContent = data.location || '未识别';
                document.getElementById('preview-exp').textContent = data.experience || '不限';
                preview.classList.remove('hidden');
            }

            function fillForm(data) {
                if (data.title) document.getElementById('job-title').value = data.title;
                if (data.location) document.getElementById('job-location').value = data.location;
                
                if (data.description) document.getElementById('job-description').value = data.description;
                if (data.requirements) document.getElementById('job-requirements').value = data.requirements;
                
                // 简单的薪资解析填充
                if (data.salary) {
                    const match = data.salary.match(/(\d+).*?-.*?(\d+)/);
                    if (match) {
                        document.getElementById('salary-min').value = match[1];
                        document.getElementById('salary-max').value = match[2];
                    }
                }
                
                // 经验匹配
                if (data.experience) {
                    const expSelect = document.getElementById('experience');
                    const expText = data.experience.replace('经验', '').replace('以内', '');
                    for (let i = 0; i < expSelect.options.length; i++) {
                        // 模糊匹配: "1-3" matches "1-3年"
                        if (expSelect.options[i].text.includes(expText) || expText.includes(expSelect.options[i].value)) {
                            expSelect.selectedIndex = i;
                            break;
                        }
                    }
                }

                // 学历匹配
                if (data.education) {
                    const eduSelect = document.getElementById('education');
                    const eduMap = {
                        '高中': 'high-school',
                        '中专': 'high-school', // Map closely
                        '大专': 'college',
                        '本科': 'bachelor',
                        '硕士': 'master',
                        '研究生': 'master',
                        '博士': 'phd'
                    };
                    // Find partial match
                    for (const [key, value] of Object.entries(eduMap)) {
                        if (data.education.includes(key)) {
                            eduSelect.value = value;
                            break;
                        }
                    }
                }

                // 福利待遇匹配 (从描述中提取或后端返回)
                if (data.description) {
                    const benefitsMap = {
                        '五险一金': 'five-insurance-fund',
                        '商业保险': 'commercial-insurance',
                        '年终奖': 'annual-bonus',
                        '弹性工作': 'flexible-work',
                        '远程': 'remote-work',
                        '带薪年假': 'paid-leave',
                        '培训': 'training',
                        '晋升': 'career-development',
                        '餐补': 'free-meals',
                        '包吃': 'free-meals',
                        '健身': 'gym',
                        '团建': 'team-building',
                        '股票': 'stock-options',
                        '期权': 'stock-options'
                    };
                    
                    const checkboxes = document.querySelectorAll('input[name="benefits"]');
                    // Reset first
                    checkboxes.forEach(cb => cb.checked = false);
                    
                    for (const [key, value] of Object.entries(benefitsMap)) {
                        if (data.description.includes(key)) {
                            const cb = document.querySelector(`input[name="benefits"][value="${value}"]`);
                            if (cb) cb.checked = true;
                        }
                    }
                }
            }
        })();
    </script>
</body>
</html>
