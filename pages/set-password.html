<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置密码 - 争湃·简历大师</title>
    <script src="../js/tailwindcss.js"></script>
    <script src="../js/ui-components.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        :root {
            --font-family-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
        body { background: #f5f7fa; font-family: var(--font-family-sans); }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 bottom-0 sidebar-modern z-40"></aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20 h-20">
        <div class="flex items-center justify-between px-6 h-full">
            <div class="flex items-center space-x-4 pl-8">
                <div class="brand-title flex flex-col justify-center space-y-1.5">
                    <h1 class="text-lg font-bold text-gray-900 leading-none">设置密码</h1>
                    <p class="text-xs text-gray-500 font-medium leading-tight">为了您的账户安全，请为您的账号设置一个强密码</p>
                </div>
            </div>
            <div id="header-right-section" class="flex items-center space-x-4"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="main-content min-h-screen flex items-center justify-center p-4 pt-24">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 w-full max-w-md hover:shadow-lg transition-all duration-300">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-2">设置密码</h2>
                <p class="text-gray-500 text-sm">为了您的账户安全，建议您设置登录密码<br>下次可直接使用密码登录</p>
            </div>
    
            <form id="setPasswordForm" class="space-y-6">
                <div>
                    <label for="password" class="block text-gray-700 text-sm font-semibold mb-2">新密码</label>
                    <input type="password" id="password" name="password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all" placeholder="请输入6位以上密码" required minlength="6">
                </div>
                <div>
                    <label for="confirmPassword" class="block text-gray-700 text-sm font-semibold mb-2">确认密码</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all" placeholder="请再次输入密码" required minlength="6">
                </div>
                
                <div class="flex flex-col gap-3">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-sm">
                        确认设置
                    </button>
                    <button type="button" id="skipButton" class="w-full bg-white hover:bg-gray-50 text-gray-500 font-medium py-3 px-4 rounded-lg border border-gray-200 transition-colors">
                        跳过，以后再说
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Loading Modal -->
    <div id="loadingModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 flex items-center space-x-3 shadow-xl">
            <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
            <span class="text-gray-700 font-medium">处理中...</span>
        </div>
    </div>

    <script src="../js/user-auth.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="../js/header-profile.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Sidebar
            if (typeof Sidebar !== 'undefined') {
                Sidebar.init({ mount: '#sidebar', active: null });
            }

            // Initialize Header Profile
            if (typeof HeaderProfile !== 'undefined') {
                HeaderProfile.init('#header-right-section');
            }

            const setPasswordForm = document.getElementById('setPasswordForm');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const skipButton = document.getElementById('skipButton');
            const loadingModal = document.getElementById('loadingModal');
            
            // Initialize auth
            const userAuth = new UserAuth();
            
            // Check login status
            if (!userAuth.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }

            setPasswordForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (password.length < 6) {
                    ui.showNotification('密码至少需要6位字符', 'warning');
                    return;
                }

                if (password !== confirmPassword) {
                    ui.showNotification('两次输入的密码不一致', 'warning');
                    return;
                }

                loadingModal.classList.remove('hidden');
                try {
                    const result = await userAuth.setPassword(password);
                    loadingModal.classList.add('hidden');
                    if (result.success) {
                        ui.showNotification('密码设置成功！', 'success');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                    } else {
                        ui.showNotification(result.message || '设置密码失败，请重试', 'error');
                    }
                } catch (error) {
                    loadingModal.classList.add('hidden');
                    ui.showNotification('请求失败，请稍后重试', 'error');
                    console.error('设置密码请求错误:', error);
                }
            });

            skipButton.addEventListener('click', () => {
                window.location.href = 'dashboard.html';
            });
        });
    </script>
</body>
</html>
