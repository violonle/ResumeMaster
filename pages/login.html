<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 争湃·简历大师</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../js/tailwindcss.js"></script>
    <script src="../js/ui-components.js"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        :root {
            --font-family-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }
        body { font-family: var(--font-family-sans); }
    </style>
</head>
<body class="min-h-screen flex bg-white font-sans selection:bg-blue-100 selection:text-blue-700 overflow-hidden">

    <!-- Left Panel (Portal Style) -->
    <div class="hidden lg:flex lg:w-3/5 bg-gray-50 items-center justify-center p-24 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-blue-100/30 rounded-full -mr-32 -mt-32 blur-3xl"></div>
        <div class="z-10 w-full max-w-xl">
            <div class="flex items-center space-x-4 mb-6">
                <img src="../public/logo.png" alt="争湃·简历大师" class="h-12 w-auto">
                <h1 class="text-3xl font-black text-blue-700 tracking-tight">争湃·简历大师</h1>
            </div>
            <h2 class="text-5xl font-black text-gray-900 leading-[1.1] mb-8">
                争湃·<span class="text-blue-700">简历大师</span>
            </h2>
            <div class="space-y-6">
                <div class="flex items-start space-x-4 bg-white p-6 rounded-[32px] border border-gray-100 shadow-sm transition-all hover:shadow-lg">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-microchip"></i>
                    </div>
                    <div>
                        <p class="font-black text-gray-900 text-sm">简历智能解析</p>
                        <p class="text-xs font-bold text-gray-400 mt-0.5">基于大模型的简历深度解析与对比</p>
                    </div>
                </div>
                <div class="flex items-start space-x-4 bg-white p-6 rounded-[32px] border border-gray-100 shadow-sm transition-all hover:shadow-lg">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-tower-observation"></i>
                    </div>
                    <div>
                        <p class="font-black text-gray-900 text-sm">招聘流程管理</p>
                        <p class="text-xs font-bold text-gray-400 mt-0.5">全自动的面试流程管理</p>
                    </div>
                </div>
                <div class="flex items-start space-x-4 bg-white p-6 rounded-[32px] border border-gray-100 shadow-sm transition-all hover:shadow-lg">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <div>
                        <p class="font-black text-gray-900 text-sm">AI面试</p>
                        <p class="text-xs font-bold text-gray-400 mt-0.5">用AI分析简历，并基于此出面试题库</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Panel (Login Form) -->
    <div class="w-full lg:w-2/5 flex items-center justify-center p-8 lg:p-16 bg-white overflow-y-auto">
        <div class="w-full max-w-sm space-y-8">
            <div>
                <h2 class="text-3xl font-black text-gray-900 tracking-tight">欢迎登录</h2>
            </div>

            <!-- Login Tabs -->
            <div class="flex border-b border-gray-100">
                <button id="phoneLoginTab" class="flex-1 pb-4 text-sm font-black text-blue-600 border-b-2 border-blue-600 focus:outline-none transition-colors">手机号登录</button>
                <button id="passwordLoginTab" class="flex-1 pb-4 text-sm font-black text-gray-400 border-b-2 border-transparent hover:text-gray-600 focus:outline-none transition-colors">密码登录</button>
            </div>

            <!-- Phone Login Form -->
            <div id="phoneLoginForm" class="space-y-6">
                <div class="space-y-4">
                    <div class="relative group">
                        <i class="fa-solid fa-mobile-screen absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 group-focus-within:text-blue-600 transition-colors"></i>
                        <input id="phoneInput" type="tel" maxlength="11" placeholder="请输入手机号码" class="w-full pl-12 pr-4 py-4 bg-gray-50 border-none rounded-2xl font-bold text-sm placeholder:text-gray-300 focus:ring-2 focus:ring-blue-100 transition-all outline-none">
                    </div>
                    <div class="flex gap-3">
                        <div class="relative group flex-1">
                            <i class="fa-solid fa-shield-halved absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 group-focus-within:text-blue-600 transition-colors"></i>
                            <input id="codeInput" type="text" maxlength="6" placeholder="验证码" class="w-full pl-12 pr-4 py-4 bg-gray-50 border-none rounded-2xl font-bold text-sm placeholder:text-gray-300 focus:ring-2 focus:ring-blue-100 transition-all outline-none">
                        </div>
                        <button id="sendCodeBtn" type="button" class="px-4 py-4 bg-blue-50 text-blue-600 font-bold text-sm rounded-2xl hover:bg-blue-100 transition-colors whitespace-nowrap">发送验证码</button>
                    </div>
                </div>
                <button id="submitBtn" type="button" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black text-sm shadow-xl shadow-blue-100 hover:bg-blue-700 active:scale-[0.99] transition-all transform-gpu flex items-center justify-center">
                    继续
                </button>
            </div>

            <!-- Password Login Form -->
            <div id="passwordLoginForm" class="hidden space-y-6">
                <div class="space-y-4">
                    <div class="relative group">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 group-focus-within:text-blue-600 transition-colors"></i>
                        <input id="emailPhoneInput" type="text" placeholder="ID / 邮箱 / 手机号" class="w-full pl-12 pr-4 py-4 bg-gray-50 border-none rounded-2xl font-bold text-sm placeholder:text-gray-300 focus:ring-2 focus:ring-blue-100 transition-all outline-none">
                    </div>
                    <div class="relative group">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 group-focus-within:text-blue-600 transition-colors"></i>
                        <input id="passwordInput" type="password" placeholder="访问密码" class="w-full pl-12 pr-4 py-4 bg-gray-50 border-none rounded-2xl font-bold text-sm placeholder:text-gray-300 focus:ring-2 focus:ring-blue-100 transition-all outline-none">
                    </div>
                </div>
                <div class="flex items-center justify-between px-1">
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" class="w-4 h-4 rounded border-gray-200 text-blue-600 focus:ring-blue-100">
                        <span class="text-xs font-black text-gray-500 group-hover:text-gray-900 transition-colors">记住我</span>
                    </label>
                    <a href="#" class="text-xs font-black text-blue-600 hover:underline">忘记密码？</a>
                </div>
                <button id="passwordLoginBtn" type="button" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black text-sm shadow-xl shadow-blue-100 hover:bg-blue-700 active:scale-[0.99] transition-all transform-gpu flex items-center justify-center">
                    登录
                </button>
            </div>

            <div class="text-center pt-8 border-t border-gray-50">
                <p class="text-[10px] font-black text-gray-300 uppercase tracking-[0.2em]">争湃·智聘云统一身份验证中心</p>
                <p class="text-[10px] text-gray-300 mt-2">© 2025 云璞网科 · <a href="https://beian.miit.gov.cn/" target="_blank" class="hover:text-gray-400 transition-colors">鲁ICP备2023016452号</a></p>
            </div>
        </div>
        </div>
    </div>

    <!-- 加载提示 -->
    <div id="loadingModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-2xl p-6 flex items-center space-x-3 shadow-2xl">
            <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
            <span class="text-gray-700 font-bold">验证中...</span>
        </div>
    </div>

    <script src="../js/user-auth.js"></script>
    <script>
        const loadingModal = document.getElementById('loadingModal');
        const phoneInput = document.getElementById('phoneInput');
        const codeInput = document.getElementById('codeInput');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const submitBtn = document.getElementById('submitBtn');

        const phoneLoginTab = document.getElementById('phoneLoginTab');
        const passwordLoginTab = document.getElementById('passwordLoginTab');
        const phoneLoginForm = document.getElementById('phoneLoginForm');
        const passwordLoginForm = document.getElementById('passwordLoginForm');
        const emailPhoneInput = document.getElementById('emailPhoneInput');
        const passwordInput = document.getElementById('passwordInput');
        const passwordLoginBtn = document.getElementById('passwordLoginBtn');

        const userAuth = (typeof userAuthInstance !== 'undefined' ? userAuthInstance : new UserAuth());

        function startCountdown(button){ let n=60; button.disabled=true; const originalText = button.textContent; const tick=()=>{ button.textContent=`${n}秒后重发`; if(n<=0){ button.disabled=false; button.textContent=originalText; return;} n--; setTimeout(tick,1000)}; tick(); }

        // 切换登录方式
        phoneLoginTab.addEventListener('click', () => {
            phoneLoginForm.classList.remove('hidden');
            passwordLoginForm.classList.add('hidden');
            
            // Activate Phone Tab
            phoneLoginTab.classList.add('text-blue-600', 'border-blue-600');
            phoneLoginTab.classList.remove('text-gray-400', 'border-transparent', 'hover:text-gray-600');
            
            // Deactivate Password Tab
            passwordLoginTab.classList.add('text-gray-400', 'border-transparent', 'hover:text-gray-600');
            passwordLoginTab.classList.remove('text-blue-600', 'border-blue-600');
        });

        passwordLoginTab.addEventListener('click', () => {
            passwordLoginForm.classList.remove('hidden');
            phoneLoginForm.classList.add('hidden');
            
            // Activate Password Tab
            passwordLoginTab.classList.add('text-blue-600', 'border-blue-600');
            passwordLoginTab.classList.remove('text-gray-400', 'border-transparent', 'hover:text-gray-600');
            
            // Deactivate Phone Tab
            phoneLoginTab.classList.add('text-gray-400', 'border-transparent', 'hover:text-gray-600');
            phoneLoginTab.classList.remove('text-blue-600', 'border-blue-600');
        });

        // 发送验证码逻辑
        sendCodeBtn.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            if (!phone) {
                if(typeof ui !== 'undefined') ui.showNotification('请输入手机号码', 'warning');
                else alert('请输入手机号码');
                return;
            }
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                if(typeof ui !== 'undefined') ui.showNotification('手机号码格式不正确', 'warning');
                else alert('手机号码格式不正确');
                return;
            }

            try {
                sendCodeBtn.disabled = true;
                const result = await userAuth.sendVerificationCode(phone);
                if (result.success) {
                    if(typeof ui !== 'undefined') ui.showNotification('验证码已发送', 'success');
                    else alert('验证码已发送: ' + (result.code || '')); // Dev mode hint
                    startCountdown(sendCodeBtn);
                } else {
                    if(typeof ui !== 'undefined') ui.showNotification(result.message || '发送失败', 'error');
                    else alert(result.message || '发送失败');
                    sendCodeBtn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                if(typeof ui !== 'undefined') ui.showNotification('发送失败，请稍后重试', 'error');
                else alert('发送失败');
                sendCodeBtn.disabled = false;
            }
        });

        // 手机号登录提交
        submitBtn.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            const code = codeInput.value.trim();

            if (!phone || !code) {
                if(typeof ui !== 'undefined') ui.showNotification('请填写手机号和验证码', 'warning');
                else alert('请填写手机号和验证码');
                return;
            }

            loadingModal.classList.remove('hidden');

            try {
                const result = await userAuth.loginWithPhone(phone, code);
                loadingModal.classList.add('hidden');

                if (result.success) {
                    if(typeof ui !== 'undefined') ui.showNotification('登录成功', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    if(typeof ui !== 'undefined') ui.showNotification(result.message || '登录失败', 'error');
                    else alert(result.message || '登录失败');
                }
            } catch (e) {
                loadingModal.classList.add('hidden');
                console.error(e);
                if(typeof ui !== 'undefined') ui.showNotification('请求失败，请稍后重试', 'error');
                else alert('请求失败');
            }
        });

        // 密码登录提交
        passwordLoginBtn.addEventListener('click', async () => {
            const identifier = emailPhoneInput.value.trim();
            const password = passwordInput.value.trim();

            if (!identifier || !password) {
                if(typeof ui !== 'undefined') ui.showNotification('请输入账号和密码', 'warning');
                else alert('请输入账号和密码');
                return;
            }

            loadingModal.classList.remove('hidden');
            
            try {
                const result = await userAuth.login(identifier, password);
                loadingModal.classList.add('hidden');

                if (result.success) {
                    if(typeof ui !== 'undefined') ui.showNotification('登录成功', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    const msg = result.message || '登录失败';
                    const finalMsg = (/未注册|不存在/.test(msg)) ? '您还不是注册用户，请注册' : '密码错误，请重试';
                    if(typeof ui !== 'undefined') ui.showNotification(finalMsg, 'error');
                    else alert(finalMsg);
                }
            } catch (e) {
                loadingModal.classList.add('hidden');
                console.error(e);
                if(typeof ui !== 'undefined') ui.showNotification('请求失败，请稍后重试', 'error');
                else alert('请求失败');
            }
        });
    </script>
</body>
</html>
