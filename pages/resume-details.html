<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简历详情 - 争湃·简历大师</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script src="../js/tailwindcss.js"></script>
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <script src="../js/user-auth.js"></script>
  <script src="../js/resume-data.js?v=2"></script>
  <link rel="stylesheet" href="/css/sidebar.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    body { font-family: var(--font-sans); }
    .portal-card {
        background-color: white;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        transition-property: all;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 300ms;
        margin-bottom: 1.5rem;
        padding: 1.5rem;
    }
    .portal-card:hover {
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        transform: translateY(-2px);
    }

    .tag {display:inline-block;padding:2px 8px;background:#f3f4f6;color:#6b7280;border-radius:12px;font-size:.75rem;margin-right:4px;margin-bottom:4px}
    .info-label {font-size:0.875rem;color:#6b7280;margin-bottom:0.25rem}
    .info-value {font-size:1rem;color:#111827;font-weight:500}
    .timeline-item {position:relative;padding-left:2rem;padding-bottom:1.5rem;border-left:2px solid #e5e7eb}
    .timeline-item:last-child {border-left-color:transparent}
    .timeline-dot {position:absolute;left:-9px;top:0;width:16px;height:16px;border-radius:50%;background:#3b82f6;border:4px solid #fff;box-shadow:0 0 0 2px #e5e7eb}
  </style>
</head>
<body class="bg-gray-50 antialiased text-gray-900 selection:bg-blue-100 selection:text-blue-700">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed left-0 top-0 bottom-0 sidebar-modern z-40"></aside>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  
  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20 h-20">
    <div class="flex items-center justify-between px-6 h-full">
      <div class="flex items-center space-x-4 pl-8">
        <div class="brand-title flex flex-col justify-center space-y-1.5">
          <h1 class="text-lg font-bold text-gray-900 leading-none">简历详情</h1>
          <p class="text-xs text-gray-500 font-medium leading-tight">查看简历的详细内容、匹配度分析及候选人信息</p>
        </div>
      </div>
      <div id="header-right-section" class="flex items-center space-x-4"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content p-6" id="main-content">
    <div class="max-w-[1440px] mx-auto">
      <!-- Breadcrumb & Back -->
      <div class="mb-6 flex items-center justify-between">
        <a id="back-link" href="librarypool.html" class="text-gray-500 hover:text-blue-600 flex items-center transition-colors">
          <span class="text-xl mr-2">⬅️</span><span id="back-text">返回人才库</span>
        </a>
        <div class="flex items-center space-x-3">
          <button id="export-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center">
            导出
          </button>
          <button id="analyze-btn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 flex items-center">
            分析
          </button>
          <button id="pass-btn" class="px-4 py-2 bg-blue-700 text-white rounded-lg hover:bg-blue-800 flex items-center">
            通过初筛
          </button>
          <a id="reject-link" class="text-gray-500 hover:text-red-600 flex items-center transition-colors">
            暂不考虑
          </a>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading-indicator" class="text-center py-20">
        <i class="fas fa-circle-notch fa-spin text-4xl text-blue-500 mb-4"></i>
        <p class="text-gray-600">正在加载简历详情...</p>
      </div>

      <!-- Error State -->
      <div id="error-state" class="hidden text-center py-20 bg-white rounded-2xl shadow-lg">
        <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
        <h2 class="text-xl font-bold text-gray-900 mb-2">无法加载简历</h2>
        <p class="text-gray-500 mb-6" id="error-message">找不到指定的简历信息</p>
        <a href="librarypool.html" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">返回列表</a>
      </div>

      <!-- Resume Content -->
      <div id="resume-content" class="hidden fade-in-up">
        <!-- Header Card -->
        <div class="portal-card flex flex-col md:flex-row md:items-start md:justify-between gap-6">
          <div class="flex items-start gap-6">
            <div class="w-24 h-24 rounded-full bg-gray-200 flex items-center justify-center text-3xl text-gray-400 overflow-hidden flex-shrink-0">
              <span id="avatar-text"></span>
              <img id="avatar-img" class="w-full h-full object-cover hidden" alt="Avatar">
            </div>
            <div>
              <h1 class="text-2xl font-bold text-gray-900 mb-2" id="resume-name">姓名</h1>
              <p class="text-lg text-blue-600 font-medium mb-3" id="resume-position">职位</p>
              <div class="flex flex-wrap gap-4 text-sm text-gray-600">
                <span class="flex items-center"><i class="fas fa-envelope mr-2"></i><span id="resume-email">email@example.com</span></span>
                <span class="flex items-center"><i class="fas fa-phone mr-2"></i><span id="resume-phone">13800000000</span></span>
                <span class="flex items-center"><i class="fas fa-map-marker-alt mr-2"></i><span id="resume-location">城市</span></span>
              </div>
            </div>
          </div>
          <div class="flex flex-col items-end">
            <div class="text-center bg-blue-50 p-4 rounded-xl">
              <p class="text-sm text-gray-500 mb-1">匹配度得分</p>
              <p class="text-3xl font-bold text-blue-600" id="resume-score">0</p>
            </div>
            <p class="text-xs text-gray-400 mt-2">更新于: <span id="resume-updated">2024-01-01</span></p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- Left Column -->
          <div class="space-y-6">
            <!-- Basic Info -->
            <div class="portal-card">
              <h3 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">基本信息</h3>
              <div class="space-y-4">
                <div>
                  <p class="info-label">工作经验</p>
                  <p class="info-value" id="info-exp">0年</p>
                </div>
                <div>
                  <p class="info-label">最高学历</p>
                  <p class="info-value" id="info-edu">本科</p>
                </div>
                <div>
                  <p class="info-label">求职状态</p>
                  <p class="info-value" id="info-status">在职-看机会</p>
                </div>
                <div>
                  <p class="info-label">期望薪资</p>
                  <p class="info-value" id="info-salary">面议</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Right Column -->
          <div class="lg:col-span-2 space-y-6">
            <!-- Attachment Preview -->
            <div class="portal-card" id="attachment-section">
              <h3 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">简历附件</h3>
              <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border border-gray-200">
                <div class="flex items-center">
                  <div class="w-10 h-10 rounded bg-blue-100 text-blue-600 flex items-center justify-center mr-4">
                    <i class="fas fa-file-alt text-xl" id="attachment-icon"></i>
                  </div>
                  <div>
                    <p class="font-medium text-gray-900" id="attachment-name">resume.pdf</p>
                    <p class="text-sm text-gray-500" id="attachment-size">未知大小</p>
                  </div>
                </div>
                <a id="preview-attachment-btn" href="#" target="_blank" class="px-4 py-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors font-medium flex items-center">
                  <i class="fas fa-eye mr-2"></i>预览
                </a>
              </div>
            </div>

             <!-- Summary -->
             <div class="portal-card">
              <h3 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">个人优势</h3>
              <p class="text-gray-700 leading-relaxed" id="resume-summary">暂无描述</p>
            </div>

            <!-- Experience -->
            <div class="portal-card">
              <h3 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">工作经历</h3>
              <div class="space-y-6" id="experience-container">
                <!-- Experience Items -->
              </div>
            </div>

            <!-- Education -->
            <div class="portal-card">
              <h3 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">教育经历</h3>
              <div class="space-y-6" id="education-container">
                <!-- Education Items -->
              </div>
            </div>
            
             <!-- Projects -->
             <div class="portal-card">
              <h3 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">项目经历</h3>
              <div class="space-y-6" id="project-container">
                <!-- Project Items -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/sidebar.js"></script>
  <script src="../js/header-profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        // Initialize sidebar
        if (typeof Sidebar !== 'undefined') {
            await Sidebar.init({ mount: '#sidebar', active: 'librarypool' });
        }
        // Initialize header profile
        if (typeof HeaderProfile !== 'undefined') {
            HeaderProfile.init('#header-right-section');
        }

        // Update back link to return to previous page
        const backLink = document.getElementById('back-link');
        const backText = document.getElementById('back-text');
        const referrer = document.referrer;
        
        // Check if referrer exists and is not the current page
        if (referrer && referrer !== window.location.href) {
            // Set the href to the referrer
            backLink.href = referrer;
            // Update the text to be more generic
            backText.textContent = '返回上一页';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const resumeId = urlParams.get('id');

        if (!resumeId) {
          showError('未提供简历ID');
          return;
        }

        initResumeDetails();
    });

    function navigateToJobPosting(){window.location.href='job-posting.html'}
    function navigateToResumeUpload(){window.location.href='resume-upload-pc.html'}
    function navigateToAnalytics(){window.location.href='data-analysis.html'}

    async function initResumeDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      
      if (!id) {
        showError('未提供简历ID');
        return;
      }

      console.log('尝试加载简历ID:', id, '类型:', typeof id);

      try {
        const rdm = new ResumeDataManager();
        console.log('调用getResumeById方法');
        let resume = await rdm.getResumeById(id);
        
        console.log('getResumeById返回结果:', resume);
        
        if (resume) {
          renderResume(resume);
        } else {
          showError('找不到该简历数据');
        }
      } catch (error) {
        console.error('加载简历错误详情:', error);
        showError('加载简历数据时出错: ' + error.message);
      }
    }

    function showError(msg) {
      document.getElementById('loading-indicator').classList.add('hidden');
      document.getElementById('resume-content').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
      document.getElementById('error-message').textContent = msg;
    }

    async function updateRecruitmentStatus(resumeId, status) {
      try {
        const rdm = new ResumeDataManager();
        await rdm.updateRecruitmentStatus(resumeId, status);
        alert('状态已更新为：' + status);
      } catch (error) {
        console.error('更新状态失败:', error);
        alert('更新状态失败，请稍后重试');
      }
    }

    document.getElementById('pass-btn').addEventListener('click', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const resumeId = urlParams.get('id');
      if (resumeId) {
        updateRecruitmentStatus(resumeId, '初筛');
      }
    });

    document.getElementById('reject-link').addEventListener('click', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const resumeId = urlParams.get('id');
      if (resumeId) {
        if (confirm('确定要暂不考虑此候选人吗？')) {
          updateRecruitmentStatus(resumeId, '放弃');
        }
      }
    });

    function renderResume(data) {
      document.getElementById('loading-indicator').classList.add('hidden');
      document.getElementById('resume-content').classList.remove('hidden');
      
      const pd = data.parsed_data || {};
      
      const name = data.name || pd.name || data.file_name || '未命名简历';
      document.getElementById('resume-name').textContent = name;
      document.getElementById('avatar-text').textContent = name.charAt(0);
      document.getElementById('resume-position').textContent = data.job_title || pd.job_title || pd.position || '未填写职位';
      document.getElementById('resume-email').textContent = data.email || pd.email || '未填写邮箱';
      document.getElementById('resume-phone').textContent = data.phone || pd.phone || '未填写电话';
      
      let location = data.location || pd.location || pd.city || pd.expectCity || '未填写城市';
      location = location.replace(/期望薪资.*?\d+.*?K/gi, '').replace(/薪资.*?\d+.*?K/gi, '').replace(/资.*?\d+.*?K/gi, '').replace(/期望城市/gi, '').replace(/所在城市/gi, '').trim();
      if (!location || location === '资' || location === '资8-12K') {
        location = '未填写城市';
      }
      document.getElementById('resume-location').textContent = location;
      document.getElementById('resume-score').textContent = data.overall_score || 0;
      
      const date = data.upload_date ? new Date(data.upload_date).toLocaleDateString() : new Date().toLocaleDateString();
      document.getElementById('resume-updated').textContent = date;

      // Attachment Logic
      const fileName = data.file_name || 'unknown.pdf';
      document.getElementById('attachment-name').textContent = fileName;
      
      const sizeKB = data.file_size ? (data.file_size / 1024).toFixed(1) + ' KB' : '未知大小';
      document.getElementById('attachment-size').textContent = sizeKB;

      const ext = fileName.split('.').pop().toLowerCase();
      const icon = document.getElementById('attachment-icon');
      if (ext === 'pdf') icon.className = 'fas fa-file-pdf text-xl';
      else if (ext === 'doc' || ext === 'docx') icon.className = 'fas fa-file-word text-xl';
      else icon.className = 'fas fa-file-alt text-xl';

      const previewBtn = document.getElementById('preview-attachment-btn');
      if (data.file_path && data.file_path.includes('uploads')) {
          // Convert absolute path to relative URL
          // Assuming /uploads is served statically
          const parts = data.file_path.split('uploads');
          if (parts.length > 1) {
              const relativePath = '/uploads' + parts[parts.length - 1].replace(/\\/g, '/'); // Ensure it starts with /uploads and handle Windows paths
              previewBtn.href = relativePath;
              // If it's a PDF, browser opens it. If docx, it downloads.
              // For docx preview, we might need a viewer, but for now browser default behavior is fine.
          } else {
              previewBtn.style.display = 'none';
          }
      } else {
          previewBtn.style.display = 'none';
      }

      document.getElementById('info-exp').textContent = (data.experience_years || pd.experience_years || 0) + '年';
      document.getElementById('info-edu').textContent = data.highest_education || (pd.education && pd.education[0] && pd.education[0].degree) || '未填写';
      document.getElementById('info-status').textContent = data.job_status || '未填写';
      document.getElementById('info-salary').textContent = data.expected_salary || '面议';
      
      document.getElementById('resume-summary').textContent = data.summary || pd.summary || '暂无个人优势描述';

      const expContainer = document.getElementById('experience-container');
      let experience = data.work_experience || pd.work_experience || pd.workExperience || pd.experience || [];
      
      if (experience.length > 0) {
        expContainer.innerHTML = experience.map((exp, index) => {
          const startDate = exp.startDate || exp.startYear || exp.start_date || '';
          const endDate = exp.endDate || exp.endYear || exp.end_date || '至今';
          const position = exp.position || exp.jobTitle || exp.role || exp.title || '';
          const company = exp.company || exp.name || '未知公司';
          const description = exp.description || exp.responsibilities || '';
          
          return `
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="flex flex-wrap justify-between items-baseline mb-1">
              <h4 class="text-lg font-bold text-gray-900">${company}</h4>
              <span class="text-sm text-gray-500">${startDate} - ${endDate}</span>
            </div>
            <p class="text-blue-600 font-medium mb-2">${position}</p>
            <p class="text-gray-600 text-sm leading-relaxed">${description}</p>
          </div>
        `}).join('');
      } else {
        expContainer.innerHTML = '<p class="text-gray-400 italic">暂无工作经历</p>';
      }

      // Education - 使用数据库字段
      const eduContainer = document.getElementById('education-container');
      const education = data.education || pd.education || [];
      if (education.length > 0) {
        eduContainer.innerHTML = education.map(edu => {
          const startDate = edu.startDate || edu.startYear || edu.start_date || '';
          const endDate = edu.endDate || edu.endYear || edu.end_date || '至今';
          const school = edu.school || edu.name || '未知学校';
          const degree = edu.degree || '';
          const major = edu.major || '';
          
          return `
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="flex flex-wrap justify-between items-baseline mb-1">
              <h4 class="text-lg font-bold text-gray-900">${school}</h4>
              <span class="text-sm text-gray-500">${startDate} - ${endDate}</span>
            </div>
            <p class="text-gray-700 font-medium">${degree} · ${major}</p>
          </div>
        `}).join('');
      } else {
        eduContainer.innerHTML = '<p class="text-gray-400 italic">暂无教育经历</p>';
      }
      
      // Projects - 使用数据库字段
      const projContainer = document.getElementById('project-container');
      const projects = data.projects || pd.projects || [];
      if (projects.length > 0) {
        projContainer.innerHTML = projects.map(proj => {
          const startDate = proj.startDate || proj.startYear || proj.start_date || '';
          const endDate = proj.endDate || proj.endYear || proj.end_date || '至今';
          const name = proj.name || proj.title || '未知项目';
          const role = proj.role || proj.position || '';
          const description = proj.description || proj.responsibilities || '';
          
          return `
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="flex flex-wrap justify-between items-baseline mb-1">
              <h4 class="text-lg font-bold text-gray-900">${name}</h4>
              <span class="text-sm text-gray-500">${startDate} - ${endDate}</span>
            </div>
            <p class="text-blue-600 font-medium mb-2">${role}</p>
            <p class="text-gray-600 text-sm leading-relaxed">${description}</p>
          </div>
        `}).join('');
      } else {
         // Hide project section if empty
         if(projContainer.parentElement) projContainer.parentElement.style.display = 'none';
      }
    }
  </script>
</body>
</html>
