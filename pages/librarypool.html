<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人才库 - 争湃·简历大师</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script src="../js/tailwindcss.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <script src="../js/user-auth.js"></script>
  <script src="../js/resume-data.js?v=2"></script>
  <script src="../js/resume-upload-handler.js"></script>
  <link rel="stylesheet" href="/css/sidebar.css">
  <style>
    /* 基础样式 */
    body { background-color: #f9fafb; }
    

    /* 新版 Modern UI 样式 */
    .stat-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.08);
    }
    
    .resume-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .resume-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.1);
      border-color: #bfdbfe; /* blue-200 */
    }
    
    .tag-pill {
      transition: all 0.2s ease;
    }
    .tag-pill:hover {
      transform: translateY(-1px);
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up {
      animation: fadeInUp 0.5s ease forwards;
    }

    /* 列表视图样式 */
    .resume-list-container {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .resume-list-item {
      display: flex;
      align-items: center;
      padding: 1.5rem;
      border-bottom: 1px solid #f3f4f6;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .resume-list-item:hover {
      background-color: #f9fafb;
    }

    .resume-list-item:last-child {
      border-bottom: none;
    }

    .resume-list-avatar {
      width: 3rem;
      height: 3rem;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 1rem;
    }

    .resume-list-info {
      flex: 1;
      min-width: 0;
    }

    .resume-list-name {
      font-weight: 600;
      color: #111827;
      font-size: 1rem;
    }

    .resume-list-position {
      color: #2563eb;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .resume-list-meta {
      display: flex;
      gap: 1.5rem;
      color: #6b7280;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }



    .resume-list-score {
      text-align: center;
      min-width: 4rem;
    }

    .resume-list-score-value {
      font-size: 1.125rem;
      font-weight: 600;
      color: #2563eb;
    }

    .resume-list-score-label {
      font-size: 0.75rem;
      color: #9ca3af;
    }

    .resume-list-actions {
      display: flex;
      gap: 0.5rem;
      margin-left: 1rem;
    }

    .resume-list-action-btn {
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }

    .resume-list-action-btn:hover {
      transform: translateY(-1px);
    }

    .resume-list-action-btn.view {
      background-color: #2563eb;
      color: white;
    }

    .resume-list-action-btn.view:hover {
      background-color: #1d4ed8;
    }

    .resume-list-action-btn.analyze {
      background-color: #dbeafe;
      color: #1e40af;
    }

    .resume-list-action-btn.analyze:hover {
      background-color: #bfdbfe;
    }

    .resume-list-action-btn.favorite {
      background-color: #fef3c7;
      color: #92400e;
    }

    .resume-list-action-btn.favorite:hover {
      background-color: #fde68a;
    }

    /* 视图切换状态 */
    .view-grid .resume-cards-container {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
    }

    @media (min-width: 768px) {
      .view-grid .resume-cards-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .view-grid .resume-cards-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .view-list .resume-cards-container {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="font-sans text-gray-900 antialiased">
  
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed left-0 top-0 bottom-0 sidebar-modern z-40"></aside>
  
  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 bg-white/80 backdrop-blur-md shadow-sm border-b border-gray-200 z-20">
    <div class="flex items-center justify-between p-4">
      <div class="flex items-center space-x-4">
        <button class="menu-button p-2 rounded-lg hover:bg-gray-100 transition-colors" id="sidebar-toggle"><i class="fas fa-bars text-gray-900"></i></button>
        <h1 class="brand-title text-lg font-bold text-gray-900">争湃·简历大师</h1>
      </div>
      <div class="flex items-center space-x-4" id="header-right-section"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content pt-20 p-6" id="main-content">
    <div class="max-w-[1600px] mx-auto">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 tracking-tight">人才库</h1>
          <p class="text-gray-500 mt-2 text-sm">集中管理您的所有人才资源，高效筛选与跟进。</p>
        </div>
        <div class="flex gap-3">
            <button onclick="batchAnalysis()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md shadow-blue-200 transition-all hover:shadow-lg flex items-center text-sm font-bold">
              <i class="fas fa-chart-line mr-2"></i> 批量分析
            </button>
            <input id="libraryUploadInput" type="file" accept=".pdf,.doc,.docx,.txt" class="hidden" />
            <button onclick="openLibraryUploadModal()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md shadow-blue-200 transition-all hover:shadow-lg flex items-center text-sm font-bold">
              <i class="fas fa-plus mr-2"></i> 导入简历文件
            </button>
            <button onclick="openLibraryEmailModal()" class="px-5 py-2.5 bg-white border border-blue-600 text-blue-600 hover:bg-blue-50 rounded-xl shadow-md transition-all flex items-center text-sm font-bold">
              <i class="fas fa-envelope mr-2"></i> 从邮箱导入
            </button>
        </div>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
        <!-- Total -->
        <div class="stat-card bg-white p-6 rounded-2xl border border-gray-100 shadow-sm relative overflow-hidden group cursor-pointer" onclick="window.location.reload()">
          <div class="absolute right-0 top-0 w-24 h-24 bg-blue-50 rounded-bl-full -mr-4 -mt-4 opacity-50 transition-transform group-hover:scale-110"></div>
          <div class="relative z-10">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                    <i class="fas fa-users"></i>
                </div>
            </div>
            <p class="text-sm font-medium text-gray-500 mb-1">总简历数</p>
            <h3 id="total-resumes-count" class="text-3xl font-bold text-gray-900 tracking-tight">0</h3>
          </div>
        </div>

        <!-- Pending -->
        <div class="stat-card bg-white p-6 rounded-2xl border border-gray-100 shadow-sm relative overflow-hidden group">
           <div class="absolute right-0 top-0 w-24 h-24 bg-blue-50 rounded-bl-full -mr-4 -mt-4 opacity-50 transition-transform group-hover:scale-110"></div>
           <div class="relative z-10">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                    <i class="fas fa-clock"></i>
                </div>
            </div>
            <p class="text-sm font-medium text-gray-500 mb-1">待处理简历</p>
            <h3 id="pending-resumes-count" class="text-3xl font-bold text-gray-900 tracking-tight">0</h3>
          </div>
        </div>

        <!-- Excellent -->
        <div class="stat-card bg-white p-6 rounded-2xl border border-gray-100 shadow-sm relative overflow-hidden group">
           <div class="absolute right-0 top-0 w-24 h-24 bg-blue-50 rounded-bl-full -mr-4 -mt-4 opacity-50 transition-transform group-hover:scale-110"></div>
           <div class="relative z-10">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                    <i class="fas fa-star"></i>
                </div>
            </div>
            <p class="text-sm font-medium text-gray-500 mb-1">优秀人才 (90+)</p>
            <h3 id="excellent-resumes-count" class="text-3xl font-bold text-gray-900 tracking-tight">0</h3>
          </div>
        </div>

        <!-- Passed Initial Screening -->
        <div class="stat-card bg-white p-6 rounded-2xl border border-gray-100 shadow-sm relative overflow-hidden group">
           <div class="absolute right-0 top-0 w-24 h-24 bg-blue-50 rounded-bl-full -mr-4 -mt-4 opacity-50 transition-transform group-hover:scale-110"></div>
           <div class="relative z-10">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                    <i class="fas fa-check-circle"></i>
                </div>
            </div>
            <p class="text-sm font-medium text-gray-500 mb-1">通过初筛</p>
            <h3 id="passed-screening-count" class="text-3xl font-bold text-gray-900 tracking-tight">0</h3>
          </div>
        </div>
      </div>

      <!-- Main Filter & List Area -->
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
        <!-- Top Filter Bar -->
        <div class="p-6 border-b border-gray-100 bg-gray-50/30">
          <div class="flex flex-col lg:flex-row gap-4 mb-6">
            <div class="relative flex-1 group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="fas fa-search text-gray-400 group-focus-within:text-blue-500 transition-colors"></i>
              </div>
              <input type="text" id="search-box" placeholder="搜索候选人姓名、职位..." 
                     class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500 transition-all text-sm shadow-sm">
            </div>
            
            <div class="flex items-center gap-3 justify-end">
              <button id="filter-toggle-btn" class="px-5 py-3 bg-white border border-gray-200 text-gray-700 rounded-xl text-sm font-medium hover:bg-gray-50 hover:border-gray-300 transition-all flex items-center shadow-sm">
                <i class="fas fa-sliders-h mr-2"></i> 筛选器
              </button>
              <div class="h-10 w-px bg-gray-200 mx-1"></div>
              <div class="text-sm text-gray-500 whitespace-nowrap">
                已筛选 <span id="filtered-resumes-count" class="font-bold text-gray-900">0</span> 人
              </div>
              <div class="h-10 w-px bg-gray-200 mx-1"></div>
              <button id="multi-select-btn" class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl text-sm font-medium hover:bg-gray-50 hover:border-gray-300 transition-all flex items-center shadow-sm">
                <i class="fas fa-check-square mr-2"></i> 多选
              </button>
              <div class="h-10 w-px bg-gray-200 mx-1"></div>
              <div class="flex items-center gap-2">
                <button id="view-grid-btn" class="p-2 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors" title="卡片视图">
                  <i class="fas fa-th-large"></i>
                </button>
                <button id="view-list-btn" class="p-2 rounded-lg bg-white text-gray-400 hover:bg-gray-50 hover:text-gray-600 transition-colors" title="列表视图">
                  <i class="fas fa-list"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Multi-select Action Bar -->
          <div id="multi-select-bar" class="hidden mb-4 p-4 bg-blue-50 border border-blue-200 rounded-xl flex items-center justify-between">
            <div class="flex items-center gap-4">
              <span class="text-sm font-medium text-blue-900">已选择 <span id="selected-count" class="font-bold text-blue-600">0</span> 份简历</span>
              <button onclick="filterManager.selectAllOnPage()" class="text-sm text-blue-600 hover:text-blue-800 font-medium">
                <i class="fas fa-check-double mr-1"></i>全选本页
              </button>
              <button onclick="filterManager.deselectAll()" class="text-sm text-blue-600 hover:text-blue-800 font-medium">
                <i class="fas fa-times mr-1"></i>取消选择
              </button>
            </div>
            <div class="flex items-center gap-4">
              <button onclick="filterManager.batchAnalyzeSelected()" class="text-sm text-blue-600 hover:text-blue-800 font-medium">
                <i class="fas fa-chart-line mr-1"></i>批量分析
              </button>
              <button onclick="filterManager.batchDeleteSelected()" class="text-sm text-red-600 hover:text-red-800 font-medium">
                <i class="fas fa-trash mr-1"></i>批量删除
              </button>
            </div>
          </div>

          <!-- Quick Filters -->
          <div class="space-y-4">
            <div id="role-filters" class="flex flex-wrap gap-2 items-center">
              <span class="text-xs font-bold text-gray-400 uppercase tracking-wider mr-2">职位</span>
              <button class="role-filter active px-3 py-1.5 text-xs font-medium rounded-lg transition-all bg-gray-900 text-white shadow-md" data-role="all">全部</button>
              <button class="role-filter px-3 py-1.5 text-xs font-medium rounded-lg transition-all bg-white text-gray-600 border border-gray-200 hover:border-gray-300 hover:bg-gray-50" data-role="产品经理">产品经理</button>
              <button class="role-filter px-3 py-1.5 text-xs font-medium rounded-lg transition-all bg-white text-gray-600 border border-gray-200 hover:border-gray-300 hover:bg-gray-50" data-role="前端工程师">前端工程师</button>
              <button class="role-filter px-3 py-1.5 text-xs font-medium rounded-lg transition-all bg-white text-gray-600 border border-gray-200 hover:border-gray-300 hover:bg-gray-50" data-role="后端工程师">后端工程师</button>
              <button class="role-filter px-3 py-1.5 text-xs font-medium rounded-lg transition-all bg-white text-gray-600 border border-gray-200 hover:border-gray-300 hover:bg-gray-50" data-role="测试工程师">测试工程师</button>
              <button class="role-filter px-3 py-1.5 text-xs font-medium rounded-lg transition-all bg-white text-gray-600 border border-gray-200 hover:border-gray-300 hover:bg-gray-50" data-role="数据分析师">数据分析师</button>
            </div>
             <div class="hidden"><button class="category-filter active" data-category="all" style="display:none"></button></div>
          </div>

          <!-- Advanced Filters (Hidden) -->
          <div id="advanced-filters" class="hidden mt-6 pt-6 border-t border-gray-100 grid grid-cols-1 md:grid-cols-4 gap-6 animate-fade-in">
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">综合评分</label>
              <div class="flex items-center gap-3">
                <input type="range" id="score-range" min="0" max="100" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                <span id="score-value" class="text-sm font-bold text-blue-600 min-w-[2.5rem]">0+</span>
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">工作经验</label>
              <select id="work-experience" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition-colors">
                <option value="any">不限</option>
                <option value="0-1">1年以下</option>
                <option value="1-3">1-3年</option>
                <option value="3-5">3-5年</option>
                <option value="5-10">5-10年</option>
                <option value="10+">10年以上</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">学历要求</label>
              <select id="education-level" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition-colors">
                <option value="any">不限</option>
                <option value="bachelor">本科</option>
                <option value="master">硕士</option>
                <option value="doctor">博士</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">精准职位</label>
              <input type="text" id="job-title-filter" placeholder="输入职位名称..." class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition-colors">
            </div>
          </div>
        </div>

        <!-- Resume Grid -->
        <div class="p-6 bg-gray-50/30 min-h-[500px]">
          <div id="resume-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
          
          <!-- States -->
          <div id="loading-indicator" class="text-center py-12 hidden">
            <i class="fas fa-circle-notch fa-spin text-3xl text-blue-500 mb-3"></i>
            <p class="text-gray-500 text-sm">正在加载简历数据...</p>
          </div>
          
          <div id="empty-state" class="text-center py-20 hidden flex flex-col items-center justify-center">
            <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-4">
              <i class="fas fa-search text-4xl text-gray-400"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">未找到匹配的简历</h3>
            <p class="text-gray-500 max-w-sm mx-auto">尝试调整筛选条件，或者使用更通用的关键词进行搜索。</p>
            <button onclick="window.location.reload()" class="mt-6 px-6 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm font-medium">
              重置所有筛选
            </button>
          </div>
          
          <div id="pagination-container" class="flex justify-center mt-10"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/sidebar.js"></script>
  <script src="../js/resume-upload-modal.js"></script>
  <script>
    // 统一初始化 - 确保正确的初始化顺序
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. 首先初始化侧边栏
      try {
        if (typeof Sidebar !== 'undefined' && typeof Sidebar.init === 'function') {
          await Sidebar.init({ mount: '#sidebar', active: 'librarypool' });
          console.log('侧边栏初始化成功');
        } else {
          console.error('Sidebar未定义');
        }
      } catch (e) {
        console.error('侧边栏初始化失败:', e);
      }

      // 2. Auth & Sub Check
      (async function(){
        try{
          const token = (JSON.parse(localStorage.getItem('userInfo')||'{}').token)||null;
          const headers = token? { Authorization: 'Bearer '+token } : {};
          const [cur, usage] = await Promise.all([
            fetch('/api/subscription/current', { headers }).then(r=>r.json()).catch(()=>null),
            fetch('/api/subscription/usage', { headers }).then(r=>r.json()).catch(()=>null)
          ]);
          const statusEl = document.getElementById('sub-status');
          const progressEl = document.getElementById('sub-progress');
          const renewEl = document.getElementById('sub-renew');
          const plan = cur && cur.data ? (cur.data.planType || 'free') : 'unknown';
          const expiresAt = cur && cur.data ? (cur.data.expiresAt || cur.data.expires_at) : null;
          const leftDays = (function(){ if(!expiresAt) return null; const d = Math.ceil((new Date(expiresAt)-Date.now())/(1000*60*60*24)); return d })();
          statusEl.textContent = plan;
          const u = usage && usage.data ? usage.data : { aiAnalysis:0,resumeUpload:0,jobMatching:0 };
          const used = (u.aiAnalysis||0) + (u.resumeUpload||0) + (u.jobMatching||0);
          const pct = Math.max(0, Math.min(100, Math.round((used%100)/100*100)));
          progressEl.style.width = pct+'%';
          renewEl.textContent = leftDays!=null ? `距离到期还有 ${leftDays} 天` : '使用量与到期信息暂不可用';
        }catch(e){}
      })();

      // 3. 初始化头部用户信息
      try {
        if (typeof HeaderProfile !== 'undefined' && typeof HeaderProfile.init === 'function') {
          HeaderProfile.init('#header-right-section');
        }
      } catch (e) {
        console.error('头部用户信息初始化失败:', e);
      }

      // 4. 加载人才库数据
      let data = typeof window.resumeData !== 'undefined' ? window.resumeData : undefined;
      let dataLoadError = null;
      
      if (!Array.isArray(data)) {
        try {
          if (window.resumeDataManager && typeof window.resumeDataManager.getTalentPoolResumes === 'function') {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            
            const list = await window.resumeDataManager.getTalentPoolResumes();
            clearTimeout(timeoutId);
            
            data = Array.isArray(list) ? list : [];
            window.resumeData = data;
          } else if (window.resumeDataManager && typeof window.resumeDataManager.apiRequest === 'function') {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            
            const result = await window.resumeDataManager.apiRequest('/library/resumes', 'GET', null, true);

      function normalizeResumes(arr){
      function fmtDate(iso){ try{ var d=new Date(iso); var diff=Math.ceil((Date.now()-d.getTime())/(1000*60*60*24)); if(diff<=1) return '今天'; if(diff<=7) return diff+'天前'; if(diff<=30) return Math.floor(diff/7)+'周前'; return d.toISOString().slice(0,10); }catch(_){ return '—' } }
      var out=[]; for(var i=0;i<arr.length;i++){
        var r=arr[i]||{}; var pd=r.parsed_data||{};
        var name = pd.name || String(r.file_name||'未知').replace(/\.[^/.]+$/,'');
        // 优先使用关联职位(associated_job_title)
        var associatedPos = r.associated_job_title;
        var parsedPos = r.job_title || pd.jobTitle || pd.position || '';
        
        // 用户要求：此处显示关联的“职位管理”中的职位
        // 如果没有关联职位，显示“未关联职位”，而不是简历解析出的当前职位
        var pos = associatedPos || '未关联职位';
        var isAssociated = !!associatedPos;
        
        var score = (typeof r.overall_score==='number') ? r.overall_score : 0;
        var exp = (typeof pd.experience_years==='number') ? pd.experience_years : '—';
        var edu = (pd.education && pd.education[0] && pd.education[0].degree) ? pd.education[0].degree : '—';
        var last = fmtDate(r.upload_date||Date.now());
        out.push({ 
            id: r.id || (i+1), 
            name:name, 
            position:pos, 
            isAssociated: isAssociated,
            parsedPosition: parsedPos, // 保留解析职位以备他用（如详情页）
            score:score, 
            experience:exp, 
            education:edu, 
            avatar:'https://ui-avatars.com/api/?name='+encodeURIComponent(name)+'&background=E5E7EB&color=111827', 
            lastUpdated:last, 
            status: r.status || 'uploaded' 
        });
      }
      return out;
    }

        initEventListeners() {

                this.multiSelectBtn.addEventListener('click', () => this.toggleMultiSelect());

            }));

            this.categoryFilters.forEach(btn => btn.addEventListener('click', e => this.handleCategoryFilter(e)));
            this.scoreRange.addEventListener('input', () => {
                this.scoreValue.textContent = `${this.scoreRange.value}+`;

            });
            this.workExperience.addEventListener('change', () => this.filterAndRender());
            this.educationLevel.addEventListener('change', () => this.filterAndRender());
            this.jobTitleFilter.addEventListener('input', () => this.filterAndRender());
            
            if (this.viewGridBtn) {
                this.viewGridBtn.addEventListener('click', () => this.switchView('grid'));

            if (this.viewListBtn) {

        toggleAdvancedFilters() {

        handleCategoryFilter(e) {
            this.categoryFilters.forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            this.filterAndRender();
        }

        async fetchResumes() {
            try {
                this.loadingIndicator.classList.remove('hidden');
                this.cardsContainer.classList.add('hidden');
                this.emptyState.classList.add('hidden');
                
                let data = [];
                
                // 使用 resumeDataManager 获取最新数据
                if (window.resumeDataManager && typeof window.resumeDataManager.getTalentPoolResumes === 'function') {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                    
                    data = await window.resumeDataManager.getTalentPoolResumes();
                    clearTimeout(timeoutId);
                } else if (window.resumeDataManager && typeof window.resumeDataManager.apiRequest === 'function') {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                    
                    const result = await window.resumeDataManager.apiRequest('/library/resumes', 'GET', null, true);
                    clearTimeout(timeoutId);
                    
                    data = (result && result.data) ? result.data : [];
                }
                
                // 更新本地数据
                if (Array.isArray(data)) {
                    this.allResumes = data;
                    window.resumeData = data;
                    // 更新统计信息
                    this.updateCounts();
                }
                
                return data;
            } catch (error) {
                console.error('获取简历数据失败:', error);
                return this.allResumes; // 如果获取失败，返回现有数据
            }
        }

        async filterAndRender() {
            this.loadingIndicator.classList.remove('hidden');
            this.cardsContainer.classList.add('hidden');
            this.emptyState.classList.add('hidden');
            
            try {
                // 先获取最新数据
                await this.fetchResumes();
                
                // 然后应用过滤器和渲染
                this.applyFilters();
                this.renderPage(1);
            } catch (error) {
                console.error('筛选和渲染失败:', error);
            } finally {
                this.loadingIndicator.classList.add('hidden');
                this.cardsContainer.classList.remove('hidden');
            }
        }

        applyFilters() {
            const searchTerm = this.searchBox.value.toLowerCase();
            const activeCategory = document.querySelector('.category-filter.active') ? document.querySelector('.category-filter.active').dataset.category : 'all';
            const minScore = parseInt(this.scoreRange.value);
            const exp = this.workExperience.value;
            const edu = this.educationLevel.value;
            const jobTitle = this.jobTitleFilter.value.toLowerCase();

            this.filteredResumes = this.allResumes.filter(resume => {
                const nameMatch = resume.name.toLowerCase().includes(searchTerm);
                const positionMatch = resume.position.toLowerCase().includes(searchTerm);
                const searchMatch = nameMatch || positionMatch;
                
                const categoryMatch = activeCategory === 'all' || resume.status === activeCategory;
                const scoreMatch = resume.score >= minScore;
                const expMatch = exp === 'any' || this.matchExperience(resume.experience, exp);
                const eduMatch = edu === 'any' || resume.education.toLowerCase().startsWith(edu);
                const jobTitleMatch = !jobTitle || resume.position.toLowerCase().includes(jobTitle);

                return searchMatch && categoryMatch && scoreMatch && expMatch && eduMatch && jobTitleMatch;
            });
            this.updateFilteredCount();
        }

        matchExperience(resumeExp, filterExp) {
            const resumeExpNum = parseInt(resumeExp);
            if (isNaN(resumeExpNum)) return false;
            if (filterExp === '0-1') return resumeExpNum < 1;
            if (filterExp === '1-3') return resumeExpNum >= 1 && resumeExpNum <= 3;
            if (filterExp === '3-5') return resumeExpNum > 3 && resumeExpNum <= 5;
            if (filterExp === '5-10') return resumeExpNum > 5 && resumeExpNum <= 10;
            if (filterExp === '10+') return resumeExpNum > 10;
            return false;
        }

        switchView(view) {
            this.currentView = view;
            
            if (view === 'grid') {
                this.viewGridBtn.classList.remove('bg-white', 'text-gray-400', 'hover:bg-gray-50', 'hover:text-gray-600');
                this.viewGridBtn.classList.add('bg-blue-50', 'text-blue-600', 'hover:bg-blue-100');
                this.viewListBtn.classList.remove('bg-blue-50', 'text-blue-600', 'hover:bg-blue-100');
                this.viewListBtn.classList.add('bg-white', 'text-gray-400', 'hover:bg-gray-50', 'hover:text-gray-600');
                this.cardsContainer.classList.remove('flex', 'flex-col', 'gap-0');
                this.cardsContainer.classList.add('grid', 'grid-cols-1', 'md:grid-cols-2', 'lg:grid-cols-3', 'gap-6');
                this.itemsPerPage = 9;
            } else {
                this.viewListBtn.classList.remove('bg-white', 'text-gray-400', 'hover:bg-gray-50', 'hover:text-gray-600');
                this.viewListBtn.classList.add('bg-blue-50', 'text-blue-600', 'hover:bg-blue-100');
                this.viewGridBtn.classList.remove('bg-blue-50', 'text-blue-600', 'hover:bg-blue-100');
                this.viewGridBtn.classList.add('bg-white', 'text-gray-400', 'hover:bg-gray-50', 'hover:text-gray-600');
                this.cardsContainer.classList.remove('grid', 'grid-cols-1', 'md:grid-cols-2', 'lg:grid-cols-3', 'gap-6');
                this.cardsContainer.classList.add('flex', 'flex-col', 'gap-0');
                this.itemsPerPage = 10;
            }
            
            this.renderPage(1);
        }

        renderPage(page) {
            this.currentPage = page;
            this.cardsContainer.innerHTML = '';
            this.paginationContainer.innerHTML = '';

            if (this.filteredResumes.length === 0) {
                this.emptyState.classList.remove('hidden');
                return;
            }

            const start = (page - 1) * this.itemsPerPage;
            const end = start + this.itemsPerPage;
            const paginatedItems = this.filteredResumes.slice(start, end);

            paginatedItems.forEach(resume => {
                const card = this.createResumeCard(resume);
                this.cardsContainer.appendChild(card);
            });

            this.renderPagination();
        }

        createResumeCard(resume) {
            if (this.currentView === 'list') {
                return this.createListItem(resume);
            }
            return this.createGridItem(resume);
        }

        createGridItem(resume) {
            const card = document.createElement('div');
            card.className = 'resume-card group relative bg-white rounded-2xl border border-gray-100 hover:border-blue-300 p-6 flex flex-col h-full transition-all duration-300 hover:shadow-lg cursor-pointer overflow-hidden';
            card.style.animationDelay = `${(this.filteredResumes.indexOf(resume) % this.itemsPerPage) * 0.05}s`;
            card.classList.add('fade-in-up');
            
            card.onclick = (e) => {
                if (this.multiSelectMode && (e.target.tagName !== 'BUTTON' && !e.target.closest('button'))) {
                    this.toggleResumeSelection(resume.id);
                } else if (!this.multiSelectMode) {
                    window.location.href = `resume-details.html?id=${resume.id}`;
                }
            };

            const scoreBg = resume.score >= 80 ? 'bg-blue-50 text-blue-700 ring-1 ring-blue-600/20' : 
                           (resume.score >= 60 ? 'bg-blue-50 text-blue-700 ring-1 ring-blue-600/20' : 'bg-blue-50 text-blue-700 ring-1 ring-blue-600/20');
            
            let checkboxHtml = '';
            if (this.multiSelectMode) {
                const isSelected = this.selectedResumes.has(resume.id);
                checkboxHtml = `
                    <div class="absolute top-4 left-4 z-10">
                        <input type="checkbox" ${isSelected ? 'checked' : ''} 
                               class="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
                               onclick="event.stopPropagation(); filterManager.toggleResumeSelection(${resume.id})">
                    </div>
                `;
            }

            card.innerHTML = `
                ${checkboxHtml}
                <div class="flex justify-between items-start mb-4 ${this.multiSelectMode ? 'pl-8' : ''}">
                    <div class="flex-1 min-w-0 mr-4">
                        <h3 class="text-lg font-bold text-gray-900 group-hover:text-blue-600 transition-colors truncate tracking-tight mb-1" title="${resume.name}">${resume.name}</h3>
                        <p class="text-sm ${resume.isAssociated ? 'text-blue-600 font-semibold' : 'text-gray-400 italic'} truncate flex items-center" title="${resume.position}">
                            ${resume.isAssociated ? '<i class="fas fa-link mr-1 text-xs"></i>' : ''}${resume.position}
                        </p>
                    </div>
                    <div class="px-2.5 py-1 rounded-md text-sm font-bold ${scoreBg} flex-shrink-0">
                        ${resume.score}分
                    </div>
                </div>
                
                <div class="space-y-3 mb-6 flex-grow">
                    <div class="flex items-center text-sm text-gray-500 group-hover:text-gray-700 transition-colors">
                        <i class="fas fa-briefcase w-5 text-gray-400"></i>
                        <span class="truncate font-medium">${resume.experience}年经验</span>
                    </div>
                    <div class="flex items-center text-sm text-gray-500 group-hover:text-gray-700 transition-colors">
                        <i class="fas fa-graduation-cap w-5 text-gray-400"></i>
                        <span class="truncate font-medium">${resume.education}</span>
                    </div>
                    <div class="flex items-center text-sm text-gray-500 group-hover:text-gray-700 transition-colors">
                        <i class="far fa-clock w-5 text-gray-400"></i>
                        <span class="truncate text-xs">更新于 ${resume.lastUpdated}</span>
                    </div>
                </div>
                
                <div class="pt-4 border-t border-gray-50 mt-auto">
                    <div class="flex gap-2">
                        <button class="flex-1 py-2.5 text-center text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-sm shadow-blue-200 transition-all duration-200 opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0">
                            查看详情
                        </button>
                        <button class="flex-1 py-2.5 text-center text-sm font-semibold text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-xl transition-all duration-200 opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0">
                            <i class="fas fa-chart-line mr-1"></i>分析
                        </button>
                    </div>
                    <div class="h-[42px] w-full hidden group-hover:hidden"></div> 
                </div>
                <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-blue-50 rounded-full opacity-50 pointer-events-none"></div>
            `;
            return card;
        }

        createListItem(resume) {
            const item = document.createElement('div');
            item.className = 'bg-white border-b border-gray-200 hover:bg-gray-50 transition-colors';
            item.style.animationDelay = `${(this.filteredResumes.indexOf(resume) % this.itemsPerPage) * 0.05}s`;
            item.classList.add('fade-in-up');
            
            const isSelected = this.selectedResumes.has(resume.id);
            if (isSelected) {
                item.classList.add('bg-blue-50');
            }
            
            item.onclick = (e) => {
                if (this.multiSelectMode && (e.target.tagName !== 'BUTTON' && !e.target.closest('button'))) {
                    this.toggleResumeSelection(resume.id);
                } else if (!this.multiSelectMode) {
                    window.location.href = `resume-details.html?id=${resume.id}`;
                }
            };

            const scoreBg = resume.score >= 90 ? 'bg-green-100 text-green-800' : 
                           (resume.score >= 80 ? 'bg-blue-100 text-blue-800' : 
                           (resume.score >= 60 ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-800'));
            
            const statusText = resume.score >= 90 ? '优秀' : 
                              (resume.score >= 80 ? '良好' : 
                              (resume.score >= 60 ? '一般' : '待评估'));

            let checkboxHtml = '';
            if (this.multiSelectMode) {
                checkboxHtml = `
                    <div class="flex-shrink-0 mr-4">
                        <input type="checkbox" ${isSelected ? 'checked' : ''} 
                               class="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
                               onclick="event.stopPropagation(); filterManager.toggleResumeSelection(${resume.id})">
                    </div>
                `;
            }

            item.innerHTML = `
                <div class="flex items-center justify-between p-6">
                    <div class="flex items-center space-x-4">
                        ${checkboxHtml}
                        <div class="flex-shrink-0">
                            <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                                <i class="fas fa-file-alt text-blue-600 text-xl"></i>
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center space-x-2">
                                <h4 class="text-lg font-medium text-gray-900">${resume.name}</h4>
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${scoreBg}">
                                    ${statusText}
                                </span>
                            </div>
                            <div class="mt-1 flex items-center space-x-4 text-sm text-gray-500">
                                <span><i class="fas fa-calendar mr-1"></i>${resume.experience}年经验</span>
                                <span><i class="fas fa-map-marker-alt mr-1"></i>北京</span>
                                <span><i class="fas fa-graduation-cap mr-1"></i>${resume.education}</span>
                                <span><i class="fas fa-clock mr-1"></i>更新于 ${resume.lastUpdated}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="text-right">
                            <div class="text-lg font-semibold text-blue-600">${resume.score}分</div>
                            <div class="text-xs text-gray-500">匹配度</div>
                        </div>
                        <div class="flex flex-col space-y-2">
                            <button class="text-blue-600 hover:text-blue-800 text-sm" onclick="event.stopPropagation(); window.location.href='resume-details.html?id=${resume.id}'">
                                <i class="fas fa-eye mr-1"></i>查看
                            </button>
                            <button class="text-blue-600 hover:text-blue-800 text-sm" onclick="event.stopPropagation(); filterManager.analyzeResume(${resume.id})">
                                <i class="fas fa-chart-line mr-1"></i>分析
                            </button>
                        </div>
                    </div>
                </div>
            `;
            return item;
        }

        getScoreClass(score) {
            if (score >= 90) return 'score-excellent';
            if (score >= 80) return 'score-good';
            if (score >= 60) return 'score-average';
            return 'score-poor';
        }

        renderPagination() {
            const pageCount = Math.ceil(this.filteredResumes.length / this.itemsPerPage);
            if (pageCount <= 1) return;

            this.paginationContainer.appendChild(this.createPageButton(this.currentPage - 1, '«', this.currentPage > 1));

            for (let i = 1; i <= pageCount; i++) {
                if (i === this.currentPage) {
                    this.paginationContainer.appendChild(this.createPageButton(i, i, true, true));
                } else if (i === 1 || i === pageCount || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
                    this.paginationContainer.appendChild(this.createPageButton(i, i));
                } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
                    const dots = document.createElement('span');
                    dots.className = 'px-4 py-2 text-gray-400';
                    dots.textContent = '...';
                    this.paginationContainer.appendChild(dots);
                }
            }

            this.paginationContainer.appendChild(this.createPageButton(this.currentPage + 1, '»', this.currentPage < pageCount));
        }

        createPageButton(page, text, enabled = true, active = false) {
            const button = document.createElement('button');
            button.textContent = text;
            let classes = 'w-8 h-8 mx-1 rounded-lg text-sm font-medium transition-all flex items-center justify-center ';
            
            if (active) {
                classes += 'bg-blue-600 text-white shadow-md';
            } else if (enabled) {
                classes += 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 hover:text-blue-600';
            } else {
                classes += 'bg-gray-50 text-gray-300 cursor-not-allowed';
            }
            
            button.className = classes;
            if (enabled && !active) {
                button.onclick = () => this.renderPage(page);
            }
            return button;
        }

        updateCounts() {
            this.totalResumesCount.textContent = this.allResumes.length;
            this.excellentResumesCount.textContent = this.allResumes.filter(r => r.score >= 90).length;
            this.passedScreeningCount.textContent = this.allResumes.filter(r => r.score >= 60).length;
            this.pendingResumesCount.textContent = this.allResumes.filter(r => r.status === 'pending').length;
            this.updateFilteredCount();
        }

        updateFilteredCount() {
            this.filteredCountBadge.textContent = this.filteredResumes.length;
        }
    }

    window.filterManager = null;

    function batchAnalysis() {
        if (window.resumeFilterManager && window.resumeFilterManager.filteredResumes.length === 0) {
            alert('当前没有可分析的简历');
            return;
        }
        
        const count = window.resumeFilterManager ? window.resumeFilterManager.filteredResumes.length : 0;
        if (confirm(`确定要对当前筛选的 ${count} 份简历进行批量分析吗？`)) {
            console.log('批量分析简历:', count);
            alert(`开始批量分析 ${count} 份简历`);
        }
    }
  </script>
    <script src="/js/header-profile.js"></script>

</body>
</html>
