<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人才库 - 争湃·简历大师</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script src="../js/tailwindcss.js"></script>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/css/design-system.css">
  <script src="../js/user-auth.js"></script>
  <script src="../js/resume-data.js?v=2"></script>
  <script src="../js/resume-upload-handler.js"></script>
  <link rel="stylesheet" href="/css/sidebar.css">
  <style>
    /* 基础样式 */
    :root {
    }
    body {
    }
    
    .tag-pill {
      transition: all 0.2s ease;
    }
    .tag-pill:hover {
      transform: translateY(-1px);
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up {
      animation: fadeInUp 0.5s ease forwards;
    }

    /* 列表视图样式 */
    .resume-list-container {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .resume-list-item {
      display: flex;
      align-items: center;
      padding: 1.5rem;
      border-bottom: 1px solid #f3f4f6;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .resume-list-item:hover {
      background-color: #f9fafb;
    }

    .resume-list-item:last-child {
      border-bottom: none;
    }

    .resume-list-avatar {
      width: 3rem;
      height: 3rem;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 1rem;
    }

    .resume-list-info {
      flex: 1;
      min-width: 0;
    }

    .resume-list-name {
      font-weight: 600;
      color: #111827;
      font-size: 1rem;
    }

    .resume-list-position {
      color: #2563eb;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .resume-list-meta {
      display: flex;
      gap: 1.5rem;
      color: #6b7280;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }



    .resume-list-score {
      text-align: center;
      min-width: 4rem;
    }

    .resume-list-score-value {
      font-size: 1.125rem;
      font-weight: 600;
      color: #2563eb;
    }

    .resume-list-score-label {
      font-size: 0.75rem;
      color: #9ca3af;
    }

    .resume-list-actions {
      display: flex;
      gap: 0.5rem;
      margin-left: 1rem;
    }

    .resume-list-action-btn {
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }

    .resume-list-action-btn:hover {
      transform: translateY(-1px);
    }
    
    .resume-list-action-btn:active {
      transform: translateY(0);
      filter: brightness(0.9);
    }

    /* 按钮点击交互优化 */
    .btn-interactive {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-interactive:active {
      transform: scale(0.95);
      filter: brightness(0.9);
    }

    .resume-list-action-btn.view {
      background-color: #2563eb;
      color: white;
    }

    .resume-list-action-btn.view:hover {
      background-color: #1d4ed8;
    }

    .resume-list-action-btn.analyze {
      background-color: #dbeafe;
      color: #1e40af;
    }

    .resume-list-action-btn.analyze:hover {
      background-color: #bfdbfe;
    }

    .resume-list-action-btn.favorite {
      background-color: #fef3c7;
      color: #92400e;
    }

    .resume-list-action-btn.favorite:hover {
      background-color: #fde68a;
    }

    /* 视图切换状态 */
    .view-grid .resume-cards-container {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
    }

    @media (min-width: 768px) {
      .view-grid .resume-cards-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .view-grid .resume-cards-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .view-list .resume-cards-container {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    /* 进度条样式 */
    .progress-bar-container {
      height: 6px;
      background-color: #f3f4f6;
      border-radius: 3px;
      overflow: hidden;
      width: 100%;
      min-width: 60px;
    }
    .progress-bar-fill {
      height: 100%;
      background-color: #2563eb;
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    /* Tooltip 样式 */
    .tooltip {
      position: relative;
    }
    .tooltip::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #111827;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      z-index: 50;
    }
    .tooltip:hover::after {
      opacity: 1;
      visibility: visible;
    }
    .brand-title { white-space: normal !important; }
  </style>
</head>
<body class="bg-gray-50 antialiased text-gray-900 selection:bg-blue-100 selection:text-blue-700">
  
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed left-0 top-0 bottom-0 sidebar-modern z-40"></aside>
  
  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 bg-white/80 backdrop-blur-md border-b border-gray-100 z-20 h-20">
    <div class="max-w-[1440px] mx-auto flex items-center justify-between px-4 h-full">
      <div class="flex items-center space-x-4 pl-8">
        <div class="brand-title flex flex-col justify-center space-y-1.5">
          <h1 class="text-lg font-bold text-gray-900 leading-none">人才库</h1>
          <p class="text-xs text-gray-500 font-medium leading-tight">集中管理您的所有人才资源，高效筛选与跟进。</p>
        </div>
      </div>
      <div class="flex items-center space-x-4" id="header-right-section"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content p-6" id="main-content">
    <div class="max-w-[1440px] mx-auto">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
        <div></div>
        <div class="flex gap-3">
            <button onclick="batchScoring()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl shadow-md shadow-blue-200 transition-all hover:shadow-lg flex items-center text-sm font-bold btn-interactive">
              <i class="fas fa-star mr-2"></i> 批量初筛
            </button>
            <input id="libraryUploadInput" type="file" accept=".pdf,.doc,.docx,.txt" class="hidden" />
            <button onclick="openLibraryUploadModal()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl shadow-md shadow-blue-200 transition-all hover:shadow-lg flex items-center text-sm font-bold">
              <i class="fas fa-plus mr-2"></i> 导入简历文件
            </button>
            <button onclick="openLibraryEmailModal()" class="px-5 py-2.5 bg-white border border-blue-600 text-blue-600 hover:bg-blue-50 rounded-2xl shadow-md transition-all flex items-center text-sm font-bold">
              <i class="fas fa-envelope mr-2"></i> 从邮箱导入
            </button>
        </div>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
        <!-- Total -->
        <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 relative overflow-hidden group cursor-pointer" onclick="window.location.reload()">
          <div class="absolute right-0 top-0 w-24 h-24 bg-blue-50 rounded-bl-full -mr-4 -mt-4 opacity-50 transition-transform group-hover:scale-110"></div>
          <div class="relative z-10">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xl group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                    <i class="fas fa-users"></i>
                </div>
            </div>
            <p class="text-sm font-medium text-gray-500 mb-1">总简历数</p>
            <h3 id="total-resumes-count" class="text-3xl font-bold text-gray-900 tracking-tight">0</h3>
          </div>
        </div>

        <!-- Pending -->
        <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 relative overflow-hidden group">
           <div class="absolute right-0 top-0 w-24 h-24 bg-blue-50 rounded-bl-full -mr-4 -mt-4 opacity-50 transition-transform group-hover:scale-110"></div>
           <div class="relative z-10">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xl group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                    <i class="fas fa-clock"></i>
                </div>
            </div>
            <p class="text-sm font-medium text-gray-500 mb-1">待处理简历</p>
            <h3 id="pending-resumes-count" class="text-3xl font-bold text-gray-900 tracking-tight">0</h3>
          </div>
        </div>

        <!-- Excellent -->
        <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 relative overflow-hidden group">
           <div class="absolute right-0 top-0 w-24 h-24 bg-blue-50 rounded-bl-full -mr-4 -mt-4 opacity-50 transition-transform group-hover:scale-110"></div>
           <div class="relative z-10">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xl group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                    <i class="fas fa-star"></i>
                </div>
            </div>
            <p class="text-sm font-medium text-gray-500 mb-1">优秀人才 (90+)</p>
            <h3 id="excellent-resumes-count" class="text-3xl font-bold text-gray-900 tracking-tight">0</h3>
          </div>
        </div>

        <!-- Passed Initial Screening -->
        <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 relative overflow-hidden group">
           <div class="absolute right-0 top-0 w-24 h-24 bg-blue-50 rounded-bl-full -mr-4 -mt-4 opacity-50 transition-transform group-hover:scale-110"></div>
           <div class="relative z-10">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xl group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                    <i class="fas fa-check-circle"></i>
                </div>
            </div>
            <p class="text-sm font-medium text-gray-500 mb-1">通过初筛</p>
            <h3 id="passed-screening-count" class="text-3xl font-bold text-gray-900 tracking-tight">0</h3>
          </div>
        </div>
      </div>

      <!-- Main Filter & List Area -->
      <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
        <!-- Top Filter Bar -->
        <div class="p-4 border-b border-gray-100 bg-white">
          <div class="flex flex-col lg:flex-row items-center gap-3 mb-4">
            <div class="relative flex-1 group w-full">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fas fa-search text-gray-400 group-focus-within:text-blue-600 transition-colors text-sm"></i>
              </div>
              <input type="text" id="search-box" placeholder="搜索候选人姓名、职位..." 
                     class="w-full pl-9 pr-3 py-2 bg-gray-50/50 border border-gray-100 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-500 focus:bg-white transition-all text-xs font-bold text-gray-700 shadow-sm placeholder-gray-400">
            </div>
            
            <div class="flex items-center gap-2 justify-end w-full lg:w-auto overflow-x-auto no-scrollbar">
              <div class="relative min-w-[140px] flex-shrink-0">
                <select id="sort-filter" class="w-full pl-3 pr-8 py-2 bg-white border border-gray-200 rounded-xl text-xs font-bold text-gray-700 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-500 transition-all appearance-none cursor-pointer shadow-sm">
                  <option value="date_desc">最新上传</option>
                  <option value="score_desc">分数：高到低</option>
                  <option value="score_asc">分数：低到高</option>
                </select>
                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                  <i class="fas fa-chevron-down text-[10px]"></i>
                </div>
              </div>

              <button id="filter-toggle-btn" class="px-3 py-2 bg-white border border-gray-200 text-gray-700 rounded-xl text-xs font-bold hover:bg-gray-50 hover:border-gray-300 transition-all flex items-center shadow-sm whitespace-nowrap flex-shrink-0">
                <i class="fas fa-sliders-h mr-1.5 text-blue-500"></i> 筛选器
              </button>

              <label class="flex items-center px-3 py-2 bg-white border border-gray-200 rounded-xl cursor-pointer hover:bg-green-50 hover:border-green-200 group transition-all shadow-sm whitespace-nowrap flex-shrink-0">
                  <input type="checkbox" id="show-hired-only" class="w-3.5 h-3.5 rounded border-gray-300 text-green-600 focus:ring-green-500 transition-all">
                  <span class="ml-1.5 text-xs font-bold text-gray-600 group-hover:text-green-600 transition-colors flex items-center">
                      <i class="fas fa-user-check text-[10px] mr-1"></i>已录用
                  </span>
              </label>

              <label class="flex items-center px-3 py-2 bg-white border border-gray-200 rounded-xl cursor-pointer hover:bg-red-50 hover:border-red-200 group transition-all shadow-sm whitespace-nowrap flex-shrink-0">
                  <input type="checkbox" id="show-auto-rejected-only" class="w-3.5 h-3.5 rounded border-gray-300 text-red-600 focus:ring-red-500 transition-all">
                  <span class="ml-1.5 text-xs font-bold text-gray-600 group-hover:text-red-600 transition-colors flex items-center">
                      <i class="fas fa-robot text-[10px] mr-1"></i>自动淘汰池
                  </span>
              </label>

              <button id="multi-select-btn" class="px-3 py-2 bg-white text-gray-700 border border-gray-200 rounded-xl text-xs font-bold hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 transition-all flex items-center shadow-sm group whitespace-nowrap flex-shrink-0">
                <i class="fas fa-check-square mr-1.5 text-gray-400 group-hover:text-blue-600"></i> 多选
              </button>

              <div class="flex items-center p-1 bg-gray-100 rounded-xl border border-gray-200 shadow-inner flex-shrink-0">
                <button id="view-list-btn" class="p-1 rounded-lg bg-white text-blue-600 shadow-sm transition-all" title="列表视图">
                  <i class="fas fa-list text-xs"></i>
                </button>
                <button id="view-grid-btn" class="p-1 rounded-lg text-gray-400 hover:text-gray-600 transition-all" title="卡片视图">
                  <i class="fas fa-th-large text-xs"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Multi-select Action Bar -->
          <div id="multi-select-bar" class="hidden mb-4 p-4 bg-blue-50 border border-blue-200 rounded-lg flex items-center justify-between">
            <div class="flex items-center gap-4">
              <span class="text-sm font-medium text-blue-900">已选择 <span id="selected-count" class="font-bold text-blue-600">0</span> 份简历</span>
              <button onclick="filterManager.selectAllOnPage()" class="text-sm text-blue-600 hover:text-blue-800 font-medium">
                <i class="fas fa-check-double mr-1"></i>全选本页
              </button>
              <button onclick="filterManager.deselectAll()" class="text-sm text-blue-600 hover:text-blue-800 font-medium">
                <i class="fas fa-times mr-1"></i>取消选择
              </button>
            </div>
            <div class="flex items-center gap-4">
              <button id="batch-score-btn" onclick="filterManager.batchScoreSelected()" class="text-sm text-blue-600 hover:text-blue-800 font-medium">
                <i class="fas fa-star mr-1"></i>批量初筛
              </button>
              <button onclick="filterManager.batchRejectSelected(event)" class="text-sm text-orange-600 hover:text-orange-800 font-medium">
                <i class="fas fa-ban mr-1"></i>批量淘汰
              </button>
              <button onclick="filterManager.batchDeleteSelected()" class="text-sm text-red-600 hover:text-red-800 font-medium">
                <i class="fas fa-trash mr-1"></i>批量删除
              </button>
            </div>
          </div>

          <!-- Advanced Filters (Hidden) -->
          <div id="advanced-filters" class="hidden mt-6 pb-6 border-b border-gray-100 grid grid-cols-1 md:grid-cols-4 gap-6 animate-fade-in">
            <div>
              <label class="block text-xs font-black text-gray-400 uppercase tracking-wider mb-2">综合评分</label>
              <div class="flex items-center gap-3">
                <input type="range" id="score-range" min="0" max="100" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                <span id="score-value" class="text-sm font-bold text-blue-600 min-w-[2.5rem]">0+</span>
              </div>
            </div>
            <div>
              <label class="block text-xs font-black text-gray-400 uppercase tracking-wider mb-2">工作经验</label>
              <select id="work-experience" class="block w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm font-black text-gray-700 focus:ring-2 focus:ring-blue-100 transition-all appearance-none cursor-pointer">
                <option value="any">不限</option>
                <option value="0-1">1年以下</option>
                <option value="1-3">1-3年</option>
                <option value="3-5">3-5年</option>
                <option value="5-10">5-10年</option>
                <option value="10+">10年以上</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-black text-gray-400 uppercase tracking-wider mb-2">学历要求</label>
              <select id="education-level" class="block w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm font-black text-gray-700 focus:ring-2 focus:ring-blue-100 transition-all appearance-none cursor-pointer">
                <option value="any">不限</option>
                <option value="bachelor">本科</option>
                <option value="master">硕士</option>
                <option value="doctor">博士</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-black text-gray-400 uppercase tracking-wider mb-2">精准职位</label>
              <input type="text" id="job-title-filter" placeholder="输入职位名称..." class="block w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm font-black text-gray-700 focus:ring-2 focus:ring-blue-100 transition-all">
            </div>
          </div>

          <!-- Quick Filters -->
          <div class="space-y-4">
            <div id="role-filters" class="flex flex-wrap gap-2 items-center">
              <span class="text-xs font-bold text-gray-400 uppercase tracking-wider mr-2">职位</span>
              <button class="role-filter active px-3 py-1.5 text-xs font-medium rounded-xl transition-all bg-gray-900 text-white shadow-md" data-role="all">全部</button>
              <button class="role-filter px-3 py-1.5 text-xs font-medium rounded-xl transition-all bg-white text-gray-600 border border-gray-200 hover:border-gray-300 hover:bg-gray-50" data-role="产品经理">产品经理</button>
              <button class="role-filter px-3 py-1.5 text-xs font-medium rounded-xl transition-all bg-white text-gray-600 border border-gray-200 hover:border-gray-300 hover:bg-gray-50" data-role="前端工程师">前端工程师</button>
              <button class="role-filter px-3 py-1.5 text-xs font-medium rounded-xl transition-all bg-white text-gray-600 border border-gray-200 hover:border-gray-300 hover:bg-gray-50" data-role="后端工程师">后端工程师</button>
              <button class="role-filter px-3 py-1.5 text-xs font-medium rounded-xl transition-all bg-white text-gray-600 border border-gray-200 hover:border-gray-300 hover:bg-gray-50" data-role="测试工程师">测试工程师</button>
              <button class="role-filter px-3 py-1.5 text-xs font-medium rounded-xl transition-all bg-white text-gray-600 border border-gray-200 hover:border-gray-300 hover:bg-gray-50" data-role="数据分析师">数据分析师</button>
            </div>
             <div class="hidden"><button class="category-filter active" data-category="all" style="display:none"></button></div>
          </div>
        </div>

        <!-- Resume Grid -->
        <div class="p-6 bg-gray-50/30 min-h-[500px]">
          <div id="resume-cards-container" class="flex flex-col gap-0"></div>
          
          <!-- States -->
          <div id="loading-indicator" class="text-center py-12 hidden">
            <i class="fas fa-circle-notch fa-spin text-3xl text-blue-500 mb-3"></i>
            <p class="text-gray-500 text-sm">正在加载简历数据...</p>
          </div>
          
          <div id="empty-state" class="text-center py-20 hidden flex flex-col items-center justify-center">
            <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-4">
              <i class="fas fa-search text-4xl text-gray-400"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">未找到匹配的简历</h3>
            <p class="text-gray-500 max-w-sm mx-auto">尝试调整筛选条件，或者使用更通用的关键词进行搜索。</p>
            <button onclick="window.location.reload()" class="mt-6 px-6 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm font-medium">
              重置所有筛选
            </button>
          </div>
          
          <div id="pagination-container" class="flex justify-center mt-10"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/sidebar.js"></script>
  <script src="../js/resume-upload-modal.js"></script>
  <script>
    // 统一初始化 - 确保正确的初始化顺序
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. 首先初始化侧边栏
      try {

      function generateInitialAvatar(name) {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 64;
          canvas.height = 64;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#E5E7EB';
          ctx.fillRect(0, 0, 64, 64);
          ctx.fillStyle = '#111827';
          ctx.font = 'bold 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText((name || '?').charAt(0).toUpperCase(), 32, 32);
          return canvas.toDataURL();
        } catch (e) {
          return '';
        }
      }

      function normalizeResumes(arr){
      function fmtDate(iso){ try{ var d=new Date(iso); var diff=Math.ceil((Date.now()-d.getTime())/(1000*60*60*24)); if(diff<=1) return '今天'; if(diff<=7) return diff+'天前'; if(diff<=30) return Math.floor(diff/7)+'周前'; return d.toISOString().slice(0,10); }catch(_){ return '—' } }
      var out=[]; for(var i=0;i<arr.length;i++){
        var r=arr[i]||{}; var pd=r.parsed_data||{};
        var name = pd.name || String(r.file_name||'未知').replace(/\.[^/.]+$/,'');
        // 优先使用关联职位(associated_job_title)
        var associatedPos = r.associated_job_title;
        var parsedPos = r.job_title || pd.jobTitle || pd.position || '';
        
        // 用户要求：此处显示关联的“职位管理”中的职位
        // 如果没有关联职位，显示“未关联职位”，而不是简历解析出的当前职位
        var pos = associatedPos || '未关联职位';
        var isAssociated = !!associatedPos;
        
        var score = (typeof r.score==='number') ? r.score : ((typeof r.overall_score==='number') ? r.overall_score : 0);
        var exp = (typeof pd.experience_years==='number') ? pd.experience_years : '—';
        var edu = (pd.education && pd.education[0] && pd.education[0].degree) ? pd.education[0].degree : '—';
        var last = fmtDate(r.upload_date||Date.now());
        out.push({ 
            id: r.id || (i+1), 
            name:name, 
            position:pos, 
            isAssociated: isAssociated,
            parsedPosition: parsedPos, // 保留解析职位以备他用（如详情页）
            score:score, 
            experience:exp, 
            education:edu, 
            avatar: generateInitialAvatar(name), 
            lastUpdated:last, 
            status: r.status || 'uploaded',
            recruitment_status: r.recruitment_status || '投递',
            auto_rejected: r.auto_rejected,
            rejection_reason: r.rejection_reason
        });
      }
      return out;
    }

        async loadJobFilters() {
            try {
                const jobContainer = document.getElementById('role-filters');
                if (!jobContainer) return;
                
                // Keep the static "All" button and title
                const allBtn = jobContainer.querySelector('[data-role="all"]');
                const titleSpan = jobContainer.querySelector('span');
                
                // Clear container but save references
                jobContainer.innerHTML = '';
                if (titleSpan) jobContainer.appendChild(titleSpan);
                
                // Re-append "All" button and ensure listener
                if (allBtn) {
                    jobContainer.appendChild(allBtn);
                    // Re-attach listener as it might be lost if innerHTML was cleared differently or just to be safe
                    allBtn.onclick = (e) => {
                         document.querySelectorAll('.role-filter').forEach(b => {
                            b.classList.remove('active', 'bg-gray-900', 'text-white');
                            b.classList.add('bg-white', 'text-gray-600', 'border-gray-200');
                        });
                        e.target.classList.remove('bg-white', 'text-gray-600', 'border-gray-200');
                        e.target.classList.add('active', 'bg-gray-900', 'text-white');
                        this.jobTitleFilter.value = '';
                        this.checkAutoScreeningStatus('');
                        this.filterAndRender();
                    };
                }
                
                // Fetch jobs from API
                const jobs = await window.resumeDataManager.getAllJobs();
                
                if (Array.isArray(jobs) && jobs.length > 0) {
                    jobs.forEach(job => {
                        const btn = document.createElement('button');
                        btn.className = 'role-filter px-3 py-1.5 text-xs font-medium rounded-xl transition-all bg-white text-gray-600 border border-gray-200 hover:border-gray-300 hover:bg-gray-50';
                        btn.dataset.role = job.title; 
                        btn.textContent = job.title;
                        
                        btn.onclick = (e) => {
                            // Reset all active states
                            document.querySelectorAll('.role-filter').forEach(b => {
                                b.classList.remove('active', 'bg-gray-900', 'text-white');
                                b.classList.add('bg-white', 'text-gray-600', 'border-gray-200');
                            });
                            
                            // Set current active
                            e.target.classList.remove('bg-white', 'text-gray-600', 'border-gray-200');
                            e.target.classList.add('active', 'bg-gray-900', 'text-white');
                            
                            // Update filter
                            this.jobTitleFilter.value = e.target.dataset.role === 'all' ? '' : e.target.dataset.role;
                            
                            // Check auto-screening status
                            this.checkAutoScreeningStatus(this.jobTitleFilter.value);
                            
                            this.filterAndRender();
                        };
                        
                        jobContainer.appendChild(btn);
                    });
                }

                console.error('Failed to load job filters:', error);

        /**
         * 检查职位是否开启了自动初筛，并控制批量初筛按钮显示
         * @param {string} jobTitle 
         */
        async checkAutoScreeningStatus(jobTitle) {
            if (!jobTitle) {
                if (this.batchScoreBtn) this.batchScoreBtn.classList.remove('hidden');
                return;
            }

            try {
                // 获取所有职位并查找匹配的职位
                const jobs = await window.resumeDataManager.getAllJobs();
                const matchedJob = jobs.find(j => j.title === jobTitle || (j.parsed_data && j.parsed_data.jobTitle === jobTitle));
                
                if (matchedJob && matchedJob.enable_auto_screening) {
                    // 如果开启了自动初筛，隐藏批量初筛按钮
                    if (this.batchScoreBtn) this.batchScoreBtn.classList.add('hidden');
                } else {
                    // 否则显示批量初筛按钮
                    if (this.batchScoreBtn) this.batchScoreBtn.classList.remove('hidden');
                }
            } catch (error) {
                console.error('检查职位自动初筛状态失败:', error);
                // 发生错误时默认显示，确保功能可用
                if (this.batchScoreBtn) this.batchScoreBtn.classList.remove('hidden');
            }
        }

        async batchRejectSelected(e) {
            if (this.selectedResumes.size === 0) {
                alert('请先选择要淘汰的简历');
                return;
            }
            
            if (confirm(`确定要淘汰选中的 ${this.selectedResumes.size} 份简历吗？`)) {
                const ids = Array.from(this.selectedResumes);
                let successCount = 0;
                let failCount = 0;

                // 获取按钮元素
                const btn = e ? (e.target.closest('button') || e.target) : null;
                const originalHtml = btn ? btn.innerHTML : '';
                if (btn) {
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>处理中...';
                    btn.disabled = true;
                }

                try {
                    // 并行处理以提高速度
                    const promises = ids.map(id => 
                        window.resumeDataManager.updateResumeRecruitmentStatus(id, '淘汰')
                            .then(success => success ? 1 : 0)
                            .catch(e => {
                                console.error(`淘汰简历 ${id} 失败:`, e);
                                return 0;
                            })
                    );

                    const results = await Promise.all(promises);
                    successCount = results.reduce((a, b) => a + b, 0);
                    failCount = ids.length - successCount;

                    // 使用 ui.showNotification 如果可用，否则用 alert
                    if (window.ui && typeof window.ui.showNotification === 'function') {
                        window.ui.showNotification(`批量淘汰完成: 成功 ${successCount} 份，失败 ${failCount} 份`, successCount > 0 ? 'success' : 'error');
                    } else {
                        alert(`批量淘汰完成: 成功 ${successCount} 份，失败 ${failCount} 份`);
                    }
                } catch (error) {
                    console.error('批量淘汰过程出错:', error);
                    if (window.ui && typeof window.ui.showNotification === 'function') {
                        window.ui.showNotification('批量淘汰过程出错', 'error');
                    } else {
                        alert('批量淘汰过程出错');
                    }
                } finally {
                    if (btn) {
                        btn.innerHTML = originalHtml;
                        btn.disabled = false;
                    }
                    this.selectedResumes.clear();
                    this.updateSelectedCount();
                    // 必须调用 fetchResumes 获取最新状态，或者直接在本地更新状态后重新渲染
                    await this.fetchResumes(); 
                    this.filterAndRender();
                }
            }
        }

        async fetchResumes() {
            try {
                this.loadingIndicator.classList.remove('hidden');
                this.cardsContainer.classList.add('hidden');
                this.emptyState.classList.add('hidden');
                
                const token = (JSON.parse(localStorage.getItem('userInfo') || '{}').token) || null;
                const headers = token ? { Authorization: 'Bearer ' + token } : {};

                // 并行获取简历和解析记录，独立处理错误
                const resumePromise = this.fetchResumeData().catch(e => {
                    console.error('Fetch resumes failed:', e);
                    return [];
                });
                
                const analysisPromise = fetch('/api/ai/records', { headers })
                    .then(r => {
                        if (!r.ok) throw new Error(`Status ${r.status}`);
                        return r.json();
                    })
                    .catch(e => {
                        console.error('Fetch analysis records failed:', e);
                        return { success: false, data: [] };
                    });

                const [resumeResult, analysisResult] = await Promise.all([resumePromise, analysisPromise]);
                
                let data = Array.isArray(resumeResult) ? resumeResult : [];
                this.analysisRecords = (analysisResult && analysisResult.success) ? analysisResult.data : [];
                
                // 更新本地数据
                if (Array.isArray(data)) {
                    this.allResumes = normalizeResumes(data);
                    window.resumeData = data;
                    // 更新统计信息
                    this.updateCounts();
                }
                
                return data;
            } catch (error) {
                console.error('获取简历数据失败:', error);
                return this.allResumes; // 如果获取失败，返回现有数据
            }
        }

        async fetchResumeData() {
            if (window.resumeDataManager && typeof window.resumeDataManager.getTalentPoolResumes === 'function') {
                return await window.resumeDataManager.getTalentPoolResumes();
            } else if (window.resumeDataManager && typeof window.resumeDataManager.apiRequest === 'function') {
                const result = await window.resumeDataManager.apiRequest('/library/resumes', 'GET', null, true);
                return (result && result.data) ? result.data : [];
            }
            return [];
        }

        async filterAndRender() {
            this.loadingIndicator.classList.remove('hidden');
            this.cardsContainer.classList.add('hidden');
            this.emptyState.classList.add('hidden');
            
            try {
                // 先获取最新数据
                await this.fetchResumes();
                
                // 然后应用过滤器和渲染
                this.applyFilters();
                this.renderPage(1);
            } catch (error) {
                console.error('筛选和渲染失败:', error);
            } finally {
                this.loadingIndicator.classList.add('hidden');
                this.cardsContainer.classList.remove('hidden');
            }
        }

        applyFilters() {
            const searchTerm = this.searchBox.value.toLowerCase();
            const activeCategory = document.querySelector('.category-filter.active') ? document.querySelector('.category-filter.active').dataset.category : 'all';
            const minScore = parseInt(this.scoreRange.value);
            const exp = this.workExperience.value;
            const edu = this.educationLevel.value;
            const jobTitle = this.jobTitleFilter.value.toLowerCase();
            const showAutoRejected = this.autoRejectedFilter ? this.autoRejectedFilter.checked : false;
            const showHired = this.hiredFilter ? this.hiredFilter.checked : false;

            this.filteredResumes = this.allResumes.filter(resume => {
                const name = (resume.name || '').toLowerCase();
                const position = (resume.position || '').toLowerCase();
                const nameMatch = name.includes(searchTerm);
                const positionMatch = position.includes(searchTerm);
                const searchMatch = nameMatch || positionMatch;
                
                const categoryMatch = activeCategory === 'all' || resume.status === activeCategory;
                const scoreMatch = (resume.score || 0) >= minScore;
                const expMatch = exp === 'any' || this.matchExperience(resume.experience, exp);
                const eduMatch = edu === 'any' || (resume.education || '').toLowerCase().startsWith(edu);
                const jobTitleMatch = !jobTitle || position.includes(jobTitle);

                // 状态判断
                const statusStr = String(resume.recruitment_status || '').toLowerCase();
                const isRejected = statusStr === '淘汰' || statusStr === 'rejected' || statusStr === '已淘汰' || statusStr === '放弃';
                const isHired = statusStr === 'hired' || statusStr === 'offer' || statusStr === '入职' || statusStr === '已入职' || statusStr === '已录用';
                
                // 过滤逻辑：
                // 1. 如果勾选了“已录用”，只显示已录用的
                // 2. 如果勾选了“自动淘汰池”，只显示已淘汰的
                // 3. 如果都没勾选，显示正常的（非录用、非淘汰）
                let statusMatch = false;
                if (showHired) {
                    statusMatch = isHired;
                } else if (showAutoRejected) {
                    statusMatch = isRejected;
                } else {
                    statusMatch = !isRejected && !isHired;
                }

                return searchMatch && categoryMatch && scoreMatch && expMatch && eduMatch && jobTitleMatch && statusMatch;
            });
            
            console.log(`过滤完成: 全部 ${this.allResumes.length} 份, 过滤后 ${this.filteredResumes.length} 份, 模式: ${showHired ? '已录用' : (showAutoRejected ? '淘汰池' : '活跃')}`);

            // Apply Sort
            const sortVal = this.sortFilter ? this.sortFilter.value : 'date_desc';
            this.filteredResumes.sort((a, b) => {
                if (sortVal === 'score_desc') return (b.score || 0) - (a.score || 0);
                if (sortVal === 'score_asc') return (a.score || 0) - (b.score || 0);
                // Default date desc
                return new Date(b.uploadDate || 0) - new Date(a.uploadDate || 0);
            });

            this.updateFilteredCount();
        }

        matchExperience(resumeExp, filterExp) {
            const resumeExpNum = parseInt(resumeExp);
            if (isNaN(resumeExpNum)) return false;
            if (filterExp === '0-1') return resumeExpNum < 1;
            if (filterExp === '1-3') return resumeExpNum >= 1 && resumeExpNum <= 3;
            if (filterExp === '3-5') return resumeExpNum > 3 && resumeExpNum <= 5;
            if (filterExp === '5-10') return resumeExpNum > 5 && resumeExpNum <= 10;
            if (filterExp === '10+') return resumeExpNum > 10;
            return false;
        }

        renderPage(page) {
            this.currentPage = page;
            this.cardsContainer.innerHTML = '';
            this.paginationContainer.innerHTML = '';

            if (this.filteredResumes.length === 0) {
                this.emptyState.classList.remove('hidden');
                return;
            }

            const start = (page - 1) * this.itemsPerPage;
            const end = start + this.itemsPerPage;
            const paginatedItems = this.filteredResumes.slice(start, end);

            paginatedItems.forEach(resume => {
                const card = this.createResumeCard(resume);
                this.cardsContainer.appendChild(card);
            });

            this.renderPagination();
        }

        async rejectResume(resumeId) {
            if (!confirm('确定要淘汰这份简历吗？')) return;
            
            try {
                // 1. 更新简历表状态 (使用中文 ENUM: '淘汰')
            const success = await window.resumeDataManager.updateResumeRecruitmentStatus(resumeId, '淘汰');
                
                if (success) {
                    // 2. 尝试同步更新候选人关联记录 (ResumeJob)
                    // 由于目前前端没有直接关联的 ResumeJob ID，且库里可能有多条投递记录
                    // 我们尝试获取该简历的所有投递记录并批量更新为 'rejected'
                    try {
                        // 使用新的 API 路径获取该简历的所有投递记录并批量更新为 'rejected'
                        const appsResponse = await window.resumeDataManager.apiRequest(`/recruitment/candidates/list?resume_id=${resumeId}`);

                    if (window.ui && typeof window.ui.showNotification === 'function') {
                        window.ui.showNotification('已成功淘汰', 'success');

                    this.filterAndRender();

                        <div class="flex items-center text-sm text-gray-500 group-hover:text-gray-700 transition-colors">
                            <i class="far fa-clock w-5 text-gray-400"></i>
                            <span class="truncate text-xs">更新于 ${resume.lastUpdated}</span>
                        </div>
                    </div>
                `;
            }

            const actionHtml = `
                <div class="flex gap-2">
                    <button class="flex-1 py-2 text-center text-xs font-semibold text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-lg transition-all" onclick="event.stopPropagation(); window.location.href='resume-details.html?id=${resume.id}'">
                        查看简历
                    </button>
                    ${resume.recruitment_status === '淘汰' ? `
                    <button class="flex-1 py-2 text-center text-xs font-semibold text-green-600 bg-green-50 hover:bg-green-100 rounded-lg transition-all" onclick="event.stopPropagation(); filterManager.updateStatus(${resume.id}, '投递')">
                        恢复
                    </button>
                    ` : `
                    <button class="flex-1 py-2 text-center text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-all" onclick="event.stopPropagation(); filterManager.rejectResume(${resume.id})">
                        淘汰
                    </button>
                    `}
                </div>
            `;

            card.innerHTML = `
                ${checkboxHtml}
                <div class="absolute top-0 right-0 z-20">
                    <div class="px-3 py-1.5 rounded-bl-2xl text-xs font-bold ${scoreBg} shadow-sm border-l border-b border-gray-100/50">
                        ${displayScore}分
                    </div>
                </div>
                
                <div class="flex justify-between items-start mb-4 ${this.multiSelectMode ? 'pl-8' : ''}">
                    <div class="flex-1 min-w-0 mr-12">
                        <div class="flex items-center mb-1">
                            <h3 class="text-lg font-bold text-gray-900 group-hover:text-blue-600 transition-colors truncate tracking-tight" title="${resume.name}">${resume.name}</h3>
                            ${statusBadgeHtml}
                        </div>
                        <p class="text-sm ${resume.isAssociated ? 'text-blue-600 font-semibold' : 'text-gray-400 italic'} truncate flex items-center" title="${resume.position}">
                            ${resume.isAssociated ? '<i class="fas fa-link mr-1 text-xs"></i>' : ''}${resume.position}
                        </p>
                    </div>
                </div>
                
                ${analysisHtml}
                
                <div class="pt-4 border-t border-gray-50 mt-auto">
                    ${actionHtml}
                </div>
                <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-blue-50 rounded-full opacity-50 pointer-events-none"></div>
            `;
            return card;
        }

        createListItem(resume, analysis) {
            const item = document.createElement('div');
            item.className = 'bg-white border-b border-gray-200 hover:bg-gray-50 transition-colors';
            item.style.animationDelay = `${(this.filteredResumes.indexOf(resume) % this.itemsPerPage) * 0.05}s`;
            item.classList.add('fade-in-up');
            
            const isSelected = this.selectedResumes.has(resume.id);
            if (isSelected) {
                item.classList.add('bg-blue-50');
            }
            
            item.onclick = (e) => {
                // Prevent navigation if clicking on specific interactive elements
                if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.tagName === 'A' || e.target.closest('a') || e.target.tagName === 'INPUT') {
                    return;
                }
                
                if (this.multiSelectMode) {
                    this.toggleResumeSelection(resume.id);
                } else {
                    window.location.href = `resume-details.html?id=${resume.id}`;
                }
            };

            let checkboxHtml = '';
            if (this.multiSelectMode) {
                checkboxHtml = `
                    <div class="flex-shrink-0 mr-4">
                        <input type="checkbox" ${isSelected ? 'checked' : ''} 
                               class="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
                               onclick="event.stopPropagation(); filterManager.toggleResumeSelection(${resume.id})">
                    </div>
                `;
            }

            // 状态标签
            let statusBadgeHtml = '';
            const statusMap = {
                'hired': '已录用',
                'offer': '已录用',
                'interview': '面试中',
                'screening': '已初筛',
                'applied': '投递',
                'rejected': '已淘汰',
                // Handle Chinese inputs as well for consistency
                '入职': '已录用',
                '已入职': '已录用',
                '已录用': '已录用',
                '面试': '面试中',
                '初筛': '已初筛',
                '已初筛': '已初筛',
                '投递': '投递',
                '淘汰': '已淘汰',
                '已淘汰': '已淘汰',
                '放弃': '已淘汰'
            };
            const displayStatus = statusMap[resume.recruitment_status] || resume.recruitment_status;

            const statusStr = String(resume.recruitment_status || '').toLowerCase();
            const isRejected = statusStr === '淘汰' || statusStr === 'rejected' || statusStr === '已淘汰' || statusStr === '放弃';

            if (isRejected) {
                statusBadgeHtml = `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-red-100 text-red-600 border border-red-200 ml-2">已淘汰</span>`;
            } else if (resume.recruitment_status && resume.recruitment_status !== '投递' && resume.recruitment_status !== 'applied') {
                statusBadgeHtml = `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-green-100 text-green-600 border border-green-200 ml-2">${displayStatus}</span>`;
            }

            // Prepare Score HTML based on analysis status
            let scoreHtml = '';
            if (analysis) {
                // 已深度解析: 蓝色分数 + 查看解析链接
                scoreHtml = `
                    <div class="text-left lg:text-right">
                        <div class="flex items-baseline justify-end gap-2">
                            <div class="text-2xl font-black text-blue-600 leading-none">${analysis.overall_score || 0}<span class="text-xs ml-0.5">分</span></div>
                            <button class="text-xs font-bold text-blue-600 hover:text-blue-800 hover:underline transition-colors" onclick="event.stopPropagation(); window.location.href='analysis-detail.html?id=${analysis.id}'">
                                查看解析 <i class="fas fa-chevron-right text-[10px]"></i>
                            </button>
                        </div>
                        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mt-1">综合匹配度</div>
                    </div>
                `;
            } else {
                // 未深度解析: 黑色分数 + 深度解析链接
                scoreHtml = `
                    <div class="text-left lg:text-right">
                        <div class="flex items-baseline justify-end gap-2">
                            <div class="text-xl font-black text-gray-900 leading-none">${resume.score || 0}<span class="text-xs ml-0.5">分</span></div>
                            <button class="text-xs font-bold text-blue-600 hover:text-blue-800 hover:underline transition-colors" onclick="event.stopPropagation(); filterManager.handleDeepAnalysis(${resume.id})">
                                深度解析 <i class="fas fa-magic text-[10px]"></i>
                            </button>
                        </div>
                        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mt-1">初筛分数</div>
                    </div>
                `;
            }

            let middleContentHtml = '';
            if (analysis) {
                 const dimensions = [
                    { label: '专业技能', value: analysis.dimensions?.skills || 0 },
                    { label: '经验契合', value: analysis.dimensions?.experience || 0 },
                    { label: '学历背景', value: analysis.dimensions?.education || 0 },
                    { label: '离职稳定', value: analysis.dimensions?.stability || 0 },
                    { label: '发展潜力', value: analysis.dimensions?.potential || 0 },
                    { label: '团队协作', value: analysis.dimensions?.teamwork || 0 }
                ];

                const dimensionHtml = dimensions.map(d => `
                    <div class="flex flex-col min-w-[80px]">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] text-gray-500">${d.label}</span>
                            <span class="text-[10px] font-bold text-gray-700">${d.value}%</span>
                        </div>
                        <div class="progress-bar-container" style="height: 4px;">
                            <div class="progress-bar-fill" style="width: ${d.value}%"></div>
                        </div>
                    </div>
                `).join('');
                
                middleContentHtml = `
                    <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-6 gap-x-4 gap-y-2 mt-2">
                        ${dimensionHtml}
                    </div>
                `;
            } else {
                 const scoreBg = resume.score >= 90 ? 'bg-green-100 text-green-800' : 
                               (resume.score >= 80 ? 'bg-blue-100 text-blue-800' : 
                               (resume.score >= 60 ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-800'));
                
                const statusText = resume.score > 0 ? (resume.score >= 90 ? '优秀' : (resume.score >= 80 ? '良好' : '一般')) : '待初筛';
                
                middleContentHtml = `
                    <div class="flex flex-wrap items-center gap-2 mt-1">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold ${scoreBg}">
                            ${statusText}
                        </span>
                        <div class="flex flex-wrap items-center gap-x-4 text-sm text-gray-500 font-medium ml-2">
                            <span class="flex items-center"><i class="fas fa-briefcase mr-1.5 text-gray-400"></i>${resume.experience}年经验</span>
                            <span class="flex items-center"><i class="fas fa-graduation-cap mr-1.5 text-gray-400"></i>${resume.education}</span>
                            <span class="flex items-center"><i class="fas fa-clock mr-1.5 text-gray-400"></i>${resume.lastUpdated}</span>
                        </div>
                    </div>
                `;
            }

            // Action Buttons (Removed "查看解析" and "进行解析")
            const actionButtons = `
                <div class="flex flex-wrap lg:flex-nowrap gap-2 items-center">
                    <button class="px-4 py-2 text-blue-600 hover:bg-blue-50 rounded-lg text-sm font-bold transition-all border border-blue-100" 
                            onclick="event.stopPropagation(); window.location.href='resume-details.html?id=${resume.id}'">
                        查看简历
                    </button>
                    ${resume.recruitment_status === '淘汰' ? `
                    <button class="px-4 py-2 text-green-600 hover:bg-green-50 rounded-lg text-sm font-bold transition-all border border-green-100" 
                            onclick="event.stopPropagation(); filterManager.updateStatus(${resume.id}, '投递')">
                        恢复
                    </button>
                    ` : `
                    <button class="px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg text-sm font-bold transition-all border border-red-100" 
                            onclick="event.stopPropagation(); filterManager.rejectResume(${resume.id})">
                        淘汰
                    </button>
                    `}
                </div>
            `;

            item.innerHTML = `
                <div class="flex flex-col lg:flex-row lg:items-center justify-between p-4 md:p-6 gap-4">
                    <div class="flex items-start md:items-center space-x-4 flex-1 min-w-0">
                        ${checkboxHtml}
                        <div class="flex-shrink-0 hidden md:block">
                            <div class="w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center text-blue-600 border border-blue-100">
                                <i class="fas fa-user-tie text-xl"></i>
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex flex-wrap items-center gap-2 mb-1">
                                <h4 class="text-lg font-bold text-gray-900 truncate hover:text-blue-600 transition-colors" title="${resume.name}">${resume.name}</h4>
                                ${statusBadgeHtml}
                                <span class="text-xs text-blue-600 font-medium px-2 py-0.5 bg-blue-50 rounded-full border border-blue-100 whitespace-nowrap">
                                    <i class="fas fa-link mr-1"></i>${resume.position}
                                </span>
                            </div>
                            ${middleContentHtml}
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between lg:justify-end space-x-6 pt-4 lg:pt-0 border-t lg:border-t-0 border-gray-50">
                        ${scoreHtml}
                        ${actionButtons}
                    </div>
                </div>
            `;
            
            return item;
        }

        getScoreClass(score) {
            if (score >= 90) return 'score-excellent';
            if (score >= 80) return 'score-good';
            if (score >= 60) return 'score-average';
            return 'score-poor';
        }

        renderPagination() {
            const pageCount = Math.ceil(this.filteredResumes.length / this.itemsPerPage);
            if (pageCount <= 1) return;

            this.paginationContainer.appendChild(this.createPageButton(this.currentPage - 1, '«', this.currentPage > 1));

            for (let i = 1; i <= pageCount; i++) {
                if (i === this.currentPage) {
                    this.paginationContainer.appendChild(this.createPageButton(i, i, true, true));
                } else if (i === 1 || i === pageCount || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
                    this.paginationContainer.appendChild(this.createPageButton(i, i));
                } else if (i === this.currentPage - 2 || i === this.currentPage + 2) {
                    const dots = document.createElement('span');
                    dots.className = 'px-4 py-2 text-gray-400';
                    dots.textContent = '...';
                    this.paginationContainer.appendChild(dots);
                }
            }

            this.paginationContainer.appendChild(this.createPageButton(this.currentPage + 1, '»', this.currentPage < pageCount));
        }

        createPageButton(page, text, enabled = true, active = false) {
            const button = document.createElement('button');
            button.textContent = text;
            let classes = 'w-8 h-8 mx-1 rounded-lg text-sm font-medium transition-all flex items-center justify-center ';
            
            if (active) {
                classes += 'bg-blue-600 text-white shadow-md';
            } else if (enabled) {
                classes += 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 hover:text-blue-600';
            } else {
                classes += 'bg-gray-50 text-gray-300 cursor-not-allowed';
            }
            
            button.className = classes;
            if (enabled && !active) {
                button.onclick = () => this.renderPage(page);
            }
            return button;
        }

        updateCounts() {
            // 统计时也需要考虑淘汰状态
            const activeResumes = this.allResumes.filter(r => {
                const statusStr = String(r.recruitment_status || '').toLowerCase();
                return !(statusStr === '淘汰' || statusStr === 'rejected' || statusStr === '已淘汰');
            });

            this.totalResumesCount.textContent = activeResumes.length;
            
            // 统计优秀简历：深度解析分数 >= 90 或 初筛分数 >= 90
            this.excellentResumesCount.textContent = activeResumes.filter(r => {
                const analysis = this.getAnalysisForResume(r.id);
                const score = analysis ? analysis.overall_score : r.score;
                return score >= 90;
            }).length;
            
            // 统计通过初筛：深度解析分数 >= 60 或 初筛分数 >= 60
            this.passedScreeningCount.textContent = activeResumes.filter(r => {
                const analysis = this.getAnalysisForResume(r.id);
                const score = analysis ? analysis.overall_score : r.score;
                return score >= 60;
            }).length;
            
            // 统计待处理：未初筛且未深度解析的
            this.pendingResumesCount.textContent = activeResumes.filter(r => {
                const analysis = this.getAnalysisForResume(r.id);
                return !analysis && (r.score === 0 || !r.score);
            }).length;
            
            this.updateFilteredCount();
        }

        updateFilteredCount() {
            // 已删除该统计 div，此处不再更新
            // if (this.filteredCountBadge) this.filteredCountBadge.textContent = this.filteredResumes.length;
        }
    }

    window.filterManager = null;

    function batchScoring() {
        if (!window.filterManager) {
            alert('人才库未初始化');
            return;
        }

        // 筛选分数为0的简历
        const resumesToScore = window.filterManager.filteredResumes.filter(r => !r.score || r.score === 0);
        
        if (resumesToScore.length === 0) {
            alert('当前筛选列表中没有分数为0的简历需要打分');
            return;
        }
        
        const count = resumesToScore.length;
        const btn = event.currentTarget;
        const originalHtml = btn.innerHTML;

        if (confirm(`确定要对当前筛选出的 ${count} 份分数为 0 的简历进行批量初筛吗？\n由于 AI 处理较慢，请耐心等待完成。`)) {
            // 设置按钮加载状态
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>批量初筛中(${count})...`;
            
            const ids = resumesToScore.map(r => r.id);
            const token = (JSON.parse(localStorage.getItem('userInfo') || '{}').token) || null;
            const headers = token ? { Authorization: 'Bearer ' + token } : {};
            
            // 获取精准职位作为打分参考
            const jobDescription = window.filterManager.jobTitleFilter ? window.filterManager.jobTitleFilter.value : '';

            fetch('/api/ai/batch-analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...headers
                },
                body: JSON.stringify({ 
                    resumeIds: ids,
                    options: { 
                        jobDescription: jobDescription,
                        scene: 'talent_pool'
                    }
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 批量初筛完成后直接刷新
                    window.filterManager.filterAndRender(); 
                } else {
                    alert('批量初筛启动失败: ' + (data.error || '未知错误'));
                }
            })
            .catch(error => {
                console.error('批量初筛请求失败:', error);
                alert('批量初筛请求失败: ' + error.message);
            })
            .finally(() => {
                // 恢复按钮状态
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            });
        }
    }
  </script>
    <script src="/js/header-profile.js"></script>
