<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人设置 - 争湃·简历大师</title>
    <script src="../js/tailwindcss.js"></script>
    <script src="../js/ui-components.js"></script>
    <script src="/js/user-auth.js"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link href="https://fonts.loli.net/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }
        body { font-family: var(--font-sans); }
        .portal-card {
            background-color: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
        }
        .portal-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.5rem;
            background-color: #0f172a;
            color: white;
            border-radius: 0.75rem;
            font-weight: 500;
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .btn-primary:hover {
            background-color: #000000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="bg-gray-50 antialiased text-gray-900 selection:bg-blue-100 selection:text-blue-700">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 bottom-0 sidebar-modern z-40"></aside>
    
    <!-- Main Content -->
    <main class="main-content min-h-screen" id="main-content">
        <!-- Header -->
        <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20 h-20">
            <div class="flex items-center justify-between px-6 h-full">
                <div class="flex items-center space-x-4 pl-8">
                    <div class="brand-title flex flex-col justify-center space-y-1.5">
                        <h1 class="text-lg font-bold text-gray-900 leading-none">个人设置</h1>
                        <p class="text-xs text-gray-500 font-medium leading-tight">更新您的个人资料、联系方式及账户安全性</p>
                    </div>
                </div>
                <div id="header-right-section" class="flex items-center space-x-4"></div>
            </div>
        </header>

        <div class="p-8 max-w-[1440px] mx-auto space-y-8">
            <!-- Basic Profile -->
            <div class="portal-card p-8">
                <h3 class="text-lg font-bold text-gray-900 mb-6 flex items-center">
                    <span class="w-1 h-6 bg-blue-600 rounded-full mr-3"></span>
                    基本信息
                </h3>
                
                <div class="flex flex-col md:flex-row items-center md:items-start space-y-6 md:space-y-0 md:space-x-8">
                    <!-- Avatar -->
                    <div class="flex flex-col items-center space-y-3">
                        <div class="relative group cursor-pointer" id="avatar-container">
                            <img id="profile-avatar" src="/images/default-avatar.png" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-4 border-gray-50 shadow-sm">
                            <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <span class="text-white">📷</span>
                            </div>
                            <input type="file" id="avatar-upload" class="hidden" accept="image/*">
                        </div>
                        <p class="text-xs text-gray-500">点击更换头像</p>
                    </div>

                    <!-- Form -->
                    <div class="flex-1 w-full space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">昵称</label>
                                <input type="text" id="profile-name" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 focus:bg-white transition-all" placeholder="设置您的昵称">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">职位头衔</label>
                                <input type="text" id="profile-title" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 focus:bg-white transition-all" placeholder="例如：HR 经理">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">个人简介</label>
                            <textarea id="profile-bio" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 focus:bg-white transition-all" placeholder="介绍一下自己..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Account Security -->
            <div class="portal-card p-8">
                <h3 class="text-lg font-bold text-gray-900 mb-6 flex items-center">
                    <span class="w-1 h-6 bg-blue-600 rounded-full mr-3"></span>
                    账号安全
                </h3>
                
                <div class="space-y-4">
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-100">
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-lg bg-white flex items-center justify-center text-blue-600 shadow-sm mr-4">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div>
                                <p class="text-sm font-bold text-gray-900">绑定邮箱</p>
                                <p class="text-xs text-gray-500 mt-0.5" id="profile-email">loading...</p>
                            </div>
                        </div>
                        <span class="px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-lg">已验证</span>
                    </div>

                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-100">
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-lg bg-white flex items-center justify-center text-blue-600 shadow-sm mr-4">
                                <i class="fas fa-mobile-alt"></i>
                            </div>
                            <div>
                                <p class="text-sm font-bold text-gray-900">手机号码</p>
                                <p class="text-xs text-gray-500 mt-0.5" id="profile-phone">未绑定</p>
                            </div>
                        </div>
                        <button onclick="bindPhone()" class="text-sm text-blue-600 font-medium hover:text-blue-700">去绑定</button>
                    </div>

                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-100">
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-lg bg-white flex items-center justify-center text-blue-600 shadow-sm mr-4">
                                <i class="fas fa-lock"></i>
                            </div>
                            <div>
                                <p class="text-sm font-bold text-gray-900">登录密码</p>
                                <p class="text-xs text-gray-500 mt-0.5">上次修改：3个月前</p>
                            </div>
                        </div>
                        <button onclick="changePassword()" class="text-sm text-blue-600 font-medium hover:text-blue-700">修改密码</button>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-end space-x-4">
                <button onclick="window.location.reload()" class="px-6 py-2.5 border border-gray-300 rounded-xl text-gray-700 hover:bg-white transition-all font-medium">取消</button>
                <button onclick="saveProfile()" class="btn-primary">保存更改</button>
            </div>
        </div>
    </main>

    <script src="/js/sidebar.js"></script>
    <script src="/js/header-profile.js"></script>
    <script>
        const ui = new UIComponents();

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof requireAuth === 'function' && !requireAuth('/pages/login.html')) return;
            
            Sidebar.init({ mount: '#sidebar', active: 'profile' }); 
            HeaderProfile.init('#header-right-section');
            
            loadUserProfile();
        });

        function changePassword() {
            ui.showNotification('请前往安全设置修改密码', 'info');
            setTimeout(() => {
                window.location.href = '/pages/settings.html#security';
            }, 1000);
        }

        function bindPhone() {
            ui.showNotification('请前往安全设置绑定手机', 'info');
            setTimeout(() => {
                window.location.href = '/pages/settings.html#security';
            }, 1000);
        }

        async function loadUserProfile() {
            try {
                const user = await userAuthInstance.fetchCurrentUser();
                if (!user) return;

                const displayName = user.name || user.username || 'USER';
                document.getElementById('profile-name').value = displayName;
                document.getElementById('profile-email').textContent = user.email || '未设置';
                document.getElementById('profile-phone').textContent = user.phone || '未绑定';
                document.getElementById('profile-title').value = user.title || '';
                document.getElementById('profile-bio').value = user.bio || '';
                
                // 使用 ui.renderAvatar
                const avatarContainer = document.getElementById('avatar-container');
                if (avatarContainer) {
                    avatarContainer.innerHTML = `
                        ${ui.renderAvatar(user.avatar, displayName, 'w-24 h-24', 'rounded-full')}
                        <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="text-white">📷</span>
                        </div>
                        <input type="file" id="avatar-upload" class="hidden" accept="image/*">
                    `;
                    // 重新绑定事件
                    document.getElementById('avatar-upload').addEventListener('change', handleAvatarChange);
                }
            } catch (e) {
                console.error(e);
                ui.showNotification('加载用户信息失败', 'error');
            }
        }

        async function saveProfile() {
            const name = document.getElementById('profile-name').value.trim();
            const title = document.getElementById('profile-title').value.trim();
            const bio = document.getElementById('profile-bio').value.trim();

            if (!name) {
                ui.showNotification('请输入昵称', 'warning');
                return;
            }

            try {
                // Mock API call
                const payload = { name, title, bio };
                await userAuthInstance.apiRequest('/user/profile', 'PUT', payload);
                
                // Update local storage for immediate reflection
                const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
                if (userInfo.user) {
                    Object.assign(userInfo.user, payload);
                    localStorage.setItem('userInfo', JSON.stringify(userInfo));
                }

                ui.showNotification('个人信息已保存', 'success');
                setTimeout(() => window.location.reload(), 1000);
            } catch (e) {
                // Fallback for demo
                ui.showNotification('信息已保存 (演示模式)', 'success');
            }
        }

        // Avatar Upload Handler
        function handleAvatarChange(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const avatarContainer = document.getElementById('avatar-container');
                    const name = document.getElementById('profile-name').value || 'USER';
                    // 预览新头像
                    avatarContainer.innerHTML = `
                        <img src="${e.target.result}" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-4 border-gray-50 shadow-sm">
                        <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="text-white">📷</span>
                        </div>
                        <input type="file" id="avatar-upload" class="hidden" accept="image/*">
                    `;
                    // 重新绑定事件
                    document.getElementById('avatar-upload').addEventListener('change', handleAvatarChange);
                };
                reader.readAsDataURL(file);
            }
        }
        
        document.getElementById('avatar-container').addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT') {
                document.getElementById('avatar-upload').click();
            }
        });
    </script>
</body>
</html>
