<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招聘流程管理 - 争湃·简历大师</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="../js/tailwindcss.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        .kanban-column { min-height: 200px; }

        /* Horizontal scroll without visible scrollbar */
        .hide-x-scrollbar { overflow-x: auto; overflow-y: hidden; }
        .hide-x-scrollbar::-webkit-scrollbar { height: 0; display: none; }
        .hide-x-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar-modern"></aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Standard Header -->
    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20">
        <div class="flex items-center justify-between p-4">
            <div class="flex items-center space-x-4">
                <button class="menu-button p-2 rounded-lg hover:bg-gray-100" id="sidebar-toggle">
                    <i class="fas fa-bars text-gray-900"></i>
                </button>
                <h1 class="brand-title text-lg font-bold text-gray-900">招聘流程管理</h1>
            </div>
            <div class="flex items-center space-x-4" id="header-right-section">
                <!-- User Profile rendered by HeaderProfile -->
            </div>
        </div>
    </header>

    <!-- Main Content Wrapper -->
    <main id="main-content" class="main-content h-full flex flex-col pt-20 p-6">
        
        <!-- Controls Section (Styled like Dashboard) -->
        <section class="pt-6 pb-4">
             <div class="bg-white rounded-lg shadow p-4 mb-6">
                <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-4">
                    <!-- Left: Job Selector -->
                    <div class="flex items-center gap-4 flex-wrap">
                        <div id="process-stats" class="hidden lg:block bg-blue-50 px-4 py-2 rounded-lg text-blue-700 border border-blue-100">
                            <!-- Stats populated by JS -->
                        </div>
                        <span class="text-gray-600 font-medium">筛选职位:</span>
                        <select id="jobSelect" class="border-gray-300 rounded-lg shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500 min-w-[200px] max-w-[300px] py-2">
                            <!-- Options populated by JS -->
                        </select>
                        <!-- Moved Search here -->
                        <div class="relative flex-1 group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-search text-gray-400 group-focus-within:text-blue-500 transition-colors"></i>
                            </div>
                            <input type="text" id="search-box" placeholder="搜索候选人姓名、职位..." 
                                   class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500 transition-all text-sm shadow-sm">
                        </div>
                    </div>

                    <!-- Right: Actions & Stats -->
                    <div class="flex items-center gap-4 flex-wrap">
                    </div>
                </div>
            </div>
        </section>

        <!-- Kanban Board Area -->
        <section class="flex-1 hide-x-scrollbar pb-6 relative">
            <div id="kanban-board" class="flex gap-4 h-full min-w-max pb-4">
                <!-- Columns populated by JS -->
            </div>
        </section>
    </main>

    <!-- Modals -->
    <!-- Interview Modal -->
    <div id="interviewModal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity bg-black/50" aria-hidden="true"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4" id="modal-title">安排面试</h3>
                    <form id="interviewForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">面试类型</label>
                            <select name="type" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                <option value="video">视频面试</option>
                                <option value="offline">现场面试</option>
                                <option value="phone">电话面试</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">日期</label>
                                <input type="date" name="date" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">时间</label>
                                <input type="time" name="time" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">面试官</label>
                            <input type="text" name="interviewer" placeholder="输入面试官姓名" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">备注/链接</label>
                            <textarea name="notes" rows="3" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                        </div>
                        <div class="mt-5 sm:mt-6 sm:grid sm:grid-cols-2 sm:gap-3 sm:grid-flow-row-dense">
                            <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:col-start-2 sm:text-sm">
                                确认安排
                            </button>
                            <button type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:col-start-1 sm:text-sm modal-close">
                                取消
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Offer Modal -->
    <div id="offerModal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity bg-black/50" aria-hidden="true"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">发送 Offer</h3>
                    <form id="offerForm" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">薪资 (月薪)</label>
                                <div class="mt-1 relative rounded-md shadow-sm">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <span class="text-gray-500 sm:text-sm">¥</span>
                                    </div>
                                    <input type="number" name="salary" class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-7 sm:text-sm border-gray-300 rounded-md" placeholder="20000">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">年终奖 (月数)</label>
                                <input type="number" name="bonus" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="14">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">入职日期</label>
                            <input type="date" name="startDate" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">试用期 (月)</label>
                            <select name="probation" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                <option value="3">3个月</option>
                                <option value="6">6个月</option>
                                <option value="0">无</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">附加说明</label>
                            <textarea name="content" rows="3" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                        </div>
                        <div class="mt-5 sm:mt-6 sm:grid sm:grid-cols-2 sm:gap-3 sm:grid-flow-row-dense">
                            <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:col-start-2 sm:text-sm">
                                发送 Offer
                            </button>
                            <button type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:col-start-1 sm:text-sm modal-close">
                                取消
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Shared Utils -->
    <script src="../js/user-auth.js"></script>
    <script src="../js/resume-data.js"></script>
    <script src="../js/ui-components.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="../js/recruitment-flow-controller.js"></script>
    <script src="/js/header-profile.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize sidebar
            if (typeof Sidebar !== 'undefined') {
                Sidebar.init({ mount: '#sidebar', active: 'recruitment-flow' });
            }
            // Initialize header profile
            if (typeof HeaderProfile !== 'undefined') {
                HeaderProfile.init('#header-right-section');
            }
            
            // Initialize recruitment flow controller
            if (typeof recruitmentFlowController !== 'undefined') {
                recruitmentFlowController.init();
            }
        });
    </script>
</body>
</html>
