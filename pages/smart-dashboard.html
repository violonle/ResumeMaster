<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能工作台 - 争湃·简历大师</title>
    <script src="../js/tailwindcss.js"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://fastly.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: #fdfdfd;
        }

        .dashboard-card {
            background: #ffffff;
            border: 1px solid #f1f3f5;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dashboard-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-color: #e5e7eb;
        }

        .gradient-text {
            color: #1d4ed8;
        }

        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #f1f3f5;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #e9ecef;
        }
        
        /* 进度环样式 */
        .progress-ring { transform: rotate(-90deg); }
        .progress-ring-circle { transition: stroke-dashoffset 0.35s; stroke-dasharray: 251.2 251.2; }
    </style>
</head>
<body class="antialiased text-gray-900 selection:bg-blue-100 selection:text-blue-700">
    <!-- 侧边栏 -->
    <aside id="sidebar" class="sidebar-modern"></aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- 顶部导航栏 -->
    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-gray-200 z-20 h-20">
        <div class="flex items-center justify-between px-6 h-full">
            <div class="flex items-center space-x-4 pl-8">
                <div class="brand-title flex flex-col justify-center space-y-1.5">
                    <h1 class="text-lg font-bold text-gray-900 leading-none">智能仪表盘</h1>
                    <p class="text-xs text-gray-500 font-medium leading-tight">实时掌握简历处理进度与 AI 服务核心指标</p>
                </div>
            </div>
            <div class="flex items-center space-x-4" id="header-right-section">
                <!-- User Profile rendered by HeaderProfile -->
            </div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main id="main-content" class="main-content pt-24 p-8 lg:p-12 transition-all duration-300">
        <div class="max-w-[1440px] mx-auto space-y-10 animate-in">
            <!-- 欢迎区域 -->
            <div class="flex flex-col md:flex-row md:items-center justify-between">
                <div>
                    <h1 class="text-3xl font-black text-gray-900 tracking-tight">欢迎回来</h1>
                    <p class="text-gray-800 mt-1 font-black flex items-center">
                        <span class="mr-2 text-gray-400">📅</span>
                        今天是 <span id="current-date">正在加载日期...</span>
                        <span class="mx-2 text-gray-300">|</span>
                        <span>您有 <span class="text-blue-600 font-black">—</span> 个新简历需要审核</span>
                    </p>
                </div>
                <div class="mt-6 md:mt-0 text-right bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                    <div class="text-3xl font-black text-blue-600 leading-none" id="ai-score">—</div>
                    <p class="text-[10px] font-black text-gray-400 uppercase tracking-wider mt-1">AI服务评分</p>
                </div>
            </div>

            <!-- 统计卡片 - 现代化风格 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- 简历总数 -->
                <div class="dashboard-card p-6 rounded-2xl cursor-pointer" onclick="window.location.href='librarypool.html'">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-2xl">
                            <span>📄</span>
                        </div>
                        <div>
                            <p class="text-[11px] font-black text-gray-500 uppercase tracking-widest mb-1">简历总数</p>
                            <h3 class="text-2xl font-black text-gray-900" id="total-candidates">—</h3>
                            <p class="text-[10px] font-black text-blue-600 mt-0.5" id="new-candidates-today">—</p>
                        </div>
                    </div>
                </div>

                <!-- 职位发布 -->
                <div class="dashboard-card p-6 rounded-2xl cursor-pointer" onclick="window.location.href='job-management.html'">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-xl bg-indigo-50 text-indigo-700 flex items-center justify-center text-2xl">
                            <span>💼</span>
                        </div>
                        <div>
                            <p class="text-[11px] font-black text-gray-500 uppercase tracking-widest mb-1">活跃职位</p>
                            <h3 class="text-2xl font-black text-gray-900" id="active-jobs">—</h3>
                            <p class="text-[10px] font-black text-gray-400 mt-0.5">正在招聘中</p>
                        </div>
                    </div>
                </div>

                <!-- 面试安排 -->
                <div class="dashboard-card p-6 rounded-2xl cursor-pointer" onclick="window.location.href='recruitment-flow.html'">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center text-2xl">
                            <span>✅</span>
                        </div>
                        <div>
                            <p class="text-[11px] font-black text-gray-500 uppercase tracking-widest mb-1">面试安排</p>
                            <h3 class="text-2xl font-black text-gray-900" id="interviews-scheduled">—</h3>
                            <p class="text-[10px] font-black text-emerald-600 mt-0.5">待面试人数</p>
                        </div>
                    </div>
                </div>

                <!-- 录用通知 -->
                <div class="dashboard-card p-6 rounded-2xl cursor-pointer" onclick="window.location.href='recruitment-flow.html'">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-xl bg-amber-50 text-amber-700 flex items-center justify-center text-2xl">
                            <span>👤</span>
                        </div>
                        <div>
                            <p class="text-[11px] font-black text-gray-500 uppercase tracking-widest mb-1">录用通知</p>
                            <h3 class="text-2xl font-black text-gray-900" id="offers-sent">—</h3>
                            <p class="text-[10px] font-black text-amber-600 mt-0.5">待入职人数</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 主要内容区域 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                <!-- 左侧：简历分析和趋势 -->
                <div class="lg:col-span-2 space-y-10">
                    <!-- 简历分析与对比 - 现代化标签页 -->
                    <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                        <div class="flex items-center justify-between mb-8">
                            <div class="flex space-x-1 bg-gray-50 p-1 rounded-xl">
                                <button class="tab-button active px-6 py-2 text-sm font-black rounded-lg transition-all bg-white text-blue-600 shadow-sm" data-tab="analysis">
                                    简历分析
                                </button>
                                <button class="tab-button px-6 py-2 text-sm font-black rounded-lg transition-all text-gray-500 hover:text-gray-700" data-tab="comparison">
                                    简历对比
                                </button>
                            </div>
                            <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">最近记录</span>
                        </div>
                        
                        <!-- 标签页内容 -->
                        <div class="tab-content">
                            <!-- 简历分析内容 -->
                            <div id="analysis-tab" class="tab-pane active space-y-6">
                                <div id="recent-activity" class="space-y-3">
                                    <div class="flex items-center justify-center py-12">
                                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                                    </div>
                                </div>
                                
                                <div class="flex space-x-3 pt-4">
                                    <button onclick="window.location.href='resume-upload-pc.html'" class="flex-1 px-6 py-4 bg-blue-700 text-white rounded-2xl text-sm font-black shadow-lg shadow-blue-100 hover:bg-blue-800 transition-all flex items-center justify-center">
                                        <span class="mr-2">📤</span>导入简历文件
                                    </button>
                                    <button onclick="window.location.href='resume-analysis-pc.html'" class="flex-1 px-6 py-4 bg-white text-gray-800 border border-gray-100 rounded-2xl text-sm font-black shadow-sm hover:bg-gray-50 transition-all flex items-center justify-center">
                                        <span class="mr-2 text-gray-400">📈</span>查看全部
                                    </button>
                                </div>
                            </div>
                            
                            <!-- 简历对比内容 -->
                            <div id="comparison-tab" class="tab-pane hidden space-y-6">
                                <div class="space-y-3">
                                    <!-- 对比记录项 -->
                                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border border-transparent hover:border-blue-100 hover:bg-white hover:shadow-md transition-all">
                                        <div class="flex items-center space-x-4">
                                            <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center">
                                                <span>⚖️</span>
                                            </div>
                                            <div>
                                                <p class="text-sm font-black text-gray-900">张三 vs 李四 vs 王五</p>
                                                <p class="text-[10px] font-black text-gray-400 uppercase">前端工程师 • 2024-03-20</p>
                                            </div>
                                        </div>
                                        <button onclick="window.location.href='comparison.html?compare=001-002-003'" class="px-4 py-2 bg-white text-blue-600 border border-blue-100 rounded-xl text-xs font-black hover:bg-blue-50 transition-all">
                                            详情
                                        </button>
                                    </div>
                                    <!-- 更多对比项... -->
                                </div>
                                
                                <div class="flex space-x-3 pt-4">
                                    <button onclick="window.location.href='comparison.html'" class="flex-1 px-6 py-4 bg-blue-700 text-white rounded-2xl text-sm font-black shadow-lg shadow-blue-100 hover:bg-blue-800 transition-all flex items-center justify-center">
                                        <span class="mr-2">➕</span>新建对比
                                    </button>
                                    <button onclick="window.location.href='resume-compare-results.html'" class="flex-1 px-6 py-4 bg-white text-gray-800 border border-gray-100 rounded-2xl text-sm font-black shadow-sm hover:bg-gray-50 transition-all flex items-center justify-center">
                                        <span class="mr-2 text-gray-400">📋</span>查看全部
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- AI分析趋势图表 -->
                    <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                        <div class="flex items-center justify-between mb-8">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 bg-violet-50 text-violet-600 rounded-lg flex items-center justify-center">
                                    <span>📈</span>
                                </div>
                                <div>
                                    <h2 class="text-lg font-black text-gray-900">AI分析趋势</h2>
                                    <p class="text-xs font-black text-gray-400">近期的简历分析活跃度</p>
                                </div>
                            </div>
                            <div class="flex space-x-2 bg-gray-50 p-1 rounded-xl">
                                <button class="px-4 py-1.5 text-xs font-black rounded-lg transition-all bg-white text-blue-600 shadow-sm">7天</button>
                                <button class="px-4 py-1.5 text-xs font-black rounded-lg transition-all text-gray-500 hover:text-gray-700">30天</button>
                            </div>
                        </div>
                        <div class="h-72 w-full">
                            <canvas id="analysis-trend-chart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 右侧：AI助手和系统状态 -->
                <div class="space-y-10">
                    <!-- AI助手 -->
                    <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm flex flex-col">
                        <div class="flex items-center justify-between mb-8">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center">
                                    <span>🤖</span>
                                </div>
                                <div>
                                    <h2 class="text-lg font-black text-gray-900">AI助手</h2>
                                    <div class="flex items-center space-x-1.5 mt-0.5">
                                        <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                                        <span class="text-[10px] font-black text-green-600 uppercase">在线</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div id="ai-advice-container" class="space-y-4 flex-1">
                            <div class="animate-pulse space-y-4">
                                <div class="h-20 bg-gray-50 rounded-2xl"></div>
                                <div class="h-20 bg-gray-50 rounded-2xl"></div>
                            </div>
                        </div>

                        <button onclick="window.location.href='/pages/assistant-chat.html'" class="w-full mt-8 px-6 py-4 bg-blue-700 text-white rounded-2xl text-sm font-black shadow-lg shadow-blue-100 hover:bg-blue-800 transition-all flex items-center justify-center">
                            <span class="mr-2">💬</span>开始对话
                        </button>
                    </div>

                    <!-- 系统状态 -->
                    <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                        <h2 class="text-lg font-black text-gray-900 mb-8">系统状态</h2>
                        <div class="space-y-6">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                                    <span class="text-sm font-black text-gray-600">AI分析引擎</span>
                                </div>
                                <span class="text-[10px] font-black text-green-600 bg-green-50 px-2 py-1 rounded-lg">运行中</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                                    <span class="text-sm font-black text-gray-600">简历解析服务</span>
                                </div>
                                <span class="text-[10px] font-black text-green-600 bg-green-50 px-2 py-1 rounded-lg">运行中</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-2 h-2 bg-amber-500 rounded-full"></div>
                                    <span class="text-sm font-black text-gray-600">存储空间</span>
                                </div>
                                <span class="text-[10px] font-black text-amber-600 bg-amber-50 px-2 py-1 rounded-lg">85% 已用</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/sidebar.js"></script>
    <script>
        class SmartDashboard {
            constructor() {
                this.init();
            }

            async init() {
                this.initDate();
                this.initCharts();
                await this.loadDashboardData();
                await this.loadAIAdvice();
            }

            initDate() {
                const dateElement = document.getElementById('current-date');
                if (dateElement) {
                    const now = new Date();
                    const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
                    dateElement.textContent = now.toLocaleDateString('zh-CN', options);
                }
            }

            initCharts() {
                const ctx = document.getElementById('analysis-trend-chart')?.getContext('2d');
                if (!ctx) return;

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                        datasets: [{
                            label: '简历分析数',
                            data: [12, 19, 15, 25, 22, 10, 8],
                            borderColor: '#2563eb',
                            backgroundColor: 'rgba(37, 99, 235, 0.05)',
                            fill: true,
                            tension: 0.4,
                            borderWidth: 3,
                            pointRadius: 4,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#2563eb',
                            pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { color: '#f8fafc' },
                                ticks: { font: { size: 10, weight: '600' }, color: '#94a3b8' }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { font: { size: 10, weight: '600' }, color: '#94a3b8' }
                            }
                        }
                    }
                });
            }

            async loadDashboardData() {
                try {
                    const token = localStorage.getItem('token');
                    // 模拟 API 调用
                    const data = {
                        total_candidates: 1248,
                        new_today: 12,
                        active_jobs: 24,
                        interviews: 8,
                        offers: 3,
                        ai_score: 98
                    };

                    this.animateNumber(document.getElementById('total-candidates'), data.total_candidates);
                    document.getElementById('new-candidates-today').textContent = `今日新增 ${data.new_today}`;
                    this.animateNumber(document.getElementById('active-jobs'), data.active_jobs);
                    this.animateNumber(document.getElementById('interviews-scheduled'), data.interviews);
                    this.animateNumber(document.getElementById('offers-sent'), data.offers);
                    this.animateNumber(document.getElementById('ai-score'), data.ai_score);

                    await this.loadRecentResumeAnalysis();
                } catch (error) {
                    console.error('加载仪表盘数据失败:', error);
                }
            }

            animateNumber(element, target) {
                if (!element) return;
                let current = 0;
                const duration = 1000;
                const start = performance.now();
                
                const step = (now) => {
                    const progress = Math.min((now - start) / duration, 1);
                    current = Math.floor(progress * target);
                    element.textContent = current.toLocaleString();
                    if (progress < 1) {
                        requestAnimationFrame(step);
                    } else {
                        element.textContent = target.toLocaleString();
                    }
                };
                requestAnimationFrame(step);
            }

            async loadAIAdvice() {
                const container = document.getElementById('ai-advice-container');
                if (!container) return;

                // 模拟数据
                const advice = [
                    { type: 'trend', text: '💡 您的后端工程师职位申请量在过去48小时内增长了25%。', color: 'blue' },
                    { type: 'suggestion', text: '📊 建议：优先审核具有“微服务架构”背景的候选人。', color: 'indigo' }
                ];

                container.innerHTML = advice.map(item => `
                    <div class="p-5 bg-${item.color}-50 rounded-2xl border border-${item.color}-100">
                        <p class="text-xs font-black text-${item.color}-800 leading-relaxed">${item.text}</p>
                    </div>
                `).join('');
            }

            async loadRecentResumeAnalysis() {
                const container = document.getElementById('recent-activity');
                if (!container) return;

                // 模拟数据
                const resumes = [
                    { id: '1', name: '高级前端开发-张晓明.pdf', date: '2024-03-20 14:30' },
                    { id: '2', name: '产品经理-李芳.docx', date: '2024-03-20 11:20' },
                    { id: '3', name: 'Java工程师-王大强.pdf', date: '2024-03-19 16:45' }
                ];

                container.innerHTML = resumes.map(resume => `
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border border-transparent hover:border-blue-100 hover:bg-white hover:shadow-md transition-all cursor-pointer group" onclick="window.location.href='resume-analysis-pc.html?id=${resume.id}'">
                        <div class="flex items-center space-x-4">
                            <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-all">
                                <i class="fas fa-file-alt"></i>
                            </div>
                            <div>
                                <p class="text-sm font-black text-gray-900">${resume.name}</p>
                                <p class="text-[10px] font-black text-gray-400 uppercase">${resume.date}</p>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right text-gray-300 group-hover:text-blue-600 transition-all text-xs"></i>
                    </div>
                `).join('');
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            new SmartDashboard();
            Sidebar.init({ mount:'#sidebar', active:'dashboard' });

            // 标签页切换
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabPanes = document.querySelectorAll('.tab-pane');

            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetTab = this.getAttribute('data-tab');
                    
                    tabButtons.forEach(btn => {
                        btn.classList.remove('active', 'bg-white', 'text-blue-600', 'shadow-sm');
                        btn.classList.add('text-gray-500');
                    });
                    
                    this.classList.add('active', 'bg-white', 'text-blue-600', 'shadow-sm');
                    this.classList.remove('text-gray-500');
                    
                    tabPanes.forEach(pane => pane.classList.add('hidden'));
                    document.getElementById(targetTab + '-tab').classList.remove('hidden');
                });
            });
        });
    </script>
</body>
</html>
