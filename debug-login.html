<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录调试</title>
</head>
<body>
    <h1>登录调试</h1>
    
    <div style="margin: 20px;">
        <h3>测试登录</h3>
        <div style="margin: 10px;">
            <label>邮箱/用户名：</label>
            <input type="text" id="identifier" value="admin@resumemaster.com" style="padding: 5px;">
        </div>
        <div style="margin: 10px;">
            <label>密码：</label>
            <input type="password" id="password" value="admin123" style="padding: 5px;">
        </div>
        <button onclick="testLogin()" style="padding: 10px 20px;">登录</button>
    </div>
    
    <div id="result" style="margin: 20px; padding: 20px; border: 1px solid #ccc; background: #f5f5f5;">
        <p>点击登录按钮测试...</p>
    </div>

    <script src="/js/user-auth.js"></script>
    <script>
        async function testLogin() {
            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '<p>正在登录...</p>';
            
            try {
                console.log('开始登录测试...');
                console.log('输入:', { identifier, password });
                
                const result = await userAuth.login(identifier, password);
                
                console.log('登录结果:', result);
                
                let html = '<h2>登录结果：</h2>';
                html += '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
                
                if (result.success) {
                    html += '<h3>数据结构分析：</h3>';
                    html += '<p>result.success = ' + result.success + '</p>';
                    html += '<p>result.user = ' + JSON.stringify(result.user) + '</p>';
                    html += '<p>result.data = ' + JSON.stringify(result.data) + '</p>';
                    html += '<p>result.data?.user = ' + JSON.stringify(result.data?.user) + '</p>';
                    
                    const u = result.user || (result.data && result.data.user) || {};
                    html += '<h3>提取的用户信息：</h3>';
                    html += '<pre>' + JSON.stringify(u, null, 2) + '</pre>';
                    
                    const idf = identifier;
                    const isEmail = /@/.test(idf);
                    const matched = isEmail ? (u.email === idf) : (u.phone === idf || u.username === idf);
                    
                    html += '<h3>匹配检查：</h3>';
                    html += '<p>输入: ' + idf + '</p>';
                    html += '<p>isEmail: ' + isEmail + '</p>';
                    html += '<p>用户邮箱: ' + u.email + '</p>';
                    html += '<p>用户手机: ' + u.phone + '</p>';
                    html += '<p>用户名: ' + u.username + '</p>';
                    html += '<p>匹配结果: ' + (matched ? '✅ 匹配' : '❌ 不匹配') + '</p>';
                    
                    if (!matched) {
                        html += '<p style="color: orange;">⚠️ 前端会显示"您还不是注册用户，请注册"</p>';
                    } else {
                        html += '<p style="color: green;">✅ 前端会跳转到 dashboard.html</p>';
                    }
                } else {
                    html += '<p style="color: red;">登录失败: ' + (result.message || '未知错误') + '</p>';
                }
                
                resultDiv.innerHTML = html;
            } catch (error) {
                console.error('登录错误:', error);
                resultDiv.innerHTML = '<p style="color: red;">错误: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
