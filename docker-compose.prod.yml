version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: srm-mysql-prod
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-superresumemaster}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-YourStrongPassword}
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - srm-network

  app:
    image: letuyang/super-resume-master:latest
    container_name: super-resume-master
    restart: always
    # 移除 build 字段，直接从镜像运行
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/backend/uploads
      - ./logs:/app/backend/logs
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - srm-network

networks:
  srm-network:
    driver: bridge
