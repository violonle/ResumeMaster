<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 争湃·简历大师</title>
    <meta http-equiv="refresh" content="0; url=/pages/login.html">
    <script>
        // 如果 URL 中包含 sessionId 或 resumeJobId，说明是面试邀请链接，跳转到面试页面
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('sessionId') || urlParams.has('resumeJobId')) {
            window.location.replace('/interview.html' + window.location.search);
        } else {
            window.location.replace('/pages/login.html');
        }
    </script>
</head>
<body>
    <p>正在跳转到登录页面...</p>
</body>
</html>
