<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo测试 - 争湃·简历大师</title>
    <style>
        body{ background:#f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .auth-shell{ display:grid; grid-template-columns: 420px 1fr; width:100%; max-width:1000px; background:#fff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; box-shadow:0 12px 32px rgba(17,24,39,.08); margin: 50px auto; }
        .brand-pane{ padding:32px; background:#f9fafb; border-right:1px solid #e5e7eb }
        .brand-logo-img{ width:200px; height:auto; border-radius:12px; margin-bottom:12px }
        .brand-logo{ width:48px; height:48px; border-radius:12px; background:#111827; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size: 16px; }
        .brand-pane .brand-title{ margin-top:12px; font-size:20px; font-weight:700; color:#0f172a }
        .brand-desc{ margin-top:4px; color:#64748b; font-size:12px }
        .feature-list{ margin-top:24px; color:#334155; font-size:13px }
        .feature-item{ display:flex; align-items:center; gap:8px; padding:8px 0 }
        .form-pane{ padding:32px; background:#fff }
        @media (max-width: 960px){ .auth-shell{ grid-template-columns: 1fr } }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="brand-pane">
            <div class="brand-logo">SRM</div>
            <div class="brand-title">争湃·简历大师</div>
            <div class="brand-desc">AI驱动，精准识才</div>
            <div class="feature-list">
                <div class="feature-item"><span>• 智能解析与结构化</span></div>
                <div class="feature-item"><span>• 多维对比与评估</span></div>
                <div class="feature-item"><span>• 岗位与流程管理</span></div>
            </div>
        </div>
        <div class="form-pane">
            <h2>Logo显示测试</h2>
            <p>✅ Logo显示正常 - 使用文字logo "SRM"</p>
            <p>✅ 品牌名称已更新为"争湃·简历大师"</p>
            <p>✅ 所有样式正常加载</p>
        </div>
    </div>
</body>
</html>
