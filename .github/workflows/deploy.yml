name: Deploy SuperResumeMaster
# 强制触发重新构建: 2026-01-15 08:20
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/super-resume-master:latest
          # 禁用缓存以强制重新构建
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

      - name: Copy Compose File to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 111.229.124.138
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/www/wwwroot/ResumeMaster"

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 111.229.124.138
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          debug: true
          script: |
            mkdir -p /www/wwwroot/ResumeMaster
            cd /www/wwwroot/ResumeMaster
            
            # 确保使用正确的配置文件
            mv docker-compose.prod.yml docker-compose.yml || true

            echo "Starting deployment..."
            
            # 定义 docker-compose 命令变量，自动检测可用命令
            if docker compose version >/dev/null 2>&1; then
                DC_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
                DC_CMD="docker-compose"
            else
                echo "Error: Neither 'docker compose' nor 'docker-compose' found."
                exit 1
            fi
            echo "Using command: $DC_CMD"

            # 停止并移除旧容器
            $DC_CMD stop app || true
            $DC_CMD rm -f app || true
            
            # 强制删除旧镜像
            docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/super-resume-master:latest || true
            
            echo "Pulling latest image..."
            $DC_CMD pull app
            
            # 打印当前使用的镜像 ID
            echo "Current Image ID:"
            docker images ${{ secrets.DOCKERHUB_USERNAME }}/super-resume-master:latest --format "{{.ID}}"

            echo "Starting new container..."
            $DC_CMD up -d app
            
            echo "Cleaning up..."
            docker image prune -f
            echo "Deployment finished successfully!"
