name: Deploy SuperResumeMaster
# 强制触发重新构建: 2026-01-15 08:20
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/super-resume-master:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 111.229.124.138
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          debug: true
          script: |
            mkdir -p /www/wwwroot/ResumeMaster
            cd /www/wwwroot/ResumeMaster
            
            echo "Starting deployment..."
            # 停止并移除旧容器，强制删除旧镜像以确保拉取最新
            docker compose stop app || true
            docker compose rm -f app || true
            docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/super-resume-master:latest || true
            
            echo "Pulling latest image..."
            docker compose pull app
            
            echo "Starting new container..."
            docker compose up -d app
            
            echo "Cleaning up..."
            docker image prune -f
            echo "Deployment finished successfully!"
